<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effectiveness Map · Coach Clarity</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Sibling surface to coaching-strategy-panel.html / pattern-map-panel.html.
       The Effectiveness Map is goal-specific and re-takeable, so this page is a
       full tool: assignment management (assign / resend / cancel a client link)
       plus a viewer of every Map generated for the client, newest first. */
    :root {
      --navy: #1a3a52;
      --gold: #c49a3c;
      --teal: #2f6168;
      --cream: #f7f4ee;
      --bg: #f7f5f1;
      --white: #ffffff;
      --border: #e8e4dc;
      --ink: #1a1a1a;
      --muted: #6b6b60;
      --r-sm: 6px; /* compat: the reused Map render uses var(--r-sm) inline */
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'DM Sans', sans-serif; font-size: 18px; background: var(--bg); color: var(--ink); line-height: 1.5; }
    h1, h2, h3 { font-family: 'Cormorant Garamond', serif; color: var(--navy); font-weight: 600; margin: 0 0 8px; }
    h1 { font-size: 1.85rem; }
    .panel { max-width: 980px; margin: 0 auto; padding: 28px 22px 80px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .top-bar a { font-size: 0.85rem; color: var(--muted); text-decoration: none; }
    .top-bar a:hover { color: var(--ink); }
    .meta { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .loader { text-align: center; padding: 60px 20px; color: var(--muted); }
    .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid rgba(196,154,60,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: #fff5f5; border: 1px solid #c44; color: #8a2222; padding: 14px 18px; border-radius: 6px; margin-bottom: 18px; font-size: 0.88rem; }
    .save-btn { border: none; color: #fff; border-radius: var(--r-sm); font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer; transition: opacity 0.12s ease; }
    .save-btn:hover { opacity: 0.92; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Coach-facing helper glosses (item 4): plain-language definitions next to
       Evidence / Confidence / Cross-domain tax. */
    .help-tip { cursor: help; color: var(--muted); font-weight: 400; font-size: 0.7rem; margin-left: 4px; border-bottom: 1px dotted var(--muted); }
    .help-note { font-size: 0.72rem; color: var(--muted); font-style: italic; line-height: 1.5; margin: 0 0 10px; }

    /* Goal navigation: slim sticky rail beside the full-width stacked cards (≥2 goals).
       Cards keep their own column width and stacking — this is anchor nav, not a swap. */
    .goal-nav-layout { display: flex; align-items: flex-start; gap: 22px; }
    .goal-cards-col { flex: 1; min-width: 0; }
    .goal-rail {
      flex: 0 0 196px; position: sticky; top: 16px; align-self: flex-start;
      background: var(--white); border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 10px 8px; max-height: calc(100vh - 32px); overflow-y: auto;
    }
    .goal-rail-label { font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 4px 10px 8px; }
    .goal-nav-item {
      display: block; text-decoration: none; padding: 8px 10px; border-radius: var(--r-sm);
      border-left: 3px solid transparent; margin-bottom: 2px; cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .goal-nav-item:hover { background: var(--cream); }
    .goal-nav-item.active { background: rgba(196,154,60,0.12); border-left-color: var(--gold); }
    .goal-nav-title { display: block; font-family: 'Cormorant Garamond', serif; font-size: 0.9rem; font-weight: 600; color: var(--navy); line-height: 1.2; }
    .goal-nav-date { display: block; font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .goal-card { scroll-margin-top: 16px; }

    /* Collapsed opener disclosure (shown only when earlier Maps exist). */
    .effmap-opener-s { list-style: none; }
    .effmap-opener-s::-webkit-details-marker { display: none; }
    .effmap-opener-s:hover { background: rgba(196,154,60,0.08); }
    .effmap-opener-caret { color: var(--gold); transition: transform 0.15s ease; }
    .effmap-opener-d[open] .effmap-opener-caret { transform: rotate(180deg); }

    /* Narrow screens: rail collapses to a sticky horizontal bar of goal chips. */
    @media (max-width: 720px) {
      .goal-nav-layout { flex-direction: column; gap: 12px; }
      .goal-rail {
        position: sticky; top: 0; z-index: 20; flex: 1 1 auto; width: 100%;
        display: flex; gap: 6px; overflow-x: auto; max-height: none; padding: 8px 10px;
        box-shadow: 0 2px 8px rgba(26,58,82,0.06);
      }
      .goal-rail-label { display: none; }
      .goal-nav-item { flex: 0 0 auto; white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; padding: 6px 10px; }
      .goal-nav-item.active { border-left-color: transparent; border-bottom-color: var(--gold); }
      .goal-nav-title { font-size: 0.84rem; }
      .goal-card { scroll-margin-top: 72px; }
    }

    @media (max-width: 600px) {
      .panel { padding: 20px 14px 60px; }
      .top-bar { flex-direction: column; align-items: flex-start; }
      .card { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="top-bar">
      <div>
        <div class="meta" style="margin-bottom:6px;">Effectiveness Map</div>
        <h1 id="client-heading">Loading…</h1>
        <div class="meta" id="header-meta" style="text-transform:none;letter-spacing:0;font-size:0.82rem;color:var(--muted);">&nbsp;</div>
      </div>
      <a href="/coach-dashboard.html" id="back-link" onclick="if(document.referrer && document.referrer.indexOf('/coach-dashboard.html') !== -1){history.back();return false;}">← Back to dashboard</a>
    </div>

    <div id="content">
      <div class="loader">
        <div class="spinner"></div>
        <div>Loading Effectiveness Map…</div>
      </div>
    </div>
  </div>

  <script>
  const SUPABASE_URL = 'https://qroizygknxdjsstkezsf.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4';
  const TOKEN_KEY = 'sb_access_token';

  // P.I.P.E.S. display order — mirrors coach-dashboard.html.
  var EFFMAP_DOMAINS = [
    ['physical', 'Physical'], ['intellectual', 'Intellectual'],
    ['psychological', 'Psychological'], ['environmental', 'Environmental'],
    ['social', 'Social']
  ];

  const params = new URLSearchParams(location.search);
  const clientEmail = params.get('client_email') || '';
  let coachId = null;
  let mapsState = [];
  let assignmentsState = [];
  let usageState = null;

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function apiHeaders() {
    const token = localStorage.getItem(TOKEN_KEY);
    return {
      apikey: ANON_KEY,
      Authorization: token ? ('Bearer ' + token) : ('Bearer ' + ANON_KEY),
      'Content-Type': 'application/json',
    };
  }
  function showError(msg) { $('content').innerHTML = '<div class="error-box">' + escapeHtml(msg) + '</div>'; }

  /* ---- auth guard + header (mirrors the sibling tool pages) ---- */
  async function loadCoachProfile() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { window.location.href = '/coach-dashboard.html'; return null; }
    const userRes = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + token } });
    if (!userRes.ok) { window.location.href = '/coach-dashboard.html'; return null; }
    const user = await userRes.json();
    const profRes = await fetch(SUPABASE_URL + '/rest/v1/coach_profiles?user_email=eq.' + encodeURIComponent(user.email.toLowerCase()) + '&select=id,display_name', { headers: apiHeaders() });
    const profRows = await profRes.json();
    if (!Array.isArray(profRows) || profRows.length === 0) {
      showError('No coach profile found for ' + user.email);
      return null;
    }
    return profRows[0];
  }

  async function loadClientNameFallback(email) {
    if (!email) return null;
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/coach_bookings?coach_id=eq.' + coachId + '&client_email=eq.' + encodeURIComponent(email) + '&select=notes', { headers: apiHeaders() });
      if (!res.ok) return null;
      const rows = await res.json();
      if (!Array.isArray(rows)) return null;
      for (const r of rows) {
        const m = ((r && r.notes) || '').match(/^Name:\s*(.+)/m);
        if (m) return m[1].trim();
      }
      return null;
    } catch (_) { return null; }
  }

  async function applyHeader(maps) {
    let name = await loadClientNameFallback(clientEmail);
    if (!name) name = clientEmail;
    $('client-heading').textContent = name;
    const parts = [];
    if (clientEmail && name !== clientEmail) parts.push(clientEmail);
    parts.push(maps.length + ' Map' + (maps.length === 1 ? '' : 's'));
    $('header-meta').textContent = parts.join(' · ');
  }

  /* ---- data ---- */
  // Maps via the existing coach-scoped endpoint (coach derived from the JWT;
  // returns coaching, non-crisis Maps newest-first).
  async function fetchMaps() {
    const res = await fetch('/api/map-coach-read', {
      method: 'POST', headers: apiHeaders(), body: JSON.stringify({ client_email: clientEmail })
    });
    const data = await res.json().catch(function() { return null; });
    return (data && data.ok && Array.isArray(data.maps)) ? data.maps : [];
  }
  // Assignment rows (coach-readable via RLS) for the assign/resend/cancel bar.
  async function fetchAssignments() {
    try {
      const url = SUPABASE_URL + '/rest/v1/effectiveness_map_assignments?coach_id=eq.' + coachId
        + '&client_email=eq.' + encodeURIComponent(String(clientEmail).toLowerCase())
        + '&product_context=eq.coaching&order=assigned_at.desc'
        + '&select=session_id,status,assigned_at,expires_at,completed_at';
      const res = await fetch(url, { headers: apiHeaders() });
      if (!res.ok) return [];
      const rows = await res.json();
      return Array.isArray(rows) ? rows : [];
    } catch (_) { return []; }
  }
  // Monthly usage counter (coach derived from the JWT). Reads the SAME source the
  // assign/generate gates enforce, so the count shown matches what's allowed.
  // Returns null on any failure → the counter is simply hidden (never a false number).
  async function fetchUsage() {
    try {
      const res = await fetch('/api/effectiveness-map-usage', { headers: apiHeaders() });
      const data = await res.json().catch(function() { return null; });
      return (data && data.ok) ? data : null;
    } catch (_) { return null; }
  }

  /* =========================================================================
     Map render — reused verbatim from coach-dashboard.html so v1.5, v1.6 and
     v1.7 Maps all render through one path. Only additions: the explorer opener
     (shown at the top of each Map on this page) and the coach-facing helper
     glosses on Evidence / Confidence / Cross-domain tax (item 4).
     ========================================================================= */
  function effmapMessage(msg) {
    return '<p style="color:var(--muted);font-size:0.88rem;font-style:italic;margin:0;">' + escapeHtml(msg) + '</p>';
  }
  function effmapDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function effmapParas(s, style) {
    return String(s == null ? '' : s).split(/\n\s*\n/)
      .map(function(p) { return p.trim(); })
      .filter(function(p) { return p; })
      .map(function(p) { return '<p style="' + style + '">' + escapeHtml(p) + '</p>'; })
      .join('');
  }

  // Explorer opener ("Why this is different") — v1.7 only; absent on older Maps.
  // collapsed (Ticket 3 follow-up): when the goal has earlier Maps, hide the opener
  // behind a small disclosure so it doesn't repeat above every Map; first-time
  // (single-Map) goals still render it expanded.
  function effmapOpenerHtml(m, collapsed) {
    var efo = (m && m.explorer_facing_output && typeof m.explorer_facing_output === 'object') ? m.explorer_facing_output : {};
    var op = efo.opener;
    if (!op || !String(op).trim()) return '';
    var lines = String(op).split(/\n\s*\n/).map(function(s) { return s.trim(); }).filter(Boolean);
    var head = (lines.length > 1 && lines[0].length < 60) ? lines.shift() : 'Why this is different';
    var inner = '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.1rem;font-weight:600;color:var(--navy);margin-bottom:8px;">' + escapeHtml(head) + '</div>'
      + lines.map(function(p) { return '<p style="margin:0 0 10px;font-size:0.88rem;line-height:1.6;color:var(--ink);">' + escapeHtml(p) + '</p>'; }).join('');
    if (collapsed) {
      return '<details class="effmap-opener-d" style="margin:0 0 20px;background:var(--cream);border-radius:var(--r-sm);overflow:hidden;">'
        + '<summary class="effmap-opener-s" style="cursor:pointer;padding:11px 16px;font-size:0.85rem;font-weight:600;color:var(--navy);display:flex;justify-content:space-between;align-items:center;">'
        +   '<span>About this Map</span><span class="effmap-opener-caret">&#9662;</span>'
        + '</summary>'
        + '<div style="padding:0 18px 16px;">' + inner + '</div>'
        + '</details>';
    }
    return '<div style="margin:0 0 20px;padding:16px 18px;background:var(--cream);border-radius:var(--r-sm);">' + inner + '</div>';
  }

  function effmapReadingOrderHtml(m) {
    var efo = (m && m.explorer_facing_output && typeof m.explorer_facing_output === 'object') ? m.explorer_facing_output : {};
    var ds = (efo.domain_statuses && typeof efo.domain_statuses === 'object') ? efo.domain_statuses : {};
    var out = '';

    var snaps = '';
    EFFMAP_DOMAINS.forEach(function(d) {
      var p = ds[d[0]] && ds[d[0]].snapshot_paragraph;
      if (p && String(p).trim()) snaps += '<p style="margin:0 0 14px;font-size:0.9rem;line-height:1.6;color:var(--ink);">' + escapeHtml(p) + '</p>';
    });
    if (snaps) out += '<div style="margin-bottom:20px;">' + snaps + '</div>';

    var sp = efo.system_picture && efo.system_picture.narrative;
    if (sp && String(sp).trim()) {
      out += '<div style="margin:0 0 20px;">'
        + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.05rem;font-weight:600;color:var(--gold);margin-bottom:6px;">The Whole Picture</div>'
        + effmapParas(sp, 'margin:0 0 14px;font-size:0.95rem;line-height:1.65;color:var(--ink);')
        + '</div>';
    }

    var hts = efo.how_this_shows_up;
    if (hts && String(hts).trim()) {
      out += '<div style="margin:0 0 20px;">'
        + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.05rem;font-weight:600;color:var(--gold);margin-bottom:6px;">How this shows up for you</div>'
        + effmapParas(hts, 'margin:0 0 14px;font-size:0.9rem;line-height:1.6;color:var(--ink);')
        + '</div>';
    }

    // Explorer-facing through v1.5; coach-only from v1.6 (see Intelligence Notes).
    var tax = efo.cross_domain_tax;
    if (tax && tax.narrative && String(tax.narrative).trim()) {
      out += '<div style="margin:0 0 20px;">'
        + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.05rem;font-weight:600;color:var(--gold);margin-bottom:6px;">Where the load is moving</div>'
        + '<p style="margin:0;font-size:0.9rem;line-height:1.6;color:var(--ink);">' + escapeHtml(tax.narrative) + '</p>'
        + '</div>';
    }

    // v1.7: closing summary — for/against per area; absent on older Maps.
    var cs = efo.closing_summary;
    if (cs && typeof cs === 'object') {
      var DIR_LABELS = { 'for': 'Working for the goal', against: 'Working against it', both: 'Cuts both ways', neutral: '—' };
      var csRows = '';
      EFFMAP_DOMAINS.forEach(function(d) {
        var c = cs[d[0]];
        if (!c || typeof c !== 'object') return;
        csRows += '<div style="display:flex;gap:10px;align-items:baseline;margin:0 0 8px;">'
          + '<span style="flex:0 0 100px;font-family:\'Cormorant Garamond\',serif;font-size:0.92rem;font-weight:600;color:var(--navy);">' + escapeHtml(d[1]) + '</span>'
          + '<span style="flex:0 0 auto;font-size:0.62rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold);white-space:nowrap;">' + escapeHtml(DIR_LABELS[c.direction] || '—') + '</span>'
          + (c.plain && String(c.plain).trim() ? '<span style="font-size:0.85rem;line-height:1.5;color:var(--ink);">' + escapeHtml(c.plain) + '</span>' : '')
          + '</div>';
      });
      if (csRows) {
        out += '<div style="margin:0 0 20px;">'
          + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.05rem;font-weight:600;color:var(--gold);margin-bottom:8px;">In short</div>'
          + csRows + '</div>';
      }
    }

    var rq = efo.release_question && efo.release_question.question;
    if (rq && String(rq).trim()) {
      out += '<div style="margin:0 0 22px;padding:16px 18px;background:rgba(196,154,60,0.10);border-radius:var(--r-sm);">'
        + '<div style="font-size:0.7rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;">A question to sit with</div>'
        + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.15rem;font-weight:600;color:var(--navy);line-height:1.3;">' + escapeHtml(rq) + '</div>'
        + '</div>';
    }

    var cells = '';
    EFFMAP_DOMAINS.forEach(function(d) {
      var v = ds[d[0]] && ds[d[0]].primary_status;
      var has = v && String(v).trim();
      cells += '<div style="flex:1;min-width:90px;text-align:center;">'
        + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:0.9rem;font-weight:600;color:var(--navy);">' + escapeHtml(d[1]) + '</div>'
        + '<div style="font-size:0.68rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:' + (has ? 'var(--gold)' : 'var(--muted)') + ';margin-top:3px;">' + escapeHtml(has ? v : '—') + '</div>'
        + '</div>';
    });
    out += '<div style="display:flex;flex-wrap:wrap;gap:12px;padding-top:16px;border-top:1px solid var(--border);">' + cells + '</div>';

    // v1.7: status legend under the chips (shown to both audiences).
    if (efo.status_legend && String(efo.status_legend).trim()) {
      var legendItems = String(efo.status_legend).split(/\n+/)
        .map(function(l) { return l.replace(/^[-*\s]+/, '').replace(/\*\*/g, '').trim(); })
        .filter(function(l) { return l; })
        .map(function(l) {
          var lm = l.match(/^(\w+)\s*[—–-]\s*(.+)$/);
          return '<p style="margin:0 0 6px;font-size:0.78rem;line-height:1.5;color:var(--muted);">'
            + (lm ? '<strong style="color:var(--navy);font-weight:600;">' + escapeHtml(lm[1]) + '</strong> — ' + escapeHtml(lm[2]) : escapeHtml(l))
            + '</p>';
        }).join('');
      if (legendItems) out += '<div style="margin-top:12px;">' + legendItems + '</div>';
    }

    return out || effmapMessage('This Map has no displayable content.');
  }

  // Coach-only Intelligence Notes. Item 4 adds plain-language glosses next to
  // Evidence, Confidence, and Cross-domain tax. Reads v1.5 (raw.domain_statuses)
  // and v1.6+/v1.7 (raw.explorer_facing.domains / raw.coach_facing) shapes.
  var HELP_EVIDENCE = 'how much the client’s answers gave us to work with in this area';
  var HELP_CONFIDENCE = 'how strongly the read in this area is supported by what they wrote';
  var HELP_TAX = 'when one area of life is quietly draining or carrying another';
  function helpTip(text) {
    return '<span class="help-tip" title="' + escapeHtml(text) + '">ⓘ</span>';
  }
  // v1.8.0 coach layer: new field order (coach_synthesis -> working_hypothesis ->
  // cross_domain_dynamic -> leverage_point -> session_stance -> session_questions ->
  // interpretation_support, collapsed). Falls through to the legacy render below when the
  // new fields are absent (old rows), so no Map renders broken. idSuffix keeps the nested
  // collapsible ids unique across cards.
  function effmapIntelNew(cf, ds, idSuffix) {
    var sid = (idSuffix == null ? '' : idSuffix);
    function label(t) { return '<div style="font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;">' + escapeHtml(t) + '</div>'; }
    function sec(t, s) {
      if (!s || !String(s).trim()) return '';
      return '<div style="margin-bottom:14px;">' + label(t)
        + effmapParas(String(s), 'margin:0 0 12px;font-size:0.88rem;line-height:1.6;color:var(--ink);') + '</div>';
    }
    var out = '';
    out += sec('Coach synthesis', cf.coach_synthesis);
    out += sec('Working hypothesis', cf.working_hypothesis);
    out += sec('Cross-domain dynamic', cf.cross_domain_dynamic);
    out += sec('Leverage point', cf.leverage_point);
    out += sec('Session stance', cf.session_stance);
    var qs = Array.isArray(cf.session_questions) ? cf.session_questions.filter(function(q){ return q && String(q).trim(); }) : [];
    if (qs.length) {
      out += '<div style="margin-bottom:14px;">' + label('Questions for the session')

    var is = (cf.interpretation_support && typeof cf.interpretation_support === 'object') ? cf.interpretation_support : {};

        + '</tr>';

    var supInner = '';
    if (is.overall) supInner += '<div style="font-size:0.85rem;color:var(--ink);margin-bottom:8px;"><strong style="font-weight:600;">Overall:</strong> ' + escapeHtml(is.overall) + '</div>';

      + '<th style="text-align:left;padding:6px 10px;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">Confidence</th>'
      + '</tr></thead><tbody>' + supRows + '</tbody></table>';
    out += effmapCollapsible('effmap-intel-support-' + sid, 'Interpretation support', supInner);
    // Opener moved out of the inline layer (C: not displayed inline) — behind a collapsible.
    if (cf.opener && String(cf.opener).trim()) {
      out += effmapCollapsible('effmap-intel-opener-' + sid, 'How this Map works',

  }
  function effmapIntelHtml(m, idSuffix) {

    // New-contract render when any v1.8.0 coach field is present; else legacy fallback below.

    });
    return head

      + '<table style="width:100%;border-collapse:collapse;margin-bottom:6px;"><thead><tr>'
      +   '<th style="text-align:left;padding:6px 10px;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">Domain</th>'
      +   '<th style="text-align:left;padding:6px 10px;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">Evidence' + helpTip(HELP_EVIDENCE) + '</th>'

  function effmapCollapsible(id, title, innerHtml) {
    return '<div style="border:1px solid var(--border);border-radius:var(--r-sm);margin-top:16px;overflow:hidden;">'
      + '<button type="button" data-effmap-toggle="' + id + '" style="width:100%;text-align:left;background:var(--cream);border:none;cursor:pointer;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;font-family:\'Cormorant Garamond\',serif;font-size:0.98rem;font-weight:600;color:var(--navy);">'

  function wireEffmapToggles(container) {
    container.querySelectorAll('[data-effmap-toggle]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var target = document.getElementById(btn.getAttribute('data-effmap-toggle'));
        if (!target) return;
        var open = target.style.display !== 'none';
        target.style.display = open ? 'none' : 'block';

        if (caret) caret.textContent = open ? '▾' : '▴';

  /* =========================================================================
     Assignment management — assign / resend / cancel / copy a client link.
     Reused from coach-dashboard.html, retargeted to this page's #assign-bar.
     ========================================================================= */
  function effmapIsExpired(a) {
    var t = new Date(a.expires_at).getTime();
    return isFinite(t) && Date.now() > t;
  }
  function effmapActiveAssignment(list) {
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      if (a && (a.status === 'pending' || a.status === 'in_progress') && !effmapIsExpired(a)) return a;
    }
    return null;
  }
  function effmapEmptyHtml(email) {
    return '<div style="padding:4px 0;">'
      + '<div style="font-size:0.9rem;line-height:1.65;color:var(--ink);text-align:left;margin-bottom:20px;">'
      +   '<p style="margin:0 0 14px;">Most inventories tell you who your client is. The Effectiveness Map tells you how they are showing up right now, toward a specific goal they are actively working on.</p>'
      +   '<p style="margin:0 0 14px;">It reads across five domains (Physical, Intellectual, Psychological, Environmental, and Social) and surfaces which ones are fueling the work, which are quietly creating drag, and where there is capacity that has not yet been recruited into the goal.</p>'
      +   '<p style="margin:0;">Your client answers ten open-ended questions and receives the same structured read you do. Use it when a client starts a new goal, when momentum stalls, or when something feels off but you cannot locate it yet.</p>'
      + '</div>'
      + '<div style="text-align:center;">'
      +   '<button class="save-btn" id="effmap-assign-btn" data-client-email="' + escapeHtml(email) + '" style="padding:10px 22px;font-size:0.82rem;background:var(--gold);">Assign Effectiveness Map</button>'
      + '</div>'
      + '</div>';
  }
  function effmapStatusCardHtml(a, link) {
    var statusLabel = a.status === 'in_progress' ? 'In progress' : 'Pending';
    return '<div style="border:1px solid var(--border);border-radius:var(--r-sm);padding:16px 18px;background:var(--cream);">'
      + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">'
      +   '<span style="font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#fff;background:var(--gold);border-radius:999px;padding:3px 10px;">' + escapeHtml(statusLabel) + '</span>'
      +   '<span style="font-size:0.82rem;color:var(--muted);">Sent ' + escapeHtml(effmapDate(a.assigned_at)) + '</span>'
      + '</div>'
      + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">'
      +   '<input type="text" readonly id="effmap-link-input" value="' + escapeHtml(link || '') + '" placeholder="Click Copy link to generate the link" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:0.8rem;color:var(--ink);background:var(--white);">'
      +   '<button type="button" class="save-btn" data-effmap-copy data-session-id="' + escapeHtml(a.session_id) + '" style="padding:8px 16px;font-size:0.8rem;background:var(--gold);white-space:nowrap;">Copy link</button>'
      + '</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
      +   '<button type="button" data-effmap-email data-session-id="' + escapeHtml(a.session_id) + '" style="padding:7px 14px;font-size:0.8rem;background:var(--gold);border:1px solid var(--gold);color:#fff;border-radius:999px;cursor:pointer;">Send to client</button>'
      +   '<button type="button" data-effmap-resend data-session-id="' + escapeHtml(a.session_id) + '" style="padding:7px 14px;font-size:0.8rem;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;cursor:pointer;">Resend</button>'
      +   '<button type="button" data-effmap-cancel data-session-id="' + escapeHtml(a.session_id) + '" style="padding:7px 14px;font-size:0.8rem;background:none;border:1px solid var(--border);color:var(--muted);border-radius:999px;cursor:pointer;">Cancel</button>'
      + '</div>'
      + '<div data-effmap-msg style="font-size:0.78rem;color:var(--muted);margin-top:8px;min-height:1em;"></div>'
      + '</div>';
  }
  // "X of Y Maps used this month · Z remaining" with a soft warning as the coach
  // nears the limit, and a clear at-limit state. Hidden entirely when the count is
  // unavailable (u==null / count_unavailable) so we never show a misleading number.
  // The assign-action consent prompt at the limit is wired separately.
  function effmapUsageHtml(u) {
    if (!u || u.count_unavailable || u.used == null || u.limit == null) return '';
    var used = u.used, limit = u.limit;
    var remaining = (u.remaining == null) ? Math.max(0, limit - used) : u.remaining;
    var atLimit = !!u.at_limit || remaining <= 0;
    var warnAt = Math.max(1, Math.ceil(limit * 0.2)); // "approaching" = within ~20% of the cap
    var approaching = !atLimit && remaining <= warnAt;
    var bg = atLimit ? 'rgba(154,43,43,0.08)' : approaching ? 'rgba(196,154,60,0.12)' : 'var(--cream)';
    var fg = atLimit ? '#9a2b2b' : approaching ? '#8a6d1f' : 'var(--muted)';
    var bd = atLimit ? 'rgba(154,43,43,0.25)' : approaching ? 'rgba(196,154,60,0.35)' : 'var(--border)';
    var line = used + ' of ' + limit + ' Maps used this month · ' + remaining + ' remaining';
    var note = atLimit ? 'You’ve reached your monthly limit.'
      : approaching ? (remaining === 1 ? 'Just 1 Map left this month.' : 'You’re close to your monthly limit.')
      : '';
    return '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;'
      + 'padding:8px 12px;margin-bottom:14px;border:1px solid ' + bd + ';border-radius:var(--r-sm);background:' + bg + ';">'
      + '<span style="font-size:0.82rem;font-weight:600;color:' + ((atLimit || approaching) ? fg : 'var(--navy)') + ';">' + escapeHtml(line) + '</span>'
      + (note ? '<span style="font-size:0.78rem;color:' + fg + ';">' + escapeHtml(note) + '</span>' : '')
      + '</div>';
  }
  // True only when we have a reliable count AND it has hit the cap. A null/unknown
  // usage state never triggers the overage flow (the server gate still applies).
  function effmapAtLimit() {
    return !!(usageState && !usageState.count_unavailable && usageState.at_limit);
  }

  // Overage purchase options (brief: $4 each, or a 5-for-$20 block).
  var OVERAGE_OPTIONS = [
    { id: 'single', label: '1 additional Map', price: '$4', sub: 'One extra Map this month' },
    { id: 'block5', label: '5 additional Maps', price: '$20', sub: 'A block of five, $4 each' },
  ];

  // At-limit consent prompt shown IN PLACE of the assign action. The coach must
  // pick an option and confirm. Billing is a separate follow-up — see
  // effmapConfirmOverage — so confirming does NOT generate a Map yet.
  function effmapOverageConsentHtml(u) {
    var limit = (u && u.limit != null) ? String(u.limit) : '';
    var opts = OVERAGE_OPTIONS.map(function(o) {
      return '<label data-overage-opt="' + o.id + '" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:var(--white);transition:all 0.15s ease;">'
        + '<input type="radio" name="overage-choice" value="' + o.id + '" style="accent-color:var(--gold);width:16px;height:16px;cursor:pointer;">'
        + '<span style="flex:1;min-width:0;">'
        +   '<span style="display:block;font-size:0.88rem;font-weight:600;color:var(--navy);">' + escapeHtml(o.label) + '</span>'
        +   '<span style="display:block;font-size:0.76rem;color:var(--muted);">' + escapeHtml(o.sub) + '</span>'
        + '</span>'
        + '<span style="font-family:\'Cormorant Garamond\',serif;font-size:1.15rem;font-weight:700;color:var(--gold);">' + escapeHtml(o.price) + '</span>'
        + '</label>';
    }).join('');
    return '<div style="border:1px solid rgba(154,43,43,0.25);border-radius:var(--r-sm);padding:16px 18px;background:rgba(154,43,43,0.05);">'
      + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.05rem;font-weight:600;color:var(--navy);margin-bottom:6px;">You’ve reached your monthly limit</div>'
      + '<p style="margin:0 0 14px;font-size:0.85rem;line-height:1.6;color:var(--ink);">You’ve used all ' + escapeHtml(limit) + ' of your Maps this month. You can add more at <strong>$4 each</strong> — choose how many, then confirm.</p>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">' + opts + '</div>'
      + '<div data-overage-msg style="font-size:0.78rem;color:var(--muted);margin:0 0 12px;min-height:1em;line-height:1.5;"></div>'
      + '<div style="display:flex;gap:8px;">'
      +   '<button type="button" data-overage-confirm class="save-btn" disabled style="padding:9px 18px;font-size:0.8rem;background:var(--gold);opacity:0.5;cursor:not-allowed;">Confirm &amp; continue</button>'
      +   '<button type="button" data-overage-cancel style="padding:9px 16px;font-size:0.8rem;background:none;border:1px solid var(--border);color:var(--muted);border-radius:999px;cursor:pointer;">Not now</button>'
      + '</div>'
      + '</div>';
  }

  function effmapShowOverageConsent(bar, email) {
    bar.innerHTML = effmapOverageConsentHtml(usageState);
    wireOverageConsent(bar, email);
  }

  function wireOverageConsent(container, email) {
    var confirmBtn = container.querySelector('[data-overage-confirm]');
    function enableConfirm() {
      if (!confirmBtn) return;
      confirmBtn.disabled = false;
      confirmBtn.style.opacity = '1';
      confirmBtn.style.cursor = 'pointer';
    }
    container.querySelectorAll('input[name="overage-choice"]').forEach(function(r) {
      r.addEventListener('change', enableConfirm);
    });
    if (confirmBtn) confirmBtn.addEventListener('click', function() { effmapConfirmOverage(container, email); });
    var cancelBtn = container.querySelector('[data-overage-cancel]');
    if (cancelBtn) cancelBtn.addEventListener('click', function() {
      // Back out to the normal assign bar (no purchase, no Map).
      container.innerHTML = effmapAssignBarHtml(email, mapsState, assignmentsState);
      wireEffmapAssignment(container, email);
    });
  }

  function effmapConfirmOverage(container, email) {
    var sel = container.querySelector('input[name="overage-choice"]:checked');
    var choice = sel ? sel.value : '';
    if (!choice) return;
    // ──────────────────────────────────────────────────────────────────────────
    // TODO (Stripe follow-up): initiate the $4 (single) / $20 (5-block) charge
    // here, and only on a successful charge proceed to assign/generate the
    // overage Map(s). Until billing is wired, overage purchases are NOT completed
    // and NO Map is generated past the monthly limit (no free overage). We lock
    // the prompt and surface a clear coming-soon state; the coach's choice is
    // captured in the UI only.
    // ──────────────────────────────────────────────────────────────────────────
    var confirmBtn = container.querySelector('[data-overage-confirm]');
    if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.style.opacity = '0.5'; confirmBtn.style.cursor = 'not-allowed'; }
    container.querySelectorAll('input[name="overage-choice"]').forEach(function(r) { r.disabled = true; });
    var msg = container.querySelector('[data-overage-msg]');
    if (msg) {
      msg.style.color = 'var(--navy)';
      msg.textContent = (choice === 'block5' ? 'A 5-Map block is noted. ' : 'One additional Map is noted. ')
        + 'Overage purchases aren’t available just yet — payment is coming soon, and no Map is generated until then.';
    }
  }

  function effmapAssignBarHtml(email, maps, assignments) {
    var active = effmapActiveAssignment(assignments);
    if (active) return effmapStatusCardHtml(active, null);
    if (!maps.length) {
      var latest = assignments[0] || null;
      var pre = '';
      if (latest && (latest.status === 'expired' || effmapIsExpired(latest))) {
        pre = '<p style="font-size:0.82rem;color:var(--muted);font-style:italic;margin:0 0 12px;">A previous link expired on ' + escapeHtml(effmapDate(latest.expires_at)) + '.</p>';
      }
      return pre + effmapEmptyHtml(email);
    }
    // Maps exist, nothing in flight — the top action stays goal-agnostic: a fresh
    // Map where the client names a brand-new goal. Per-goal "Update this goal" lives
    // inside each goal card below (not here), so it can carry that card's own goal.
    return '<div style="text-align:center;">'
      + '<button type="button" class="save-btn" id="effmap-assign-btn" data-client-email="' + escapeHtml(email) + '" style="padding:9px 20px;font-size:0.8rem;background:var(--gold);">Map a new goal</button>'
      + '</div>';
  }
  function wireEffmapAssignment(container, email) {
    // "Map a new goal" / "Assign Effectiveness Map" (empty state) — fresh, no goal.
    // (Per-goal "Update this goal" lives inside the goal cards, wired separately.)
    var assignBtn = container.querySelector('#effmap-assign-btn');
    if (assignBtn) assignBtn.addEventListener('click', function() {
      // At the monthly limit, the assign action becomes an overage consent prompt
      // instead of a generation request — the server gate is unchanged and still
      // the source of truth; this just gives the coach a clear in-product path.
      if (effmapAtLimit()) { effmapShowOverageConsent(container, email); return; }
      effmapAssign(assignBtn, email);
    });
    var copyBtn = container.querySelector('[data-effmap-copy]');
    if (copyBtn) copyBtn.addEventListener('click', function() { effmapCopy(container, email, copyBtn.getAttribute('data-session-id')); });
    var resendBtn = container.querySelector('[data-effmap-resend]');
    if (resendBtn) resendBtn.addEventListener('click', function() { effmapResend(container, email, resendBtn.getAttribute('data-session-id')); });
    var cancelBtn = container.querySelector('[data-effmap-cancel]');
    if (cancelBtn) cancelBtn.addEventListener('click', function() { effmapCancel(container, email, cancelBtn.getAttribute('data-session-id')); });
    var emailBtn = container.querySelector('[data-effmap-email]');
    if (emailBtn) emailBtn.addEventListener('click', function() { effmapEmail(container, email, emailBtn.getAttribute('data-session-id')); });
  }
  // Send to client — emails the intake link to the client via Resend (server side,
  // action:'email' on assign-effectiveness-map). The copy-link flow stays available.
  async function effmapEmail(container, email, sessionId) {
    var btn = container.querySelector('[data-effmap-email]');
    if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
    effmapSetMsg(container, 'Sending the link to your client…', false);
    try {
      var res = await fetch('/api/assign-effectiveness-map', {
        method: 'POST', headers: apiHeaders(),
        body: JSON.stringify({ client_email: email, action: 'email', session_id: sessionId })
      });
      var data = await res.json().catch(function() { return null; });
      if (!res.ok || !data || !data.ok) {
        effmapSetMsg(container, (data && data.error) || 'Could not send the link. Copy it and send it manually.', true);
      } else {
        effmapSetMsg(container, 'Sent to ' + email + '. They’ll get an email with their link.', false);
      }
    } catch (e) {
      effmapSetMsg(container, 'Could not send the link. Copy it and send it manually.', true);
    }
    if (btn) { btn.disabled = false; btn.textContent = 'Send to client'; }
  }
  function effmapSetMsg(container, msg, isError) {
    var el = container.querySelector('[data-effmap-msg]');
    if (!el) {
      el = container.querySelector('#effmap-flash');
      if (!el) {
        el = document.createElement('p');
        el.id = 'effmap-flash';
        el.style.cssText = 'font-size:0.8rem;margin:10px 0 0;';
        container.appendChild(el);
      }
    }
    el.textContent = msg || '';
    el.style.color = isError ? '#9a2b2b' : 'var(--muted)';
  }
  async function effmapClipboard(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
  }
  async function effmapAssign(btn, email, carryGoal) {
    var bar = $('assign-bar');
    btn.disabled = true;
    var orig = btn.textContent;
    btn.textContent = 'Creating link…';
    try {
      // carryGoal present → re-take: the assignment carries the goal forward so the
      // intake pre-fills it and the new Map files under the same goal. Absent → fresh.
      var payload = (carryGoal && String(carryGoal).trim() !== '')
        ? { client_email: email, goal: String(carryGoal) }
        : { client_email: email };
      var res = await fetch('/api/assign-effectiveness-map', {
        method: 'POST', headers: apiHeaders(), body: JSON.stringify(payload)
      });
      var data = await res.json().catch(function() { return null; });
      if (!res.ok || !data || !data.ok) {
        btn.disabled = false; btn.textContent = orig;
        if (data && data.code === 'SUBSCRIPTION_INACTIVE') {
          effmapSetMsg(bar, 'A subscription is required to assign Maps. Visit your account settings to activate or renew.', false);
        } else {
          effmapSetMsg(bar, (data && data.error) || 'Could not create the link. Please try again.', true);
        }
        return false;
      }
      var active = { session_id: data.session_id, status: data.status || 'pending', assigned_at: data.assigned_at, expires_at: data.expires_at };
      bar.innerHTML = effmapStatusCardHtml(active, data.link);
      wireEffmapAssignment(bar, email);
      effmapSetMsg(bar, 'Link created. Copy it and send it to your client.', false);
      return true;
    } catch (e) {
      btn.disabled = false; btn.textContent = orig;
      effmapSetMsg(bar, 'Could not create the link. Please try again.', true);
      return false;
    }
  }
  async function effmapFetchLink(email, sessionId) {
    try {
      var res = await fetch('/api/assign-effectiveness-map', {
        method: 'POST', headers: apiHeaders(),
        body: JSON.stringify({ client_email: email, action: 'resend', session_id: sessionId })
      });
      var data = await res.json().catch(function() { return null; });
      return (res.ok && data && data.ok && data.link) ? data.link : '';
    } catch (e) { return ''; }
  }
  async function effmapCopy(container, email, sessionId) {
    var input = container.querySelector('#effmap-link-input');
    var link = input && input.value ? input.value : '';
    if (!link) {
      link = await effmapFetchLink(email, sessionId);
      if (!link) { effmapSetMsg(container, 'Could not generate the link. Try Resend.', true); return; }
      if (input) input.value = link;
    }
    var ok = await effmapClipboard(link);
    effmapSetMsg(container, ok ? 'Link copied to clipboard.' : 'Copy failed — select the link above and copy manually.', !ok);
  }
  async function effmapResend(container, email, sessionId) {
    effmapSetMsg(container, 'Refreshing link…', false);
    var link = await effmapFetchLink(email, sessionId);
    if (!link) { effmapSetMsg(container, 'Could not refresh the link. If it has expired, assign a new one.', true); return; }
    var input = container.querySelector('#effmap-link-input');
    if (input) input.value = link;
    var ok = await effmapClipboard(link);
    effmapSetMsg(container, ok ? 'Link copied — paste it to your client.' : 'Link ready — copy it from the field above.', false);
  }
  async function effmapCancel(container, email, sessionId) {
    if (!window.confirm('Cancel this Effectiveness Map link? Your client will no longer be able to use it.')) return;
    effmapSetMsg(container, 'Cancelling…', false);
    try {
      var res = await fetch('/api/assign-effectiveness-map', {
        method: 'POST', headers: apiHeaders(),
        body: JSON.stringify({ client_email: email, action: 'cancel', session_id: sessionId })
      });
      var data = await res.json().catch(function() { return null; });
      if (!res.ok || !data || !data.ok) {
        effmapSetMsg(container, (data && data.error) || 'Could not cancel. Please try again.', true);
        return;
      }
      reload(); // re-fetch assignment state (the cancelled link is gone) → re-render
    } catch (e) {
      effmapSetMsg(container, 'Could not cancel. Please try again.', true);
    }
  }

  /* =========================================================================
     Per-goal cards. Each DISTINCT goal is one self-contained card: the goal text,
     the date + Current/phase badge, the Map(s) for that goal (newest rendered in
     full; earlier same-goal Maps collapsible inside the same card), and an in-card
     "Update this goal" that carries THAT card's goal forward. Maps arrive
     created_at desc, so first-seen order keeps cards newest-activity-first and each
     group's Maps newest-first.
     ========================================================================= */
  function groupMapsByGoal(maps) {
    var order = [], byGoal = {};
    (maps || []).forEach(function(m) {
      var g = (m && m.goal && String(m.goal).trim() !== '') ? String(m.goal).trim() : 'Untitled goal';
      if (!byGoal[g]) { byGoal[g] = { goal: g, maps: [] }; order.push(byGoal[g]); }
      byGoal[g].maps.push(m);
    });
    return order;
  }

  /* =========================================================================
     Longitudinal comparison layer (Ticket 3) — display-only, no AI call, no
     endpoint. When a goal has ≥2 Maps, read the current Map against the
     immediately preceding same-goal Map: per-domain status movement, phase
     movement, and a plain-language pattern note computed from the data. All
     same-goal comparison; never across goals.
     ========================================================================= */
  // A single domain's primary_status for one Map. Canonical path is
  // explorer_facing_output.domain_statuses[domain].primary_status; falls back to
  // the raw_output shapes (older Maps store the explorer blob differently) so the
  // comparison reads consistently across v1.5 → v1.8 rows. Returns '' when absent.
  function effmapPrimaryStatus(m, key) {
    var efo = (m && m.explorer_facing_output && typeof m.explorer_facing_output === 'object') ? m.explorer_facing_output : {};
    var ds = (efo.domain_statuses && typeof efo.domain_statuses === 'object') ? efo.domain_statuses : {};
    var v = ds[key] && ds[key].primary_status;
    if (v && String(v).trim()) return String(v).trim();
    var raw = (m && m.raw_output && typeof m.raw_output === 'object') ? m.raw_output : {};
    var ef = (raw.explorer_facing && typeof raw.explorer_facing === 'object') ? raw.explorer_facing : {};
    var rds = (raw.domain_statuses && typeof raw.domain_statuses === 'object') ? raw.domain_statuses
      : ((ef.domains && typeof ef.domains === 'object') ? ef.domains : {});
    var rv = rds[key] && rds[key].primary_status;
    return (rv && String(rv).trim()) ? String(rv).trim() : '';
  }

  // Build the comparison block for current vs previous Map (same goal). Returns ''
  // (renders nothing — no error, no placeholder) unless both Maps carry a phase AND
  // the preceding Map carries at least one domain primary_status.
  function effmapComparisonHtml(curMap, prevMap) {
    if (!curMap || !prevMap) return '';
    var curPhase = curMap.phase && String(curMap.phase).trim();
    var prevPhase = prevMap.phase && String(prevMap.phase).trim();
    if (!curPhase || !prevPhase) return '';

    // Part 1 — per-domain movement. Skip domains absent on both Maps.
    var rows = [], heldNames = [], shiftedNames = [], prevHasStatus = false;
    EFFMAP_DOMAINS.forEach(function(d) {
      var prev = effmapPrimaryStatus(prevMap, d[0]);
      var cur = effmapPrimaryStatus(curMap, d[0]);
      if (prev) prevHasStatus = true;
      if (!prev && !cur) return;
      var held = !!(prev && cur && prev.toLowerCase() === cur.toLowerCase());
      rows.push({ label: d[1], prev: prev, cur: cur, held: held });
      if (held) heldNames.push(d[1] + ' (' + cur + ')');
      else shiftedNames.push(d[1] + ' (' + (prev || '—') + ' → ' + (cur || '—') + ')');
    });
    if (!prevHasStatus || !rows.length) return '';

    var rowHtml = rows.map(function(r) {
      var movement = '<span style="color:var(--muted);">' + escapeHtml(r.prev || '—') + '</span>'
        + ' <span style="color:var(--gold);">→</span> '
        + '<span style="color:var(--gold);font-weight:600;">' + escapeHtml(r.cur || '—') + '</span>';
      var badge = r.held
        ? '<span style="flex:0 0 auto;font-size:0.62rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">Held</span>'
        : '<span style="flex:0 0 auto;font-size:0.62rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold);background:rgba(196,154,60,0.14);border-radius:999px;padding:2px 9px;">Shifted</span>';
      return '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 8px;">'
        + '<span style="flex:0 0 110px;font-family:\'Cormorant Garamond\',serif;font-size:0.92rem;font-weight:600;color:var(--navy);">' + escapeHtml(r.label) + '</span>'
        + '<span style="flex:1;min-width:140px;font-size:0.85rem;line-height:1.5;">' + movement + '</span>'
        + badge + '</div>';
    }).join('');

    // Part 2 — phase movement.
    var phaseChanged = prevPhase.toLowerCase() !== curPhase.toLowerCase();
    var phaseLine = '<div style="margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--border);font-size:0.85rem;color:var(--ink);">'
      + '<strong style="font-weight:600;color:var(--navy);">Phase:</strong> '
      + '<span style="color:var(--muted);">' + escapeHtml(prevPhase) + '</span>'
      + ' <span style="color:var(--gold);">→</span> '
      + '<span style="color:var(--gold);font-weight:600;">' + escapeHtml(curPhase) + '</span>'
      + (phaseChanged
          ? ' <span style="font-size:0.62rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold);background:rgba(196,154,60,0.14);border-radius:999px;padding:2px 9px;margin-left:4px;">Movement</span>'
          : ' <span style="font-size:0.62rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-left:4px;">Held</span>')
      + '</div>';

    // Part 3 — pattern note, computed from the held/shifted counts.
    var held = heldNames.length;
    var heldStr = heldNames.join(', ');
    var shiftedStr = shiftedNames.join(', ');
    var note;
    if (held >= 4) {
      note = 'The core pattern has been consistent across both Maps. '
        + (heldStr ? heldStr + ' held steady. ' : '')
        + 'Consistency across Maps can mean a pattern is stable and worth exploring directly in session.';
    } else if (held >= 2) {
      note = 'Some areas shifted between Maps and some held. '
        + (shiftedStr ? shiftedStr + ' shifted' : '')
        + (heldStr ? (shiftedStr ? '; ' : '') + heldStr + ' held' : '')
        + '. The areas that shifted may reflect real movement; the areas that held may be worth sustained attention.';
    } else {
      note = 'Most areas shifted between Maps, which can reflect real change or different answers in different moments. '
        + (shiftedStr ? shiftedStr + ' shifted. ' : '')
        + 'A coach may want to explore what changed in the client’s experience between the two Maps.';
    }
    note += phaseChanged
      ? ' Phase moved from ' + prevPhase + ' to ' + curPhase + '.'
      : ' Phase held at ' + curPhase + '.';

    var prevDate = effmapDate(prevMap.created_at);
    var heading = prevDate ? 'Progress since ' + prevDate : 'Since the last Map';
    return '<div style="margin:20px 0 0;padding:16px 18px;background:var(--cream);border:1px solid var(--border);border-radius:var(--r-sm);">'
      + '<div style="font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;">' + escapeHtml(heading) + '</div>'
      + rowHtml
      + phaseLine
      + '<p style="margin:12px 0 0;font-size:0.85rem;line-height:1.6;color:var(--ink);">' + escapeHtml(note) + '</p>'
      + '</div>';
  }

  // A single Map's full body (opener + reading order + optional comparison layer +
  // coach-only intel). idSuffix keeps every collapsible id unique across all cards.
  // comparisonHtml (Ticket 3) is inserted ABOVE Intelligence Notes; passed only for
  // the current Map of a multi-Map goal, '' otherwise.
  function effmapMapBodyHtml(m, idSuffix, comparisonHtml, collapseOpener) {
    return effmapOpenerHtml(m, collapseOpener)
      + effmapReadingOrderHtml(m)
      + (comparisonHtml || '')
      + effmapCollapsible('effmap-intel-' + idSuffix, 'Intelligence Notes (coach only)', effmapIntelHtml(m, idSuffix));
  }

  function renderGoalCardHtml(group, gi, isCurrentGroup, assignActive) {
    var maps = group.maps;
    var primary = maps[0];
    var badge = (isCurrentGroup ? 'Current Map' : 'Map') + ' · ' + escapeHtml(effmapDate(primary.created_at))
      + (primary.phase ? ' · ' + escapeHtml(primary.phase) + ' phase' : '');
    // In-card "Update this goal" carries THIS card's goal. Disabled while an
    // assignment is in flight (mirrors the top one-active-at-a-time convention).
    var updateBtn = '<button type="button" class="save-btn effmap-card-update" data-client-email="' + escapeHtml(clientEmail) + '"'
      + ' data-carry-goal="' + escapeHtml(group.goal) + '"' + (assignActive ? ' disabled' : '')
      + ' style="padding:8px 16px;font-size:0.78rem;background:var(--gold);white-space:nowrap;flex:0 0 auto;">Update this goal</button>';
    var head = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px;">'
      + '<div style="min-width:0;">'
      +   '<div style="font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;">' + badge + '</div>'
      +   '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.25rem;font-weight:600;color:var(--navy);line-height:1.2;">' + escapeHtml(group.goal) + '</div>'
      + '</div>' + updateBtn
      + '</div>';
    // Ticket 3: earlier Maps exist for this goal → comparison layer renders, and the
    // opener collapses behind a disclosure (single-Map goals keep it expanded).
    var hasEarlier = maps.length >= 2;
    var comparison = hasEarlier ? effmapComparisonHtml(primary, maps[1]) : '';
    var body = effmapMapBodyHtml(primary, gi + '-0', comparison, hasEarlier);
    // Earlier Maps for THIS goal — each collapsible, full render inside.
    var older = maps.slice(1).map(function(m, ri) {
      var mi = ri + 1;
      var label = 'Earlier Map · ' + effmapDate(m.created_at) + (m.phase ? ' · ' + String(m.phase) + ' phase' : '');
      return effmapCollapsible('effmap-older-' + gi + '-' + mi, label, effmapMapBodyHtml(m, gi + '-' + mi, '', hasEarlier));
    }).join('');
    var olderSection = older
      ? '<div style="margin-top:20px;border-top:1px solid var(--border);padding-top:12px;">'
        + '<p style="font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;">Earlier Maps for this goal</p>'
        + older + '</div>'
      : '';
    return '<div class="card goal-card" id="goal-card-' + gi + '" style="margin-bottom:18px;">' + head + body + olderSection + '</div>';
  }

  // Slim nav: one compact entry per goal (title + most-recent date; "Current" on the
  // newest). Anchors jump to each goal's card. Rendered only for ≥2 goals.
  function renderGoalNavHtml(groups) {
    var items = groups.map(function(g, gi) {
      var primary = g.maps[0];
      return '<a class="goal-nav-item" href="#goal-card-' + gi + '" data-nav-target="goal-card-' + gi + '">'
        + '<span class="goal-nav-title">' + escapeHtml(g.goal) + '</span>'
        + '<span class="goal-nav-date">' + escapeHtml(effmapDate(primary.created_at)) + (gi === 0 ? ' · Current' : '') + '</span>'
        + '</a>';
    }).join('');
    return '<nav class="goal-rail" id="goal-rail" aria-label="Goals">'
      + '<div class="goal-rail-label">Goals</div>' + items + '</nav>';
  }

  // Wire goal-nav clicks: smooth-scroll to the card + set the entry active. (Scroll-
  // spy that updates active while scrolling is added separately.)
  function setActiveGoalNav(targetId) {
    var nav = $('goal-rail');
    if (!nav) return;
    nav.querySelectorAll('.goal-nav-item').forEach(function(it) {
      it.classList.toggle('active', it.getAttribute('data-nav-target') === targetId);
    });
  }
  function wireGoalNav() {
    var nav = $('goal-rail');
    if (!nav) return;
    var items = nav.querySelectorAll('.goal-nav-item');
    items.forEach(function(it) {
      it.addEventListener('click', function(e) {
        var id = it.getAttribute('data-nav-target');
        var target = document.getElementById(id);
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); setActiveGoalNav(id); }
      });
    });
    if (items.length) items[0].classList.add('active'); // newest goal active by default

    // Scroll-spy: highlight the goal card crossing the viewport's vertical centre.
    // A centre band keeps exactly one card "current" even when a card is taller than
    // the viewport; the topmost card in the band wins when two overlap. No-ops where
    // IntersectionObserver is unavailable — the click highlighting still works.
    var cardsEl = $('goal-cards');
    if (!cardsEl || !('IntersectionObserver' in window)) return;
    var cards = cardsEl.querySelectorAll('.goal-card');
    if (!cards.length) return;
    var inView = {};
    var spy = new IntersectionObserver(function(entries) {
      entries.forEach(function(en) {
        if (en.isIntersecting) inView[en.target.id] = true; else delete inView[en.target.id];
      });
      for (var i = 0; i < cards.length; i++) {
        if (inView[cards[i].id]) { setActiveGoalNav(cards[i].id); break; }
      }
    }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });
    cards.forEach(function(c) { spy.observe(c); });
  }

  // Wire each in-card "Update this goal": carries that card's goal, respects the
  // at-limit overage flow; on success the new link surfaces in the top assign bar
  // and all in-card update buttons disable (an assignment is now in flight).
  function wireGoalCardUpdates(container) {
    container.querySelectorAll('.effmap-card-update').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        if (btn.disabled) return;
        var email = btn.getAttribute('data-client-email') || clientEmail;
        var goal = btn.getAttribute('data-carry-goal') || '';
        if (effmapAtLimit()) { effmapShowOverageConsent($('assign-bar'), email); return; }
        var ok = await effmapAssign(btn, email, goal);
        if (ok) {
          document.querySelectorAll('.effmap-card-update').forEach(function(b) {
            b.disabled = true; b.style.opacity = '0.5'; b.style.cursor = 'not-allowed';
          });
          btn.textContent = 'Update this goal';
        } else {
          btn.disabled = false; btn.textContent = 'Update this goal';
        }
      });
    });
  }

  /* ---- top-level render ---- */
  function render() {
    var maps = mapsState, assignments = assignmentsState;
    var assignActive = !!effmapActiveAssignment(assignments);
    var html = '<div class="card" style="margin-bottom:18px;">'
      + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.15rem;font-weight:600;color:var(--navy);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:14px;">Assign a Map</div>'
      + effmapUsageHtml(usageState)
      + '<div id="assign-bar"></div>'
      + '</div>';
    if (maps.length) {
      var groups = groupMapsByGoal(maps);
      var cardsHtml = groups.map(function(g, gi) { return renderGoalCardHtml(g, gi, gi === 0, assignActive); }).join('');
      // ≥2 goals → slim sticky rail beside the stacked cards; 1 goal → cards only
      // (a single-goal rail has nothing to navigate).
      html += groups.length >= 2
        ? '<div class="goal-nav-layout">' + renderGoalNavHtml(groups)
            + '<div class="goal-cards-col" id="goal-cards">' + cardsHtml + '</div></div>'
        : '<div id="goal-cards">' + cardsHtml + '</div>';
    } else {
      html += '<div class="card"><p style="margin:0;color:var(--muted);font-size:0.9rem;font-style:italic;">No Maps generated for this client yet. Assign one above — once your client completes it, every Map will appear here, grouped by goal.</p></div>';
    }
    $('content').innerHTML = html;

    var bar = $('assign-bar');
    bar.innerHTML = effmapAssignBarHtml(clientEmail, maps, assignments);
    wireEffmapAssignment(bar, clientEmail);

    if (maps.length) {
      var cards = $('goal-cards');
      wireEffmapToggles(cards);
      wireGoalCardUpdates(cards);
      wireGoalNav();
    }
  }

  // Re-fetch Maps + assignment rows and re-render. Used on first load and after
  // a cancel (which changes assignment state server-side, so a plain re-render of
  // stale state would wrongly keep showing the cancelled link as active).
  async function reload() {
    var results = await Promise.all([fetchMaps(), fetchAssignments(), fetchUsage()]);
    mapsState = results[0] || [];
    assignmentsState = results[1] || [];
    usageState = results[2] || null;
    await applyHeader(mapsState);
    render();
  }

  async function init() {
    if (!clientEmail) { showError('No client specified.'); return; }
    var profile = await loadCoachProfile();
    if (!profile) return; // guard already redirected / showed an error
    coachId = profile.id;
    try {
      await reload();
    } catch (e) {
      showError('Could not load the Effectiveness Map right now.');
    }
  }

  init();
  </script>
</body>
</html>
