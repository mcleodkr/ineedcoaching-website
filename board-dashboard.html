<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Alignment Dashboard · ineedcoaching.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --navy: #1a3a52; --navy-deep: #0f2638; --gold: #c49a3c; --cream: #f7f5f1; --cream-warm: #faf6ed; --ink: #0f1b2d; --muted: #6b7280; --border: #d4cdb8; --protects: #2f6b3e; --neutral: #c89d3c; --risks: #9b2c2c; --serif: "Cormorant Garamond", Georgia, serif; --sans: "DM Sans", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); color: var(--ink); background: var(--cream); line-height: 1.5; }
.nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(26, 58, 82, 0.95); backdrop-filter: blur(10px); z-index: 100; padding: 14px 0; border-bottom: 1px solid rgba(196, 154, 60, 0.2); }
.nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
.nav-brand { color: var(--cream); font-family: var(--serif); font-size: 20px; font-weight: 600; text-decoration: none; }
.nav-links { display: flex; gap: 28px; align-items: center; }
.nav-links a { color: var(--cream); text-decoration: none; font-size: 14px; opacity: 0.8; }
.nav-cta { background: var(--gold); color: var(--navy) !important; padding: 8px 16px; border-radius: 2px; font-weight: 600; opacity: 1 !important; }
.main { padding-top: 80px; max-width: 900px; margin: 0 auto; padding-left: 24px; padding-right: 24px; padding-bottom: 60px; }
.hero { padding: 40px 0 20px; }
.eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--gold); margin-bottom: 12px; font-weight: 500; }
.hero h1 { font-family: var(--serif); font-size: 44px; line-height: 1.1; font-weight: 500; color: var(--navy); margin-bottom: 12px; letter-spacing: -0.5px; }
.hero-sub { color: var(--muted); font-size: 15px; }
.scenario-summary { background: var(--navy); color: var(--cream); padding: 24px 28px; border-radius: 3px; margin-bottom: 24px; }
.sum-label { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; opacity: 0.6; margin-bottom: 4px; }
.sum-title { font-family: var(--serif); font-size: 24px; font-weight: 500; margin-bottom: 6px; }
.sum-detail { font-size: 14px; opacity: 0.85; line-height: 1.5; }
.sum-meta { display: flex; gap: 20px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(247, 245, 241, 0.15); font-size: 12px; flex-wrap: wrap; opacity: 0.9; }
.sum-meta strong { color: var(--gold); margin-right: 6px; }
.participation { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
@media (max-width: 600px) { .participation { grid-template-columns: 1fr; } }
.stat { background: #fff; border: 1px solid var(--border); padding: 20px; border-radius: 3px; text-align: center; }
.stat-big { font-family: var(--serif); font-size: 40px; color: var(--navy); font-weight: 500; line-height: 1; margin-bottom: 6px; }
.stat-label { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; color: var(--muted); font-weight: 500; }
.waiting-card { background: var(--cream-warm); border-left: 4px solid var(--gold); padding: 28px; border-radius: 3px; margin-bottom: 24px; }
.waiting-card h2 { font-family: var(--serif); font-size: 24px; color: var(--navy); margin-bottom: 10px; font-weight: 500; }
.waiting-card p { color: var(--ink); font-size: 15px; line-height: 1.6; }
.section { margin-bottom: 36px; }
.section-head { margin-bottom: 18px; }
.section-eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--gold); margin-bottom: 8px; font-weight: 600; }
.section-title { font-family: var(--serif); font-size: 28px; color: var(--navy); font-weight: 500; margin-bottom: 6px; }
.section-sub { color: var(--muted); font-size: 14px; }
.intent-card { background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--protects); padding: 24px; border-radius: 3px; margin-bottom: 10px; }
.intent-text { font-family: var(--serif); font-size: 17px; color: var(--navy); line-height: 1.55; margin-bottom: 8px; }
.intent-share { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 600; }
.cluster { background: #fff; border: 1px solid var(--border); padding: 22px; border-radius: 3px; margin-bottom: 12px; }
.cluster-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.cluster-label { font-family: var(--serif); font-size: 18px; color: var(--navy); font-weight: 500; }
.cluster-count { font-size: 12px; color: var(--muted); background: var(--cream-warm); padding: 4px 12px; border-radius: 100px; font-weight: 500; }
.cluster-desc { font-size: 14px; color: var(--ink); line-height: 1.6; opacity: 0.85; }
.tension-card { background: rgba(200, 157, 60, 0.08); border-left: 4px solid var(--neutral); padding: 22px; border-radius: 3px; margin-bottom: 12px; }
.tension-title { font-family: var(--serif); font-size: 18px; color: var(--navy); font-weight: 500; margin-bottom: 8px; }
.tension-desc { font-size: 14px; color: var(--ink); line-height: 1.6; }
.pathway-card { background: #fff; border: 1px solid var(--border); border-top: 3px solid var(--navy); padding: 22px; border-radius: 3px; margin-bottom: 12px; }
.pathway-num { display: inline-block; width: 28px; height: 28px; background: var(--navy); color: var(--cream); border-radius: 50%; text-align: center; line-height: 28px; font-size: 13px; font-weight: 600; margin-right: 10px; }
.pathway-title { font-family: var(--serif); font-size: 18px; color: var(--navy); font-weight: 500; display: inline; }
.pathway-desc { font-size: 14px; color: var(--ink); line-height: 1.6; margin-top: 10px; }
.readiness-card { background: var(--navy); color: var(--cream); padding: 28px; border-radius: 3px; margin-bottom: 24px; }
.readiness-label { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; color: var(--gold); font-weight: 600; margin-bottom: 8px; }
.readiness-text { font-family: var(--serif); font-size: 20px; line-height: 1.5; }
.facilitation { background: var(--cream-warm); padding: 28px; border-radius: 3px; margin-bottom: 24px; }
.fac-label { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--gold); margin-bottom: 12px; font-weight: 600; }
.fac-title { font-family: var(--serif); font-size: 24px; color: var(--navy); margin-bottom: 14px; font-weight: 500; }
.fac-prompt { font-family: var(--serif); font-size: 17px; color: var(--navy); line-height: 1.55; padding: 14px 18px; background: #fff; border-left: 3px solid var(--gold); border-radius: 2px; margin-bottom: 10px; }
.share-link-box { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
.link-input { flex: 1; min-width: 280px; padding: 10px 12px; border: 1px solid var(--border); background: #fff; border-radius: 2px; font-family: monospace; font-size: 12px; }
.btn { cursor: pointer; border: none; font-family: var(--sans); padding: 10px 20px; border-radius: 2px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: #a87d20; }
.btn-navy { background: var(--navy); color: var(--cream); padding: 14px 28px; }
.refresh-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 2px; cursor: pointer; font-size: 12px; font-family: var(--sans); }
.refresh-btn:hover { border-color: var(--navy); color: var(--navy); }
.loader { text-align: center; padding: 80px 20px; }
.spinner-big { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-card { background: #fff; border-top: 4px solid #9b2c2c; padding: 32px; border-radius: 3px; text-align: center; }
.heat-row { display: grid; grid-template-columns: 180px 1fr 60px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
@media (max-width: 600px) { .heat-row { grid-template-columns: 1fr; } }
.heat-row:last-child { border-bottom: none; }
.heat-label { font-family: var(--serif); font-size: 15px; color: var(--navy); font-weight: 500; }
.heat-bar-outer { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
.heat-bar-inner { height: 100%; border-radius: 4px; }
.heat-avg { font-size: 13px; color: var(--muted); text-align: right; font-weight: 600; }
.footer { border-top: 1px solid var(--border); margin-top: 40px; padding-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">ineedcoaching.org</a>
    <div class="nav-links">
      <a href="/board-lab.html">New scenario</a>
      <a href="/decision-lab.html" class="nav-cta">Decision Lab</a>
    </div>
  </div>
</nav>

<main class="main">
  <div id="app">
    <div class="loader">
      <div class="spinner-big"></div>
      <div>Loading board dashboard...</div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://qroizygknxdjsstkezsf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4";

const app = document.getElementById("app");
let board = null;
let sessions = [];
let error = null;
let aggregating = false;
let aggregated = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

async function callApi(action, payload) {
  const res = await fetch(SUPABASE_URL + "/functions/v1/decision-lab-api", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
    body: JSON.stringify({ action: action, payload: payload })
  });
  if (!res.ok) throw new Error("Server error");
  return await res.json();
}

async function callClaude(prompt, maxTokens, expectJson) {
  const res = await fetch(SUPABASE_URL + "/functions/v1/decision-lab-claude", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
    body: JSON.stringify({ prompt: prompt, maxTokens: maxTokens || 2500, expectJson: !!expectJson })
  });
  if (!res.ok) return null;
  const j = await res.json();
  return expectJson ? j.json : j.text;
}

async function loadBoard() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (!id) { error = "No board ID in link."; render(); return; }
  try {
    const data = await callApi("board_get_by_id", { id: id });
    if (data.error || !data.board) throw new Error("not found");
    board = data.board;
    sessions = (data.sessions || []).filter(function(s) { return s.completed; });
  } catch (e) {
    error = "Could not load this board scenario. Check your link.";
  }
  render();
}

async function aggregate() {
  if (sessions.length < 3) return;
  aggregating = true;
  render();

  const sessionSummaries = sessions.map(function(s, i) {
    const fa = s.final_analysis || {};
    return "MEMBER " + (i + 1) + " (" + (s.role || "Board Member") + "):\n" +
      "Scores: " + JSON.stringify(fa.scores || {}) + "\n" +
      "Risk flags: " + JSON.stringify(fa.riskFlags || {}) + "\n" +
      "Named gaps: " + (fa.namedGaps || []).join("; ") + "\n" +
      "Their reflection 1: " + (fa.paragraph1 || "") + "\n" +
      "Their reflection 2: " + (fa.paragraph2 || "");
  }).join("\n\n---\n\n");

  const prompt = 'You are a board facilitation expert synthesizing patterns across multiple board members who independently ran the Decision Lab on the same scenario.\n\nSCENARIO: ' + board.scenario + (board.proposed_decision ? ' - ' + board.proposed_decision : '') + '\n' +
    (board.scenario_detail ? 'CONTEXT: ' + board.scenario_detail + '\n' : '') +
    'DISTRICT: ' + (board.district_context || 'Mixed') + '\n' +
    'TIMELINE: ' + (board.timeline || 'Not specified') + '\n' +
    'STAGE: ' + (board.decision_stage || 'Not specified') + '\n\n' +
    'MEMBER BRIEFS:\n' + sessionSummaries + '\n\n' +
    'Synthesize patterns across these ' + sessions.length + ' members. ANONYMIZE — never quote individuals by name or position. Report aggregate patterns only.\n\n' +
    'Return ONLY this JSON:\n{\n' +
    '  "shared_intent": ["2-3 short statements of what ALL or NEARLY ALL members seem to want protected or achieved"],\n' +
    '  "perspective_clusters": [\n' +
    '    { "label": "short cluster name", "member_count": N, "description": "1-2 sentences on what this group emphasized" }\n' +
    '  ],\n' +
    '  "tensions": [\n' +
    '    { "title": "short tension name", "description": "1-2 sentences on the genuine disagreement or competing priority" }\n' +
    '  ],\n' +
    '  "pathways_forward": [\n' +
    '    { "title": "short pathway name", "description": "1-2 sentences on a concrete next step that honors the tensions" }\n' +
    '  ],\n' +
    '  "resolution_readiness": "1-2 sentences: can this board move forward as-is, or does something need surfacing first?",\n' +
    '  "facilitation_prompts": ["3 questions the board president could ask at the next meeting to surface the real conversation"],\n' +
    '  "score_averages": {\n' +
    '    "instructionalProtection": avg_number, "systemCapacity": avg_number, "differentialImpact": avg_number, "decisionQuality": avg_number, "communicationClarity": avg_number\n' +
    '  }\n' +
    '}\n\nBe specific to THIS board. No generic facilitation advice.';

  try {
    const result = await callClaude(prompt, 3000, true);
    if (result) {
      aggregated = result;
      callApi("brief_save", {
        board_scenario_id: board.id,
        member_count: sessions.length,
        shared_intent: result.shared_intent,
        perspective_clusters: result.perspective_clusters,
        tension_framing: result.tensions,
        pathways_forward: result.pathways_forward,
        resolution_readiness: result.resolution_readiness,
        facilitation_brief: { prompts: result.facilitation_prompts },
        heat_map_distribution: result.score_averages
      });
    }
  } catch (e) {
    console.error(e);
  }
  aggregating = false;
  render();
}

function copyLink() {
  const link = window.location.origin + "/board-member.html?token=" + board.share_token;
  navigator.clipboard.writeText(link);
  const btn = document.getElementById("copyBtn");
  btn.textContent = "✓ Copied!";
  setTimeout(function() { btn.textContent = "Copy member link"; }, 2000);
}

function renderError() {
  const wrap = el("div");
  const ec = el("div", "error-card");
  ec.appendChild(el("h2", null, "Cannot load dashboard"));
  ec.appendChild(el("p", null, error));
  wrap.appendChild(ec);
  return wrap;
}

function renderDashboard() {
  const wrap = el("div");

  // Header
  const hero = el("div", "hero");
  hero.appendChild(el("div", "eyebrow", "BOARD ALIGNMENT DASHBOARD"));
  hero.appendChild(el("h1", null, "Your board, seen clearly."));
  hero.appendChild(el("div", "hero-sub", "Patterns across your members — anonymized, aggregated, ready to discuss."));
  wrap.appendChild(hero);

  // Scenario summary
  const sc = el("div", "scenario-summary");
  sc.appendChild(el("div", "sum-label", "SCENARIO"));
  sc.appendChild(el("div", "sum-title", board.scenario + (board.proposed_decision ? " · " + board.proposed_decision : "")));
  if (board.scenario_detail) sc.appendChild(el("div", "sum-detail", board.scenario_detail));
  const meta = el("div", "sum-meta");
  if (board.district_context) { const s = el("span"); s.innerHTML = '<strong>District:</strong> ' + board.district_context; meta.appendChild(s); }
  if (board.timeline) { const s = el("span"); s.innerHTML = '<strong>Timeline:</strong> ' + board.timeline; meta.appendChild(s); }
  if (board.decision_stage) { const s = el("span"); s.innerHTML = '<strong>Stage:</strong> ' + board.decision_stage; meta.appendChild(s); }
  sc.appendChild(meta);
  wrap.appendChild(sc);

  // Share link for ongoing invites
  const shareBox = el("div", "share-link-box");
  const linkI = document.createElement("input");
  linkI.className = "link-input";
  linkI.type = "text";
  linkI.readOnly = true;
  linkI.value = window.location.origin + "/board-member.html?token=" + board.share_token;
  shareBox.appendChild(linkI);
  const copyBtn = el("button", "btn btn-gold", "Copy member link");
  copyBtn.id = "copyBtn";
  copyBtn.onclick = copyLink;
  shareBox.appendChild(copyBtn);
  const refBtn = el("button", "refresh-btn", "↻ Refresh");
  refBtn.onclick = function() { window.location.reload(); };
  shareBox.appendChild(refBtn);
  wrap.appendChild(shareBox);

  // Participation stats
  const expected = board.member_count_expected || sessions.length;
  const statsWrap = el("div", "participation");
  [
    [sessions.length, "Members completed"],
    [Math.max(0, expected - sessions.length), "Still pending"],
    [expected ? Math.round((sessions.length / expected) * 100) + "%" : "—", "Participation"]
  ].forEach(function(pair) {
    const s = el("div", "stat");
    s.appendChild(el("div", "stat-big", String(pair[0])));
    s.appendChild(el("div", "stat-label", pair[1]));
    statsWrap.appendChild(s);
  });
  wrap.appendChild(statsWrap);

  // If too few sessions
  if (sessions.length < 3) {
    const waiting = el("div", "waiting-card");
    waiting.appendChild(el("h2", null, sessions.length === 0 ? "Waiting for first member" : "Need 3+ to aggregate"));
    waiting.appendChild(el("p", null, sessions.length === 0
      ? "Once members complete the lab, their briefs will cluster into shared intent, perspective groups, tensions, and pathways forward."
      : "You need at least 3 completed briefs for meaningful pattern detection. " + (expected - sessions.length > 0 ? "Share the link with the remaining members." : "Check back when more complete.")
    ));
    wrap.appendChild(waiting);
    return wrap;
  }

  // Aggregation trigger or results
  if (!aggregated && !aggregating) {
    const readyCard = el("div", "waiting-card");
    readyCard.appendChild(el("h2", null, "Ready to aggregate"));
    readyCard.appendChild(el("p", null, sessions.length + " members have completed briefs. Aggregate now to see shared intent, perspective clusters, tensions, and pathways forward."));
    const btn = el("button", "btn btn-navy", "Aggregate patterns →");
    btn.style.marginTop = "16px";
    btn.onclick = aggregate;
    readyCard.appendChild(btn);
    wrap.appendChild(readyCard);
    return wrap;
  }

  if (aggregating) {
    const loading = el("div", "waiting-card");
    loading.appendChild(el("h2", null, "Synthesizing patterns..."));
    loading.appendChild(el("p", null, "Reading " + sessions.length + " briefs, finding shared intent, clustering perspectives, surfacing tensions, and mapping pathways forward."));
    const sp = el("div", "spinner-big");
    sp.style.margin = "20px auto 0";
    loading.appendChild(sp);
    wrap.appendChild(loading);
    return wrap;
  }

  const agg = aggregated;

  // Score averages heat map
  if (agg.score_averages) {
    const heatSec = el("div", "section");
    const hh = el("div", "section-head");
    hh.appendChild(el("div", "section-eyebrow", "AVERAGE DIMENSIONAL PROFILE"));
    hh.appendChild(el("div", "section-title", "Where the board lands on average"));
    hh.appendChild(el("div", "section-sub", "Averaged scores across all " + sessions.length + " completed member briefs."));
    heatSec.appendChild(hh);

    const heatBox = el("div");
    heatBox.style.cssText = "background: #fff; border: 1px solid var(--border); padding: 24px; border-radius: 3px;";
    const legend = el("div");
    legend.style.cssText = "background: var(--cream-warm); border-left: 3px solid var(--gold); padding: 16px 20px; margin-bottom: 16px; border-radius: 3px;";
    legend.innerHTML = '<div style="text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: var(--gold); font-weight: 600; margin-bottom: 10px;">HOW TO READ THESE SCORES</div><p style="font-size: 14px; line-height: 1.6; color: var(--ink); margin: 0;">Each dimension is scored 0\u201310 based on how confidently the board\u2019s process protects it. <strong style="color: var(--protects);">Green (7\u201310):</strong> Protects this dimension. <strong style="color: var(--neutral);">Yellow (4\u20136):</strong> Neutral \u2014 needs watching. <strong style="color: var(--risks);">Red (0\u20133):</strong> At risk \u2014 this is where the decision could hurt.</p>';
    heatBox.appendChild(legend);
    [
      ["instructionalProtection", "Instructional Protection"],
      ["systemCapacity", "System Capacity"],
      ["differentialImpact", "Differential Impact"],
      ["decisionQuality", "Decision Quality"],
      ["communicationClarity", "Communication Clarity"]
    ].forEach(function(item) {
      const avg = agg.score_averages[item[0]] || 0;
      const color = avg >= 7 ? "var(--protects)" : avg >= 4 ? "var(--neutral)" : "var(--risks)";
      const row = el("div", "heat-row");
      row.appendChild(el("div", "heat-label", item[1]));
      const bar = el("div", "heat-bar-outer");
      const fill = el("div", "heat-bar-inner");
      fill.style.width = (avg * 10) + "%";
      fill.style.background = color;
      bar.appendChild(fill);
      row.appendChild(bar);
      const avgLabel = el("div", "heat-avg", avg.toFixed(1) + "/10");
      avgLabel.style.color = color;
      row.appendChild(avgLabel);
      heatBox.appendChild(row);
    });
    heatSec.appendChild(heatBox);
    wrap.appendChild(heatSec);
  }

  // Shared intent
  if (agg.shared_intent && agg.shared_intent.length > 0) {
    const sec = el("div", "section");
    const h = el("div", "section-head");
    h.appendChild(el("div", "section-eyebrow", "SHARED INTENT"));
    h.appendChild(el("div", "section-title", "What nearly everyone wants"));
    h.appendChild(el("div", "section-sub", "The ground that's already common. Name it aloud — don't assume it."));
    sec.appendChild(h);
    agg.shared_intent.forEach(function(statement) {
      const card = el("div", "intent-card");
      card.appendChild(el("div", "intent-text", statement));
      card.appendChild(el("div", "intent-share", "SHARED ACROSS MEMBERS"));
      sec.appendChild(card);
    });
    wrap.appendChild(sec);
  }

  // Perspective clusters
  if (agg.perspective_clusters && agg.perspective_clusters.length > 0) {
    const sec = el("div", "section");
    const h = el("div", "section-head");
    h.appendChild(el("div", "section-eyebrow", "PERSPECTIVE CLUSTERS"));
    h.appendChild(el("div", "section-title", "How the board groups"));
    h.appendChild(el("div", "section-sub", "Patterns of emphasis — not factions. Each cluster represents genuine, legitimate framing."));
    sec.appendChild(h);
    agg.perspective_clusters.forEach(function(c) {
      const card = el("div", "cluster");
      const head = el("div", "cluster-head");
      head.appendChild(el("div", "cluster-label", c.label));
      head.appendChild(el("div", "cluster-count", (c.member_count || "?") + " member" + (c.member_count === 1 ? "" : "s")));
      card.appendChild(head);
      card.appendChild(el("div", "cluster-desc", c.description));
      sec.appendChild(card);
    });
    wrap.appendChild(sec);
  }

  // Tensions
  if (agg.tensions && agg.tensions.length > 0) {
    const sec = el("div", "section");
    const h = el("div", "section-head");
    h.appendChild(el("div", "section-eyebrow", "HONEST TENSIONS"));
    h.appendChild(el("div", "section-title", "The real disagreements"));
    h.appendChild(el("div", "section-sub", "Not dysfunction — these are the genuine tradeoffs your board must navigate."));
    sec.appendChild(h);
    agg.tensions.forEach(function(t) {
      const card = el("div", "tension-card");
      card.appendChild(el("div", "tension-title", "⚡ " + t.title));
      card.appendChild(el("div", "tension-desc", t.description));
      sec.appendChild(card);
    });
    wrap.appendChild(sec);
  }

  // Pathways
  if (agg.pathways_forward && agg.pathways_forward.length > 0) {
    const sec = el("div", "section");
    const h = el("div", "section-head");
    h.appendChild(el("div", "section-eyebrow", "PATHWAYS FORWARD"));
    h.appendChild(el("div", "section-title", "Where you could go"));
    h.appendChild(el("div", "section-sub", "Concrete options that honor the tensions instead of bulldozing them."));
    sec.appendChild(h);
    agg.pathways_forward.forEach(function(p, i) {
      const card = el("div", "pathway-card");
      const titleRow = el("div");
      titleRow.appendChild(el("span", "pathway-num", String(i + 1)));
      titleRow.appendChild(el("span", "pathway-title", p.title));
      card.appendChild(titleRow);
      card.appendChild(el("div", "pathway-desc", p.description));
      sec.appendChild(card);
    });
    wrap.appendChild(sec);
  }

  // Resolution readiness
  if (agg.resolution_readiness) {
    const card = el("div", "readiness-card");
    card.appendChild(el("div", "readiness-label", "RESOLUTION READINESS"));
    card.appendChild(el("div", "readiness-text", agg.resolution_readiness));
    wrap.appendChild(card);
  }

  // Facilitation brief
  if (agg.facilitation_prompts && agg.facilitation_prompts.length > 0) {
    const fac = el("div", "facilitation");
    fac.appendChild(el("div", "fac-label", "FACILITATION BRIEF"));
    fac.appendChild(el("div", "fac-title", "Ask these at your next meeting"));
    agg.facilitation_prompts.forEach(function(p) {
      fac.appendChild(el("div", "fac-prompt", "→ " + p));
    });
    wrap.appendChild(fac);
  }

  const foot = el("div", "footer");
  foot.textContent = "The Boardroom Decision Lab · Board Alignment Dashboard · " + sessions.length + " member briefs aggregated";
  wrap.appendChild(foot);

  return wrap;
}

function render() {
  app.innerHTML = "";
  if (error) { app.appendChild(renderError()); return; }
  if (!board) return;
  app.appendChild(renderDashboard());
}

loadBoard();
</script>
</body>
</html>
