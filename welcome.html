<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | ineedcoaching.org</title>
<meta name="description" content="Sign in or create your account on ineedcoaching.org">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root {
  --navy: #1a3a52; --gold: #c49a3c; --gold-lt: #faf3e0; --warm: #faf8f4;
  --white: #ffffff; --muted: #8a8a9a; --border: #2a2e3e;
  --r: 14px; --r-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Cabinet Grotesk', sans-serif; background: var(--navy); color: var(--warm); min-height: 100vh; display: flex; flex-direction: column; }

nav { position: fixed; top: 0; left: 0; right: 0; z-index: 300; display: flex; align-items: center; justify-content: space-between; padding: 14px 52px; background: rgba(26,30,46,0.95); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: var(--warm); text-decoration: none; }
.logo-i { color: var(--gold); font-style: italic; }
.logo-coaching { color: var(--gold); font-style: italic; }

.welcome-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 24px 80px; }

.welcome-card { max-width: 420px; width: 100%; background: rgba(255,255,255,0.03); border: 1.5px solid var(--border); border-radius: var(--r); padding: 48px 40px; text-align: center; }

.welcome-card h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--warm); margin-bottom: 8px; line-height: 1.2; }
.welcome-card h1 em { color: var(--gold); font-style: italic; }

.welcome-sub { font-size: 0.88rem; color: var(--muted); line-height: 1.6; margin-bottom: 32px; }

.welcome-form { display: flex; flex-direction: column; gap: 14px; }

.welcome-form input[type="email"] {
  width: 100%; padding: 14px 18px; border: 1.5px solid var(--border); border-radius: var(--r-sm);
  background: rgba(255,255,255,0.05); color: var(--warm); font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 0.9rem; outline: none; transition: border-color 0.2s;
}
.welcome-form input[type="email"]:focus { border-color: var(--gold); }
.welcome-form input[type="email"]::placeholder { color: var(--muted); }

.welcome-form button {
  width: 100%; padding: 14px; background: var(--gold); color: var(--navy); border: none;
  border-radius: var(--r-sm); font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.9rem;
  font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.welcome-form button:hover { background: #d4a94c; }
.welcome-form button:disabled { opacity: 0.5; cursor: not-allowed; }

.welcome-msg { font-size: 0.82rem; color: var(--gold); margin-top: 16px; min-height: 20px; }

.welcome-footer { font-size: 0.72rem; color: var(--muted); margin-top: 24px; }
.welcome-footer a { color: var(--gold); text-decoration: none; }

footer { padding: 28px 52px; border-top: 1px solid var(--border); display: flex; justify-content: center; }
.f-note { font-size: 0.68rem; color: var(--muted); }

@media (max-width: 768px) {
  nav { padding: 12px 20px; }
  .welcome-card { padding: 36px 24px; }
}
</style>
<style data-MOBILE_NAV_HAMBURGER_v1>
/* Mobile hamburger nav */
@media (max-width: 900px) {
  #nav-hamburger { display: flex !important; }
  #nav-links-container {
    position: fixed;
    top: 60px;
    left: 0;
    right: 0;
    background: rgba(26, 58, 82, 0.98);
    backdrop-filter: blur(14px);
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 0 !important;
    padding: 16px 24px 24px !important;
    border-top: 1px solid rgba(255,255,255,0.1);
    transform: translateY(-110%);
    transition: transform 0.25s ease;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
  }
  #nav-links-container.nav-open { transform: translateY(0); }
  #nav-links-container > a {
    display: block;
    padding: 14px 8px !important;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    text-align: left;
  }
  #nav-links-container > a[style*="background:#c49a3c"],
  #nav-links-container > a[style*="background: #c49a3c"],
  #nav-links-container > a[style*="background:var(--gold)"] {
    margin-top: 8px;
    border-radius: 8px !important;
    text-align: center;
    border-bottom: none;
  }
  #nav-hamburger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  #nav-hamburger.is-open span:nth-child(2) { opacity: 0; }
  #nav-hamburger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
}
</style>
</head>
<body>

<nav style="position:fixed;top:0;left:0;right:0;z-index:300;display:flex;align-items:center;justify-content:space-between;padding:14px 52px;background:rgba(26,58,82,0.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.1);">
  <a href="/" style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:#f7f4ee;text-decoration:none;"><span style="color:#c49a3c;font-style:italic;">i</span>need<span style="color:#c49a3c;font-style:italic;">coaching</span>.org</a>
  <button id="nav-hamburger" aria-label="Open menu" aria-expanded="false" style="display:none;background:none;border:none;cursor:pointer;padding:8px;flex-direction:column;gap:5px;">
    <span style="width:24px;height:2px;background:#f7f4ee;border-radius:2px;transition:transform 0.2s;"></span>
    <span style="width:24px;height:2px;background:#f7f4ee;border-radius:2px;transition:opacity 0.2s;"></span>
    <span style="width:24px;height:2px;background:#f7f4ee;border-radius:2px;transition:transform 0.2s;"></span>
  </button>
  <div id="nav-links-container" style="display:flex;align-items:center;gap:22px;">
    <a href="/coaches.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Coaches</a>
    <a href="/sessions.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Sessions</a>
    <a href="/coach-courses.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Courses</a>
    <a href="/articles.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Articles</a>
    <a href="/coaching-commons.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Commons</a>
    <a href="/coach-dashboard.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Dashboard</a>
    <a href="/coach-signup.html" style="font-size:0.78rem;font-weight:700;background:#c49a3c;color:#1a3a52;padding:8px 18px;border-radius:50px;text-decoration:none;">List Your Practice</a>
  </div>
</nav>

<div class="welcome-wrap">
  <div class="welcome-card">
    <h1>Welcome back.<br><em>Create your space.</em></h1>
    <p class="welcome-sub">Sign in with a magic link. No password needed.</p>
    <form class="welcome-form" id="magicForm" onsubmit="return false;">
      <input type="email" id="magic-email" placeholder="Your email address" required>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADDKlWVIhl7kMkdC" data-callback="onTurnstileVerified" data-theme="dark" style="margin: 4px 0;"></div>
      <button type="button" id="magic-btn" onclick="sendMagicLink()" disabled>Send magic link</button>
    </form>
    <div class="welcome-msg" id="magic-msg"></div>
    <p class="welcome-footer">Part of the <a href="https://www.ineedtherapy.org">ineedtherapy.org</a> ecosystem</p>
  </div>
</div>

<footer>
  <span class="f-note">Not a crisis service — In crisis? Call or text 988</span>
</footer>

<script>
const SUPABASE_URL = 'https://qroizygknxdjsstkezsf.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4';

// Check if already logged in
(function() {
  var token = localStorage.getItem('sb_access_token');
  if (token) { window.location.href = '/dashboard.html'; return; }

  // Check for magic link callback in hash
  var hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    var params = new URLSearchParams(hash.substring(1));
    var accessToken = params.get('access_token');
    if (accessToken) {
      localStorage.setItem('sb_access_token', accessToken);
      var refreshToken = params.get('refresh_token');
      if (refreshToken) localStorage.setItem('sb_refresh_token', refreshToken);
      window.location.href = '/dashboard.html';
      return;
    }
  }
})();

// Cloudflare Turnstile callback. Single-use token — Supabase Auth verifies it
// server-side via the secret key configured on project qroizygknxdjsstkezsf.
window.__turnstileToken = null;
window.onTurnstileVerified = function (token) {
  window.__turnstileToken = token;
  var btn = document.getElementById('magic-btn');
  if (btn) btn.disabled = false;
};

// UTM capture for attribution tracking. Coaching uses magic-link auth, so
// the URL state from welcome.html is lost during the email round-trip.
// Stash any present UTM params in localStorage so dashboard.html can
// include them when it auto-creates the explorer_profiles row after the
// first magic-link click. Only writes when at least one UTM is present —
// an organic visit doesn't clobber a prior paid-traffic capture.
(function captureUTM() {
  try {
    var params = new URLSearchParams(window.location.search);
    var keys = ['utm_source','utm_campaign','utm_medium','utm_content','utm_term'];
    var captured = {};
    var any = false;
    keys.forEach(function(k) {
      var v = params.get(k);
      if (v) { captured[k] = v; any = true; }
    });
    if (any) {
      captured.captured_at = new Date().toISOString();
      localStorage.setItem('utm_capture', JSON.stringify(captured));
    }
  } catch (e) { /* localStorage unavailable — silent no-op */ }
})();

async function sendMagicLink() {
  var email = document.getElementById('magic-email').value.trim();
  var msg = document.getElementById('magic-msg');
  var btn = document.getElementById('magic-btn');

  if (!email) { msg.textContent = 'Please enter your email.'; return; }
  if (!window.__turnstileToken) {
    msg.textContent = 'Verification needed before continuing.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';
  msg.textContent = '';

  try {
    var res = await fetch(SUPABASE_URL + '/auth/v1/magiclink', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY
      },
      body: JSON.stringify({
        email: email,
        gotrue_meta_security: { captcha_token: window.__turnstileToken },
        options: {
          emailRedirectTo: 'https://www.ineedcoaching.org/dashboard.html'
        }
      })
    });

    if (res.ok) {
      msg.textContent = 'Check your inbox. A magic link is on its way.';
      btn.textContent = 'Link sent';
    } else {
      var err = await res.json().catch(function() { return {}; });
      msg.textContent = err.msg || err.message || 'Something went wrong. Please try again.';
      // Token is single-use — reset the widget so the next attempt has a fresh one.
      if (window.turnstile) window.turnstile.reset();
      window.__turnstileToken = null;
      btn.disabled = true;
      btn.textContent = 'Send magic link';
    }
  } catch(e) {
    msg.textContent = 'Network error. Please try again.';
    if (window.turnstile) window.turnstile.reset();
    window.__turnstileToken = null;
    btn.disabled = true;
    btn.textContent = 'Send magic link';
  }
}
</script>
<script data-MOBILE_NAV_HAMBURGER_v1>
(function() {
  var btn = document.getElementById('nav-hamburger');
  var menu = document.getElementById('nav-links-container');
  if (!btn || !menu) return;
  btn.addEventListener('click', function() {
    var isOpen = menu.classList.toggle('nav-open');
    btn.classList.toggle('is-open', isOpen);
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    btn.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
  });
  menu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      menu.classList.remove('nav-open');
      btn.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'Open menu');
    });
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && menu.classList.contains('nav-open')) {
      menu.classList.remove('nav-open');
      btn.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'Open menu');
      btn.focus();
    }
  });
})();
</script>
</body>
</html>
