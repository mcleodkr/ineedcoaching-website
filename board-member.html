<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Alignment Lab · Board Member · ineedcoaching.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --navy: #1a3a52; --navy-deep: #0f2638; --gold: #c49a3c; --cream: #f7f5f1; --cream-warm: #faf6ed; --ink: #0f1b2d; --muted: #6b7280; --border: #d4cdb8; --serif: "Cormorant Garamond", Georgia, serif; --sans: "DM Sans", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); color: var(--ink); background: var(--cream); line-height: 1.5; }
.nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(26, 58, 82, 0.95); backdrop-filter: blur(10px); z-index: 100; padding: 14px 0; border-bottom: 1px solid rgba(196, 154, 60, 0.2); }
.nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
.nav-brand { color: var(--cream); font-family: var(--serif); font-size: 20px; font-weight: 600; text-decoration: none; }
.main { padding-top: 80px; max-width: 720px; margin: 0 auto; padding-left: 24px; padding-right: 24px; padding-bottom: 60px; }
.hero { padding: 40px 0 30px; }
.eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--gold); margin-bottom: 16px; font-weight: 500; }
.hero h1 { font-family: var(--serif); font-size: 44px; line-height: 1.1; font-weight: 500; color: var(--navy); margin-bottom: 16px; letter-spacing: -0.5px; }
.hero h1 em { color: var(--gold); font-style: italic; }
.hero-lead { font-family: var(--serif); font-size: 19px; line-height: 1.55; color: var(--ink); opacity: 0.85; }
.scenario-card { background: var(--navy); color: var(--cream); padding: 28px 32px; border-radius: 3px; margin-bottom: 24px; }
.scenario-label { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; opacity: 0.6; margin-bottom: 8px; }
.scenario-title { font-family: var(--serif); font-size: 26px; margin-bottom: 14px; font-weight: 500; }
.scenario-detail { font-family: var(--serif); font-size: 16px; line-height: 1.6; opacity: 0.9; }
.scenario-meta { display: flex; gap: 20px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(247, 245, 241, 0.15); font-size: 12px; flex-wrap: wrap; }
.scenario-meta span { opacity: 0.8; }
.scenario-meta strong { color: var(--gold); margin-right: 6px; }
.form-card { background: var(--cream-warm); border-top: 4px solid var(--gold); padding: 32px; border-radius: 3px; margin-bottom: 24px; box-shadow: 0 20px 40px -20px rgba(15, 27, 45, 0.2); }
.form-title { font-family: var(--serif); font-size: 22px; color: var(--navy); margin-bottom: 6px; font-weight: 500; }
.form-sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); background: #fff; border-radius: 2px; font-family: var(--sans); font-size: 15px; color: var(--ink); }
input:focus, select:focus { outline: none; border-color: var(--navy); }
.field { margin-bottom: 16px; }
.btn { cursor: pointer; border: none; font-family: var(--sans); padding: 14px 28px; border-radius: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; width: 100%; }
.btn-primary { background: var(--navy); color: var(--cream); }
.btn-primary:hover { background: var(--navy-deep); }
.err { color: #9b2c2c; font-size: 13px; margin-bottom: 10px; }
.privacy { background: #fff; border: 1px solid var(--border); padding: 18px; border-radius: 3px; margin-bottom: 24px; }
.privacy-title { font-family: var(--serif); font-size: 17px; color: var(--navy); margin-bottom: 10px; font-weight: 500; }
.privacy ul { list-style: none; }
.privacy li { font-size: 13px; color: var(--muted); margin-bottom: 8px; padding-left: 20px; position: relative; line-height: 1.5; }
.privacy li::before { content: "🔒"; position: absolute; left: 0; top: 0; }
.loader { text-align: center; padding: 80px 20px; }
.spinner-big { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-card { background: #fff; border-top: 4px solid #9b2c2c; padding: 32px; border-radius: 3px; text-align: center; }
.error-card h2 { font-family: var(--serif); color: var(--navy); margin-bottom: 12px; font-weight: 500; }
.error-card p { color: var(--muted); margin-bottom: 20px; }
.footer { border-top: 1px solid var(--border); margin-top: 40px; padding-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">ineedcoaching.org</a>
  </div>
</nav>

<main class="main">
  <div id="app">
    <div class="loader">
      <div class="spinner-big"></div>
      <div>Loading board scenario...</div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://qroizygknxdjsstkezsf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4";

const app = document.getElementById("app");
let board = null;
let error = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

async function loadBoard() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  if (!token) { error = "No access token in link. Ask your board president for the correct link."; render(); return; }

  try {
    const res = await fetch(SUPABASE_URL + "/functions/v1/decision-lab-api", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: "board_get_by_token", payload: { share_token: token } })
    });
    if (!res.ok) throw new Error("fetch failed");
    const data = await res.json();
    if (data.error || !data.board) throw new Error(data.error || "not found");
    board = data.board;
  } catch (e) {
    error = "This link may have expired or the scenario may have been closed. Check with your board president.";
  }
  render();
}

function launchLab(memberInfo) {
  // Store the member's info and board scenario for decision-lab.html to pick up
  const prefill = {
    name: memberInfo.name,
    email: memberInfo.email,
    role: memberInfo.role,
    districtContext: board.district_context || "Mixed",
    timeline: board.timeline || "This week",
    scenario: board.scenario,
    scenarioOther: board.scenario === "Other" ? (board.scenario_detail || "") : "",
    board_scenario_id: board.id,
    board_scenario_detail: board.scenario_detail,
    board_proposed_decision: board.proposed_decision,
    board_decision_stage: board.decision_stage
  };

  try {
    localStorage.setItem("decision_lab_board_prefill", JSON.stringify(prefill));
    localStorage.removeItem("decision_lab_session_v1");
  } catch (e) {}

  window.location.href = "/decision-lab.html?board=1";
}

function renderError() {
  const wrap = el("div");
  const hero = el("div", "hero");
  hero.appendChild(el("div", "eyebrow", "BOARD ALIGNMENT LAB"));
  const h1 = el("h1", null, "Can't open this scenario");
  hero.appendChild(h1);
  wrap.appendChild(hero);
  const ec = el("div", "error-card");
  ec.appendChild(el("h2", null, "Link issue"));
  ec.appendChild(el("p", null, error));
  wrap.appendChild(ec);
  return wrap;
}

function renderIntro() {
  const wrap = el("div");

  const hero = el("div", "hero");
  hero.appendChild(el("div", "eyebrow", "BOARD ALIGNMENT LAB · MEMBER PARTICIPATION"));
  const h1 = el("h1");
  h1.innerHTML = 'Your <em>board president</em> asked you to run this.';
  hero.appendChild(h1);
  hero.appendChild(el("p", "hero-lead", "10 minutes. Completely private. Your individual brief is just for you. Your board president only sees aggregated patterns across all members — never your individual answers."));
  wrap.appendChild(hero);

  const sc = el("div", "scenario-card");
  sc.appendChild(el("div", "scenario-label", "THE SCENARIO"));
  sc.appendChild(el("div", "scenario-title", board.scenario + (board.proposed_decision ? " · " + board.proposed_decision : "")));
  if (board.scenario_detail) sc.appendChild(el("div", "scenario-detail", board.scenario_detail));
  const meta = el("div", "scenario-meta");
  if (board.decision_stage) {
    const span = el("span"); span.innerHTML = '<strong>Stage:</strong> ' + board.decision_stage;
    meta.appendChild(span);
  }
  if (board.timeline) {
    const span = el("span"); span.innerHTML = '<strong>Timeline:</strong> ' + board.timeline;
    meta.appendChild(span);
  }
  if (board.district_context) {
    const span = el("span"); span.innerHTML = '<strong>District:</strong> ' + board.district_context;
    meta.appendChild(span);
  }
  sc.appendChild(meta);
  wrap.appendChild(sc);

  const privacy = el("div", "privacy");
  privacy.appendChild(el("div", "privacy-title", "How this works"));
  const ul = document.createElement("ul");
  [
    "You answer 9 short steps about how you read this decision",
    "You get your own private Decision Profile at the end — yours alone",
    "The board president sees clustered patterns — never your individual responses",
    "Your name is never shown beside your positions",
    "This takes about 10 minutes"
  ].forEach(function(t) {
    const li = el("li", null, t);
    ul.appendChild(li);
  });
  privacy.appendChild(ul);
  wrap.appendChild(privacy);

  const card = el("div", "form-card");
  card.appendChild(el("div", "form-title", "Enter the lab"));
  card.appendChild(el("div", "form-sub", "We need your name and email so your responses save as you go, and your individual brief reaches you."));

  const state = { name: "", email: "", role: "Board Member", err: "" };

  function paintForm() {
    card.querySelectorAll(".field, .err, .btn").forEach(function(n) { n.remove(); });

    const nF = el("div", "field");
    nF.appendChild(el("label", null, "Your name"));
    const nI = document.createElement("input");
    nI.type = "text"; nI.value = state.name; nI.placeholder = "First and last";
    nI.oninput = function(e) { state.name = e.target.value; };
    nF.appendChild(nI);
    card.appendChild(nF);

    const eF = el("div", "field");
    eF.appendChild(el("label", null, "Your email"));
    const eI = document.createElement("input");
    eI.type = "email"; eI.value = state.email; eI.placeholder = "you@district.org";
    eI.oninput = function(e) { state.email = e.target.value; };
    eF.appendChild(eI);
    card.appendChild(eF);

    const rF = el("div", "field");
    rF.appendChild(el("label", null, "Your role on this board"));
    const rS = document.createElement("select");
    ["Board Member", "Board President", "Superintendent", "Cabinet / Central Office", "Other"].forEach(function(o) {
      const opt = document.createElement("option");
      opt.value = o; opt.textContent = o;
      if (state.role === o) opt.selected = true;
      rS.appendChild(opt);
    });
    rS.onchange = function(e) { state.role = e.target.value; };
    rF.appendChild(rS);
    card.appendChild(rF);

    if (state.err) card.appendChild(el("div", "err", state.err));

    const btn = el("button", "btn btn-primary", "Begin the Decision Lab →");
    btn.onclick = function() {
      if (!state.name.trim()) { state.err = "Please enter your name."; paintForm(); return; }
      if (!state.email.includes("@")) { state.err = "Please enter a valid email."; paintForm(); return; }
      launchLab(state);
    };
    card.appendChild(btn);
  }

  paintForm();
  wrap.appendChild(card);

  const foot = el("div", "footer");
  foot.textContent = "The Boardroom Decision Lab · ineedcoaching.org · Private Beta";
  wrap.appendChild(foot);
  const disclaimer = el("div");
  disclaimer.style.cssText = "max-width: 640px; margin: 16px auto 0; padding: 0 20px; font-size: 11px; line-height: 1.6; color: var(--muted); text-align: center;";
  disclaimer.textContent = "This tool is designed for individual decision analysis and aggregated pattern recognition. It is not a substitute for official board meetings. Consult your district\u2019s legal counsel regarding open meeting law compliance in your jurisdiction before using this tool with board members.";
  wrap.appendChild(disclaimer);

  return wrap;
}

function render() {
  app.innerHTML = "";
  if (error) { app.appendChild(renderError()); return; }
  if (!board) return; // still loading
  app.appendChild(renderIntro());
}

loadBoard();
</script>
<script src="/bug-report-widget.js" defer></script>
</body>
</html>
