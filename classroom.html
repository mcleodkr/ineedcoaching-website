<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom — ineedcoaching.org</title>
<meta name="description" content="Your learning dashboard on ineedcoaching.org">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a3a52;
  --forest: #4a7c59;
  --cream: #f7f4ee;
  --white: #ffffff;
  --gold: #c49a3c;
  --gold-hover: #a87d1f;
  --muted: #6b6b60;
  --border: #e0ddd5;
  --r: 14px;
  --r-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Cabinet Grotesk', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }

/* LOGIN */
.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; background: var(--cream); }
.login-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 48px 40px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.06); }
.login-card h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 10px; }
.login-card .login-sub { font-size: 0.92rem; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
.login-card input[type="email"] { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-sm); font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.95rem; color: var(--ink); background: var(--cream); margin-bottom: 14px; transition: border-color 0.2s; }
.login-card input[type="email"]:focus { outline: none; border-color: var(--gold); }
.login-btn { width: 100%; padding: 14px 24px; background: var(--gold); color: var(--white); border: none; border-radius: var(--r-sm); font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
.login-btn:hover { background: var(--gold-hover); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-msg { font-size: 0.82rem; color: var(--gold); margin-top: 14px; min-height: 20px; }
.login-logo { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--ink); margin-bottom: 24px; }
.login-logo .logo-i { color: var(--gold); font-style: italic; }
.login-logo .logo-coaching { color: var(--gold); font-style: italic; }

/* NAV */
.top-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 300; display: flex; align-items: center; justify-content: space-between; padding: 14px 52px; background: var(--ink); border-bottom: 1px solid rgba(255,255,255,0.1); }
.logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: var(--cream); text-decoration: none; }
.logo .logo-i { color: var(--gold); font-style: italic; }
.logo .logo-coaching { color: var(--gold); font-style: italic; }
.nav-right { display: flex; align-items: center; gap: 18px; }
.nav-email { font-size: 0.85rem; color: var(--cream); }
.sign-out-btn { background: none; border: 1.5px solid rgba(255,255,255,0.2); color: var(--cream); padding: 7px 18px; border-radius: 50px; font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.sign-out-btn:hover { border-color: var(--gold); color: var(--gold); }

/* MAIN */
.classroom { display: none; }
.classroom-content { max-width: 1000px; margin: 0 auto; padding: 90px 40px 80px; }
.classroom-content h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 8px; }
.classroom-content .subtitle { font-size: 0.95rem; color: var(--muted); margin-bottom: 32px; }

/* COURSE GRID */
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 32px; }
.course-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); padding: 28px; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
.course-card:hover { border-color: var(--gold); box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.course-card.active-card { border-color: var(--gold); border-width: 2px; }
.course-card h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--ink); margin-bottom: 6px; }
.course-card .card-coach { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
.format-badge { display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: rgba(196,154,60,0.15); color: var(--gold); margin-bottom: 12px; }
.progress-bar-wrap { background: var(--border); border-radius: 50px; height: 8px; overflow: hidden; margin-bottom: 6px; }
.progress-bar-fill { height: 100%; border-radius: 50px; background: var(--forest); transition: width 0.4s; }
.progress-text { font-size: 0.78rem; color: var(--muted); }

/* LESSON VIEW */
.lesson-view { display: none; background: var(--white); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 32px; }
.lesson-view.open { display: block; }
.lesson-header { background: var(--ink); padding: 28px 32px; }
.lesson-header h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold); margin-bottom: 4px; }
.lesson-header .lh-coach { font-size: 0.85rem; color: rgba(247,244,238,0.7); }
.lesson-header .lh-progress-wrap { margin-top: 16px; }
.lesson-header .lh-progress-bar { background: rgba(255,255,255,0.15); border-radius: 50px; height: 8px; overflow: hidden; }
.lesson-header .lh-progress-fill { height: 100%; border-radius: 50px; background: var(--gold); transition: width 0.4s; }
.lesson-header .lh-progress-text { font-size: 0.78rem; color: rgba(247,244,238,0.6); margin-top: 6px; }
.lesson-body { display: flex; min-height: 500px; }
.lesson-sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; max-height: 600px; }
.lesson-item { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
.lesson-item:hover { background: rgba(196,154,60,0.06); }
.lesson-item.active-lesson { background: rgba(196,154,60,0.1); }
.lesson-checkbox { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
.lesson-checkbox.checked { background: var(--forest); border-color: var(--forest); }
.lesson-checkbox.checked::after { content: ''; display: block; width: 6px; height: 10px; border: solid var(--white); border-width: 0 2px 2px 0; transform: rotate(45deg); margin-top: -2px; }
.lesson-item-title { font-size: 0.88rem; font-weight: 600; color: var(--ink); line-height: 1.4; }
.lesson-item-title.completed-title { color: var(--muted); text-decoration: line-through; }
.lesson-video-icon { color: var(--gold); font-size: 0.8rem; margin-left: auto; flex-shrink: 0; }
.lesson-content-area { flex: 1; padding: 32px; overflow-y: auto; max-height: 600px; }
.lesson-content-area h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--ink); margin-bottom: 16px; }
.lesson-content-area .lesson-html { font-size: 0.95rem; line-height: 1.8; color: var(--muted); }
.lesson-content-area .lesson-html p { margin-bottom: 12px; }
.lesson-content-area .lesson-video { margin-bottom: 20px; border-radius: var(--r-sm); overflow: hidden; }
.lesson-content-area .lesson-video iframe { width: 100%; height: 360px; border: none; }
.lesson-content-area .no-lesson-selected { text-align: center; padding: 60px 24px; color: var(--muted); font-size: 0.92rem; font-style: italic; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; background: none; border: 1px solid var(--border); border-radius: var(--r-sm); font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--ink); cursor: pointer; transition: border-color 0.2s; margin-bottom: 20px; }
.back-btn:hover { border-color: var(--gold); }

/* COMPLETION */
.completion-banner { background: var(--forest); color: var(--white); padding: 32px; text-align: center; border-radius: var(--r); margin: 20px 32px 32px; }
.completion-banner h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 10px; }
.completion-banner p { font-size: 0.92rem; opacity: 0.9; margin-bottom: 16px; }
.cert-btn { display: inline-block; padding: 12px 28px; background: var(--gold); color: var(--white); border: none; border-radius: var(--r-sm); font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; transition: background 0.2s; }
.cert-btn:hover { background: var(--gold-hover); }

/* EMPTY */
.empty-state { text-align: center; padding: 60px 24px; }
.empty-state p { font-size: 0.95rem; color: var(--muted); font-style: italic; line-height: 1.6; }
.empty-state a { color: var(--gold); text-decoration: none; font-weight: 700; }

/* LOADING */
.loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 40vh; gap: 16px; }
.loading-spinner { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* MOBILE */
@media (max-width: 768px) {
  .top-nav { padding: 12px 20px; }
  .nav-email { display: none; }
  .classroom-content { padding: 80px 16px 60px; }
  .course-grid { grid-template-columns: 1fr; }
  .lesson-body { flex-direction: column; }
  .lesson-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 300px; }
  .lesson-content-area { max-height: none; }
  .lesson-content-area .lesson-video iframe { height: 220px; }
  .login-card { padding: 32px 24px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo"><span class="logo-i">i</span>need<span class="logo-coaching">coaching</span>.org</div>
    <h1>Student Classroom</h1>
    <p class="login-sub">Sign in with your email to access your courses.</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="you@example.com" required>
      <button type="submit" class="login-btn" id="login-submit">Send magic link</button>
    </form>
    <div class="login-msg" id="login-msg"></div>
  </div>
</div>

<!-- CLASSROOM -->
<div id="classroom" class="classroom">
  <nav style="position:fixed;top:0;left:0;right:0;z-index:300;display:flex;align-items:center;justify-content:space-between;padding:14px 52px;background:rgba(26,58,82,0.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.1);">
    <a href="/" style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:#f7f4ee;text-decoration:none;"><span style="color:#c49a3c;font-style:italic;">i</span>need<span style="color:#c49a3c;font-style:italic;">coaching</span>.org</a>
    <div style="display:flex;align-items:center;gap:22px;">
      <a href="/coaches.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Coaches</a>
      <a href="/sessions.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Sessions</a>
      <a href="/coach-courses.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Courses</a>
      <a href="/#articles" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Articles</a>
      <a href="/coaching-commons.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Commons</a>
      <a href="/coach-dashboard.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Dashboard</a>
      <a href="/coach-signup.html" style="font-size:0.78rem;font-weight:700;background:#c49a3c;color:#1a3a52;padding:8px 18px;border-radius:50px;text-decoration:none;">List Your Practice</a>
    </div>
  </nav>

  <div class="classroom-content">
    <div id="courses-view">
      <h1>My Courses</h1>
      <p class="subtitle">Pick up where you left off.</p>
      <div id="courses-loading" class="loading-state" style="min-height:30vh;">
        <div class="loading-spinner"></div>
      </div>
      <div id="courses-grid" class="course-grid" style="display:none;"></div>
      <div id="courses-empty" class="empty-state" style="display:none;">
        <p>You haven't enrolled in any courses yet.<br><a href="/coach-courses.html">Browse courses</a></p>
      </div>
    </div>

    <div id="lesson-view" class="lesson-view"></div>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://qroizygknxdjsstkezsf.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4';
var TOKEN_KEY = 'sb_access_token';

var currentToken = null;
var currentUser = null;
var enrollments = [];
var currentEnrollment = null;
var currentLessons = [];
var currentCompletions = [];
var selectedLessonId = null;

function $(id) { return document.getElementById(id); }

function escapeHtml(str) {
  if (!str) return '';
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function apiHeaders(token) {
  return {
    'apikey': ANON_KEY,
    'Authorization': 'Bearer ' + (token || currentToken),
    'Content-Type': 'application/json'
  };
}

/* AUTH: HASH CALLBACK */
(function checkHash() {
  var hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    var params = new URLSearchParams(hash.substring(1));
    var token = params.get('access_token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      window.location.hash = '';
      window.location.reload();
      return;
    }
  }
})();

/* AUTH: LOGIN FORM */
$('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var email = $('login-email').value.trim();
  if (!email) return;
  var btn = $('login-submit');
  var msg = $('login-msg');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  msg.textContent = '';
  try {
    var res = await fetch(SUPABASE_URL + '/auth/v1/magiclink', {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        options: { emailRedirectTo: 'https://www.ineedcoaching.org/classroom.html' }
      })
    });
    if (res.ok || res.status === 200) {
      msg.textContent = 'Check your email for your magic link.';
      msg.style.color = 'var(--forest)';
    } else {
      var data = await res.json();
      msg.textContent = data.msg || data.error_description || 'Something went wrong.';
      msg.style.color = '#c44';
    }
  } catch (err) {
    msg.textContent = 'Network error. Please try again.';
    msg.style.color = '#c44';
  }
  btn.disabled = false;
  btn.textContent = 'Send magic link';
});

/* SIGN OUT */
document.addEventListener('click', function(e) {
  if (e.target.id === 'sign-out-btn') {
    localStorage.removeItem(TOKEN_KEY);
    window.location.reload();
  }
});

/* INIT */
async function init() {
  var token = localStorage.getItem(TOKEN_KEY);
  if (!token) {
    $('login-screen').style.display = 'flex';
    return;
  }

  $('login-screen').style.display = 'none';

  try {
    var res = await fetch(SUPABASE_URL + '/auth/v1/user', {
      headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) {
      localStorage.removeItem(TOKEN_KEY);
      window.location.reload();
      return;
    }
    currentUser = await res.json();
    currentToken = token;
  } catch (err) {
    localStorage.removeItem(TOKEN_KEY);
    window.location.reload();
    return;
  }

  $('classroom').style.display = 'block';
  $('nav-email').textContent = currentUser.email;

  loadEnrollments();
}

/* LOAD ENROLLMENTS */
async function loadEnrollments() {
  try {
    var email = currentUser.email;
    var res = await fetch(SUPABASE_URL + '/rest/v1/coach_course_enrollments?student_email=eq.' + encodeURIComponent(email) + '&select=*,coach_courses(*,coach_profiles(display_name,slug,photo_url,headline))', {
      headers: apiHeaders()
    });
    enrollments = await res.json();
    if (!Array.isArray(enrollments)) enrollments = [];
  } catch (e) {
    enrollments = [];
  }

  $('courses-loading').style.display = 'none';

  if (enrollments.length === 0) {
    $('courses-empty').style.display = 'block';
    return;
  }

  // Load lesson counts and completions for progress
  for (var i = 0; i < enrollments.length; i++) {
    var en = enrollments[i];
    try {
      var lessonsRes = await fetch(SUPABASE_URL + '/rest/v1/coach_course_lessons?course_id=eq.' + en.course_id + '&select=id&order=sort_order.asc', {
        headers: apiHeaders()
      });
      var lessons = await lessonsRes.json();
      en._totalLessons = Array.isArray(lessons) ? lessons.length : 0;

      var compRes = await fetch(SUPABASE_URL + '/rest/v1/coach_lesson_completions?enrollment_id=eq.' + en.id + '&select=lesson_id', {
        headers: apiHeaders()
      });
      var comps = await compRes.json();
      en._completedLessons = Array.isArray(comps) ? comps.length : 0;
    } catch (e) {
      en._totalLessons = 0;
      en._completedLessons = 0;
    }
  }

  renderCourseCards();
}

function renderCourseCards() {
  var grid = $('courses-grid');
  var html = '';

  enrollments.forEach(function(en) {
    var course = en.coach_courses || {};
    var coach = course.coach_profiles || {};
    var total = en._totalLessons || 0;
    var completed = en._completedLessons || 0;
    var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
    var formatMap = { 'self-paced': 'Self-paced', 'cohort': 'Cohort', 'masterclass': 'Masterclass' };

    html += '<div class="course-card" data-enrollment-id="' + en.id + '" onclick="openCourse(\'' + en.id + '\')">';
    html += '<span class="format-badge">' + escapeHtml(formatMap[course.format] || course.format || 'Course') + '</span>';
    html += '<h3>' + escapeHtml(course.title || 'Untitled Course') + '</h3>';
    html += '<div class="card-coach">with ' + escapeHtml(coach.display_name || 'Coach') + '</div>';
    html += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>';
    html += '<div class="progress-text">' + completed + ' / ' + total + ' lessons' + (pct === 100 ? ' — Complete!' : '') + '</div>';
    html += '</div>';
  });

  grid.innerHTML = html;
  grid.style.display = 'grid';
}

/* OPEN COURSE - LESSON VIEW */
async function openCourse(enrollmentId) {
  currentEnrollment = null;
  for (var i = 0; i < enrollments.length; i++) {
    if (enrollments[i].id === enrollmentId) {
      currentEnrollment = enrollments[i];
      break;
    }
  }
  if (!currentEnrollment) return;

  selectedLessonId = null;
  $('courses-view').style.display = 'none';

  var course = currentEnrollment.coach_courses || {};
  var coach = course.coach_profiles || {};

  // Fetch lessons
  try {
    var res = await fetch(SUPABASE_URL + '/rest/v1/coach_course_lessons?course_id=eq.' + currentEnrollment.course_id + '&order=sort_order.asc&select=*', {
      headers: apiHeaders()
    });
    currentLessons = await res.json();
    if (!Array.isArray(currentLessons)) currentLessons = [];
  } catch (e) {
    currentLessons = [];
  }

  // Fetch completions
  try {
    var res2 = await fetch(SUPABASE_URL + '/rest/v1/coach_lesson_completions?enrollment_id=eq.' + currentEnrollment.id + '&select=*', {
      headers: apiHeaders()
    });
    currentCompletions = await res2.json();
    if (!Array.isArray(currentCompletions)) currentCompletions = [];
  } catch (e) {
    currentCompletions = [];
  }

  renderLessonView();
}

function isLessonCompleted(lessonId) {
  for (var i = 0; i < currentCompletions.length; i++) {
    if (currentCompletions[i].lesson_id === lessonId) return true;
  }
  return false;
}

function getCompletionId(lessonId) {
  for (var i = 0; i < currentCompletions.length; i++) {
    if (currentCompletions[i].lesson_id === lessonId) return currentCompletions[i].id;
  }
  return null;
}

function renderLessonView() {
  var course = currentEnrollment.coach_courses || {};
  var coach = course.coach_profiles || {};
  var completed = 0;
  currentLessons.forEach(function(l) { if (isLessonCompleted(l.id)) completed++; });
  var total = currentLessons.length;
  var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  var allDone = total > 0 && completed === total;

  var html = '';
  html += '<div class="lesson-header">';
  html += '<button class="back-btn" onclick="closeLessonView()" style="color:var(--cream);border-color:rgba(255,255,255,0.2);margin-bottom:16px;">&larr; Back to courses</button>';
  html += '<h2>' + escapeHtml(course.title || '') + '</h2>';
  html += '<div class="lh-coach">with ' + escapeHtml(coach.display_name || '') + '</div>';
  html += '<div class="lh-progress-wrap">';
  html += '<div class="lh-progress-bar"><div class="lh-progress-fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="lh-progress-text">' + completed + ' / ' + total + ' lessons completed (' + pct + '%)</div>';
  html += '</div></div>';

  html += '<div class="lesson-body">';
  html += '<div class="lesson-sidebar">';
  currentLessons.forEach(function(lesson) {
    var done = isLessonCompleted(lesson.id);
    var isActive = selectedLessonId === lesson.id;
    html += '<div class="lesson-item' + (isActive ? ' active-lesson' : '') + '" data-lesson-id="' + lesson.id + '">';
    html += '<div class="lesson-checkbox' + (done ? ' checked' : '') + '" onclick="event.stopPropagation();toggleLesson(\'' + lesson.id + '\')"></div>';
    html += '<span class="lesson-item-title' + (done ? ' completed-title' : '') + '" onclick="selectLesson(\'' + lesson.id + '\')">' + escapeHtml(lesson.title) + '</span>';
    if (lesson.video_url) {
      html += '<span class="lesson-video-icon">&#9654;</span>';
    }
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="lesson-content-area">';
  if (selectedLessonId) {
    var sel = null;
    for (var i = 0; i < currentLessons.length; i++) {
      if (currentLessons[i].id === selectedLessonId) { sel = currentLessons[i]; break; }
    }
    if (sel) {
      html += '<h3>' + escapeHtml(sel.title) + '</h3>';
      if (sel.video_url) {
        html += '<div class="lesson-video"><iframe src="' + escapeHtml(sel.video_url) + '" allowfullscreen></iframe></div>';
      }
      if (sel.content) {
        html += '<div class="lesson-html">' + sel.content + '</div>';
      }
    }
  } else {
    html += '<div class="no-lesson-selected">Select a lesson from the sidebar to begin.</div>';
  }
  html += '</div>';
  html += '</div>';

  // Completion banner
  if (allDone) {
    html += '<div class="completion-banner">';
    html += '<h3>Congratulations! You completed ' + escapeHtml(course.title || 'this course') + '.</h3>';
    html += '<p>You\'ve finished all lessons. Well done!</p>';
    if (currentEnrollment.certificate_id) {
      html += '<a href="/certificate.html?id=' + encodeURIComponent(currentEnrollment.certificate_id) + '" class="cert-btn">Download Certificate</a>';
    } else {
      html += '<button class="cert-btn" onclick="generateCertificate()">Generate Certificate</button>';
    }
    html += '</div>';
  }

  var view = $('lesson-view');
  view.innerHTML = html;
  view.classList.add('open');
}

function selectLesson(lessonId) {
  selectedLessonId = lessonId;
  renderLessonView();
}

function closeLessonView() {
  $('lesson-view').classList.remove('open');
  $('lesson-view').innerHTML = '';
  $('courses-view').style.display = 'block';
  selectedLessonId = null;
  // Refresh counts
  currentEnrollment._completedLessons = currentCompletions.length;
  renderCourseCards();
}

async function toggleLesson(lessonId) {
  var done = isLessonCompleted(lessonId);

  if (done) {
    // Uncomplete: DELETE
    var compId = getCompletionId(lessonId);
    if (!compId) return;
    try {
      await fetch(SUPABASE_URL + '/rest/v1/coach_lesson_completions?id=eq.' + compId, {
        method: 'DELETE',
        headers: { ...apiHeaders(), 'Prefer': 'return=representation' }
      });
      currentCompletions = currentCompletions.filter(function(c) { return c.id !== compId; });
    } catch (e) { /* ignore */ }
  } else {
    // Complete: POST
    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/coach_lesson_completions', {
        method: 'POST',
        headers: { ...apiHeaders(), 'Prefer': 'return=representation' },
        body: JSON.stringify({
          enrollment_id: currentEnrollment.id,
          lesson_id: lessonId
        })
      });
      var data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        currentCompletions.push(data[0]);
      }
    } catch (e) { /* ignore */ }
  }

  renderLessonView();
}

async function generateCertificate() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var certId = 'CERT-';
  for (var i = 0; i < 8; i++) {
    certId += chars.charAt(Math.floor(Math.random() * chars.length));
  }

  try {
    await fetch(SUPABASE_URL + '/rest/v1/coach_course_enrollments?id=eq.' + currentEnrollment.id, {
      method: 'PATCH',
      headers: { ...apiHeaders(), 'Prefer': 'return=representation' },
      body: JSON.stringify({
        completed_at: new Date().toISOString(),
        certificate_id: certId
      })
    });
    currentEnrollment.certificate_id = certId;
    currentEnrollment.completed_at = new Date().toISOString();
    renderLessonView();
  } catch (e) {
    alert('Error generating certificate. Please try again.');
  }
}

init();
</script>
</body>
</html>
