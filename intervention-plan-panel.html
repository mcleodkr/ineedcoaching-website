<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intervention Plan · Coach Clarity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1a3a52;
      --gold: #c49a3c;
      --cream: #f7f4ee;
      --bg: #f7f5f1;
      --white: #ffffff;
      --border: #e8e4dc;
      --ink: #1a1a1a;
      --muted: #6b6b60;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      color: var(--navy);
      font-weight: 600;
      margin: 0 0 8px;
    }
    h1 { font-size: 1.85rem; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.05rem; }
    .panel {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 22px 80px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .top-bar a {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }
    .top-bar a:hover { color: var(--ink); }
    .meta {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .card h3 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--navy);
    }
    .item {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      background: #fdfcfa;
    }
    .item:last-child { margin-bottom: 0; }
    .item-title { font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .item-meta { font-size: 0.74rem; color: var(--muted); margin-top: 6px; }
    .quote {
      font-style: italic;
      color: var(--muted);
      border-left: 2px solid var(--gold);
      padding-left: 10px;
      margin-top: 6px;
      font-size: 0.85rem;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .pill.high { background: #c44; color: #fff; }
    .pill.medium { background: var(--gold); color: #fff; }
    .pill.low { background: rgba(107,107,96,0.15); color: var(--muted); }
    .pill.testing { background: rgba(196,154,60,0.18); color: var(--gold); }
    .pill.strengthening { background: #2d6a4f; color: #fff; }
    .pill.weakening { background: #b8860b; color: #fff; }
    .pill.kept { background: #2d6a4f; color: #fff; }
    .pill.broken { background: #c44; color: #fff; }
    .pill.ambiguous { background: #b8860b; color: #fff; }
    .pill.untested { background: rgba(107,107,96,0.18); color: var(--muted); }
    .pill.specific { background: var(--navy); color: #fff; }
    .pill.contingent { background: var(--gold); color: #fff; }
    .pill.directional { background: rgba(107,107,96,0.18); color: var(--muted); }
    .btn {
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 6px;
      border: none;
    }
    .btn-primary { background: var(--gold); color: #fff; }
    .btn-primary:hover { background: #b08930; }
    .btn-secondary { background: transparent; color: var(--navy); border: 1px solid var(--navy); }
    .btn-secondary:hover { background: rgba(26,58,82,0.05); }
    .btn-tertiary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .revision-prompt {
      background: #fdf9f1;
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }
    .revision-prompt p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--navy);
      margin: 0 0 12px;
      line-height: 1.45;
    }
    .revision-prompt textarea {
      width: 100%;
      min-height: 90px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      resize: vertical;
      background: #fff;
    }
    .revision-actions { display: flex; gap: 10px; margin-top: 12px; }
    .updated-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--gold);
      color: #fff;
      padding: 2px 8px;
      border-radius: 50px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .empty-cta {
      background: rgba(196,154,60,0.08);
      border: 1px dashed var(--gold);
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .editable {
      cursor: text;
      border: 1px dashed transparent;
      padding: 6px 8px;
      border-radius: 4px;
      transition: border 0.15s ease;
    }
    .editable:hover { border-color: var(--border); background: #fdfcfa; }
    .edit-input, .edit-textarea {
      width: 100%;
      padding: 8px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      border: 1px solid var(--gold);
      border-radius: 4px;
      background: #fff;
    }
    .save-section-btn {
      margin-top: 6px;
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      cursor: pointer;
    }
    #status-banner {
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 0.92rem;
    }
    .status-draft { background: rgba(196,154,60,0.1); color: #8a6a20; border: 1px solid rgba(196,154,60,0.4); }
    .status-locked { background: rgba(45,106,79,0.1); color: #1a4a3a; border: 1px solid rgba(45,106,79,0.4); }
    .loader {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(196,154,60,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: #fff5f5;
      border: 1px solid #c44;
      color: #8a2222;
      padding: 14px 18px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="top-bar">
      <div>
        <div class="meta" style="margin-bottom:6px;">Intervention Plan</div>
        <h1 id="client-heading">Loading…</h1>
        <div class="meta" id="header-meta" style="text-transform:none;letter-spacing:0;font-size:0.82rem;color:var(--muted);">&nbsp;</div>
      </div>
      <a href="/coach-dashboard.html" id="back-link">← Back to dashboard</a>
    </div>
    <div id="content">
      <div class="loader">
        <div class="spinner"></div>
        <div>Loading plan…</div>
      </div>
    </div>
  </div>

  <script>
  const SUPABASE_URL = 'https://qroizygknxdjsstkezsf.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4';
  const TOKEN_KEY = 'sb_access_token';

  const params = new URLSearchParams(location.search);
  const clientEmail = params.get('client_email') || '';
  let coachId = null;
  let plan = null;
  // bookingId → { ordinal, dateLabel } — populated by loadClientSessions().
  // Keeps raw uuids out of the UI and lets prior_commitments / source tags
  // render "session 1 · Apr 12, 2026" instead of leaking database ids.
  let sessionInfo = {};

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function apiHeaders() {
    const token = localStorage.getItem(TOKEN_KEY);
    return {
      apikey: ANON_KEY,
      Authorization: token ? ('Bearer ' + token) : ('Bearer ' + ANON_KEY),
      'Content-Type': 'application/json',
    };
  }
  function showError(msg) {
    $('content').innerHTML = '<div class="error-box">' + escapeHtml(msg) + '</div>';
  }

  async function loadCoachProfile() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { window.location.href = '/coach-dashboard.html'; return null; }
    const userRes = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + token } });
    if (!userRes.ok) { window.location.href = '/coach-dashboard.html'; return null; }
    const user = await userRes.json();
    const email = user.email;
    const profRes = await fetch(SUPABASE_URL + '/rest/v1/coach_profiles?user_email=eq.' + encodeURIComponent(email.toLowerCase()) + '&select=id,display_name', { headers: apiHeaders() });
    const profRows = await profRes.json();
    if (!Array.isArray(profRows) || profRows.length === 0) {
      showError('No coach profile found for ' + email);
      return null;
    }
    return profRows[0];
  }

  async function loadActivePlan() {
    // locked plans sort first via locked_at (drafts have NULL locked_at,
    // pushed to bottom by nullslast); created_at.desc is the secondary
    // tiebreaker so the most recent draft surfaces when no locked plan exists.
    const res = await fetch(SUPABASE_URL + '/rest/v1/intervention_plans?coach_id=eq.' + coachId + '&client_email=eq.' + encodeURIComponent(clientEmail) + '&archived_at=is.null&order=locked_at.desc.nullslast,created_at.desc&limit=1', { headers: apiHeaders() });
    if (!res.ok) return null;
    const rows = await res.json();
    return Array.isArray(rows) && rows.length ? rows[0] : null;
  }

  // Build a bookingId → { ordinal, dateLabel } map so the UI can display
  // "session 1 · Apr 12, 2026" instead of raw uuids. Ordinals are 1-based
  // and reset per-client in chronological order (oldest = session 1).
  async function loadClientSessions() {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/coach_session_notes?client_email=eq.' + encodeURIComponent(clientEmail) + '&select=booking_id,created_at&order=created_at.asc', { headers: apiHeaders() });
      if (!res.ok) return {};
      const rows = await res.json();
      const map = {};
      (Array.isArray(rows) ? rows : []).forEach(function(r, i) {
        if (!r || !r.booking_id) return;
        map[r.booking_id] = {
          ordinal: i + 1,
          dateLabel: r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : null,
        };
      });
      return map;
    } catch (_) { return {}; }
  }

  function sessionLabel(bookingId) {
    const info = sessionInfo[bookingId];
    if (!info) return null;
    if (info.dateLabel) return 'session ' + info.ordinal + ' · ' + info.dateLabel;
    return 'session ' + info.ordinal;
  }

  // Safe response parser. Vercel's gateway returns HTML on 502/504 — never JSON —
  // so blindly calling res.json() throws an "Unexpected token" parse error and
  // hides the actual status code. This reads body text once, surfaces the HTTP
  // status, and special-cases 504 (the typical Claude-overrun symptom) with a
  // user-actionable message instead of a stack trace.
  async function parseApiResponse(res, defaultErrorMsg) {
    if (res.ok) {
      try { return await res.json(); }
      catch (e) { throw new Error('Server returned malformed JSON.'); }
    }
    let bodyText = '';
    try { bodyText = await res.text(); } catch (_) {}
    if (res.status === 504 || res.status === 502) {
      throw new Error('Server timeout — your revision is taking longer than expected. Try simpler feedback or try again.');
    }
    // Try to extract a JSON error message from server-shaped errors
    try {
      const j = JSON.parse(bodyText);
      if (j && j.error) throw new Error(j.error);
    } catch (parseErr) {
      // Re-throw if it was a real error message, otherwise fall through to status code
      if (parseErr instanceof Error && parseErr.message && parseErr.message !== 'Unexpected end of JSON input' && !parseErr.message.startsWith('Unexpected token')) {
        throw parseErr;
      }
    }
    throw new Error(defaultErrorMsg + ' (status ' + res.status + ')');
  }

  async function generatePlan() {
    $('content').innerHTML = '<div class="loader"><div class="spinner"></div><div>Generating intervention plan… this may take 60–90 seconds.</div></div>';
    try {
      const res = await fetch('/api/generate-intervention-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ coach_id: coachId, client_email: clientEmail }),
      });
      plan = await parseApiResponse(res, 'Generation failed');
      render();
    } catch (e) {
      showError(e.message);
    }
  }

  async function revisePlan(feedback) {
    if (!plan) return;
    $('content').innerHTML = '<div class="loader"><div class="spinner"></div><div>Refining plan… this may take 60–90 seconds.</div></div>';
    try {
      const res = await fetch('/api/revise-intervention-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan_id: plan.id, coach_feedback: feedback, round: plan.generation_round + 1 }),
      });
      plan = await parseApiResponse(res, 'Revision failed');
      render();
    } catch (e) {
      showError(e.message);
    }
  }

  async function lockPlan() {
    if (!plan) return;
    try {
      const res = await fetch('/api/lock-intervention-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan_id: plan.id }),
      });
      plan = await parseApiResponse(res, 'Lock failed');
      render();
    } catch (e) { showError(e.message); }
  }

  async function regenerateFromScratch() {
    if (!confirm('Regenerate the plan from latest sessions? The current plan will be archived.')) return;
    $('content').innerHTML = '<div class="loader"><div class="spinner"></div><div>Regenerating plan from scratch…</div></div>';
    try {
      const res = await fetch('/api/regenerate-intervention-plan-from-scratch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ coach_id: coachId, client_email: clientEmail, archive_plan_id: plan ? plan.id : null }),
      });
      plan = await parseApiResponse(res, 'Regenerate failed');
      render();
    } catch (e) { showError(e.message); }
  }

  async function saveSection(section, newValue) {
    if (!plan) return;
    try {
      const res = await fetch('/api/intervention-plan-section', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan_id: plan.id, section, new_value: newValue, edited_by: coachId }),
      });
      plan = await parseApiResponse(res, 'Save failed');
      render();
    } catch (e) { alert(e.message); }
  }

  function renderItem(content, meta) {
    return '<div class="item">' + content + (meta ? '<div class="item-meta">' + meta + '</div>' : '') + '</div>';
  }

  function sourceTag(sources) {
    if (!Array.isArray(sources) || !sources.length) return '';
    // Prefer human-readable session ordinals when the session map is loaded.
    const labels = sources.map(function(id) {
      const info = sessionInfo[id];
      return info ? ('session ' + info.ordinal) : null;
    }).filter(Boolean);
    if (labels.length === sources.length && labels.length > 0) {
      return 'From ' + labels.join(', ');
    }
    return 'Source: ' + sources.length + ' session' + (sources.length === 1 ? '' : 's');
  }

  // Sections that support coach notes when the plan is locked.
  const NOTEABLE_SECTIONS = new Set([
    'external_conditions','working_hypotheses','strategic_frames','behavioral_targets',
    'modality_sequence','progress_markers','risk_watchouts','session_arc',
  ]);

  function renderCoachNotesForSection(sectionKey) {
    const notes = (Array.isArray(plan.coach_notes) ? plan.coach_notes : []).filter(function(n) { return n && n.section === sectionKey; });
    if (!notes.length) return '';
    return '<div class="coach-notes-block" style="margin-top:12px;">' + notes.map(function(n) {
      const when = n.created_at ? new Date(n.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
      return '<div class="coach-note" style="background:#fdf9f1;border-left:3px solid var(--gold);padding:10px 12px;margin-bottom:6px;border-radius:0 6px 6px 0;">'
        + '<div style="font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;">Coach note' + (when ? ' · ' + escapeHtml(when) : '') + '</div>'
        + '<div style="font-size:0.88rem;color:var(--ink);line-height:1.45;white-space:pre-wrap;">' + escapeHtml(n.note || '') + '</div>'
        + '</div>';
    }).join('') + '</div>';
  }

  function renderAddNoteAffordance(sectionKey) {
    return '<div class="add-note-slot" data-section-slot="' + escapeHtml(sectionKey) + '" style="margin-top:10px;">'
      + '<button class="btn-add-note" data-add-note="' + escapeHtml(sectionKey) + '" style="background:transparent;color:var(--muted);border:1px dashed var(--border);padding:6px 12px;border-radius:6px;font-family:\'DM Sans\',sans-serif;font-size:0.78rem;cursor:pointer;">+ Add coach note</button>'
      + '</div>';
  }

  function renderSection(title, body, opts) {
    opts = opts || {};
    const sectionKey = opts.sectionKey || null;
    const isLocked = plan && plan.status === 'locked';
    const notesHtml = (isLocked && sectionKey && NOTEABLE_SECTIONS.has(sectionKey)) ? renderCoachNotesForSection(sectionKey) : '';
    const addNoteHtml = (isLocked && sectionKey && NOTEABLE_SECTIONS.has(sectionKey)) ? renderAddNoteAffordance(sectionKey) : '';
    return '<div class="card"' + (opts.id ? ' id="' + opts.id + '"' : '') + '>'
      + '<h3>' + escapeHtml(title) + (opts.changed ? '<span class="updated-badge">Updated</span>' : '') + '</h3>'
      + body
      + notesHtml
      + addNoteHtml
      + '</div>';
  }

  function renderExternalConditions() {
    const arr = plan.external_conditions || [];
    if (!arr.length) return '<div class="empty-cta">No external conditions surfaced from sessions.</div>';
    return arr.map(c =>
      renderItem(
        '<div class="item-title">' + escapeHtml(c.description) + ' <span class="pill ' + (c.impact_level || 'medium') + '">' + escapeHtml(c.impact_level || 'medium') + '</span></div>'
        + (c.evidence_quote ? '<div class="quote">"' + escapeHtml(c.evidence_quote) + '"</div>' : ''),
        sourceTag(c.source_sessions)
      )
    ).join('');
  }

  function renderHypotheses() {
    const arr = plan.working_hypotheses || [];
    if (!arr.length) return '<div class="empty-cta">No working hypotheses yet.</div>';
    return arr.map(h =>
      renderItem(
        '<div class="item-title">' + escapeHtml(h.pattern) + ' <span class="pill ' + (h.status || 'testing') + '">' + escapeHtml(h.status || 'testing') + '</span></div>'
        + (Array.isArray(h.drivers) && h.drivers.length ? '<div style="font-size:0.85rem;color:var(--muted);">Drivers: ' + h.drivers.map(escapeHtml).join('; ') + '</div>' : '')
        + (h.expressions && (h.expressions.slow_pattern || h.expressions.fast_pattern) ? '<div style="font-size:0.82rem;margin-top:6px;">'
          + (h.expressions.slow_pattern ? '<div><strong>Slow:</strong> ' + escapeHtml(h.expressions.slow_pattern) + '</div>' : '')
          + (h.expressions.fast_pattern ? '<div><strong>Fast:</strong> ' + escapeHtml(h.expressions.fast_pattern) + '</div>' : '')
          + '</div>' : '')
        + (h.evidence_quote ? '<div class="quote">"' + escapeHtml(h.evidence_quote) + '"</div>' : ''),
        sourceTag(h.source_sessions)
      )
    ).join('');
  }

  function renderFrames() {
    const arr = plan.strategic_frames || [];
    if (!arr.length) return '<div class="empty-cta">No strategic frames yet.</div>';
    return arr.map(f =>
      renderItem(
        '<div class="item-title">' + escapeHtml(f.name) + '</div>'
        + (f.description ? '<div style="font-size:0.85rem;">' + escapeHtml(f.description) + '</div>' : '')
        + (f.primary_tool ? '<div style="font-size:0.82rem;margin-top:6px;"><strong>Primary tool:</strong> ' + escapeHtml(f.primary_tool) + '</div>' : '')
        + (Array.isArray(f.fallback_paths) && f.fallback_paths.length ? '<div style="font-size:0.82rem;margin-top:6px;"><strong>Fallback paths:</strong><ul style="margin:4px 0 0;padding-left:20px;">' + f.fallback_paths.map(fp => '<li>If ' + escapeHtml(fp.trigger) + ' → ' + (Array.isArray(fp.actions) ? fp.actions.map(escapeHtml).join('; ') : '') + '</li>').join('') + '</ul></div>' : ''),
        sourceTag(f.source_sessions)
      )
    ).join('');
  }

  function renderBehavioralTargets() {
    const arr = plan.behavioral_targets || [];
    if (!arr.length) return '<div class="empty-cta">No behavioral targets yet.</div>';
    return arr.map(t =>
      renderItem(
        '<div class="item-title">' + escapeHtml(t.target) + '</div>'
        + (t.frequency ? '<div style="font-size:0.82rem;"><strong>Frequency:</strong> ' + escapeHtml(t.frequency) + '</div>' : '')
        + (t.context ? '<div style="font-size:0.82rem;"><strong>Context:</strong> ' + escapeHtml(t.context) + '</div>' : '')
        + (t.linked_goal_id ? '<div style="font-size:0.78rem;color:var(--gold);margin-top:4px;">Linked to active goal</div>' : ''),
        sourceTag(t.source_sessions)
      )
    ).join('');
  }

  function renderCommitments() {
    const arr = plan.prior_commitments || [];
    if (!arr.length) return '<div class="empty-cta">No prior commitments enumerated.</div>';
    const isLocked = plan && plan.status === 'locked';
    const STATUS_OPTIONS = ['kept','broken','ambiguous','untested'];
    return arr.map(function(c, idx) {
      const status = c.status || 'untested';
      // Status control lives on the metadata row, not next to the title.
      // Keeps every commitment row visually identical regardless of title length.
      const statusEl = isLocked
        ? ('<select class="commitment-status-select" data-commitment-idx="' + idx + '" style="font-family:\'DM Sans\',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:2px 22px 2px 10px;border-radius:50px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--ink);">'
            + STATUS_OPTIONS.map(function(opt) {
              return '<option value="' + opt + '"' + (opt === status ? ' selected' : '') + '>' + opt + '</option>';
            }).join('')
            + '</select>')
        : ('<span class="pill ' + status + '">' + escapeHtml(status) + '</span>');
      const sLabel = sessionLabel(c.source_session);
      const sourceText = sLabel ? ('From ' + escapeHtml(sLabel)) : 'Source session unavailable';
      const metaRow = '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">'
        + statusEl
        + '<span style="color:var(--muted);font-size:0.74rem;">' + sourceText + '</span>'
        + '</div>';
      return renderItem(
        '<div class="item-title">' + escapeHtml(c.commitment_text) + '</div>',
        metaRow
      );
    }).join('');
  }

  function renderModalitySequence() {
    const arr = plan.modality_sequence || [];
    if (!arr.length) return '<div class="empty-cta">No modality selected. <button class="btn btn-secondary" style="margin-top:10px;" onclick="alert(\'Inline modality selection ships with the locked-mode flow.\')">Select modality</button></div>';
    return arr.map(m =>
      renderItem(
        '<div class="item-title">Stage ' + (m.stage || '?') + ' · ' + escapeHtml(m.modality) + '</div>'
        + (m.goal ? '<div style="font-size:0.85rem;color:var(--muted);">' + escapeHtml(m.goal) + '</div>' : '')
        + (Array.isArray(m.techniques) && m.techniques.length ? '<div style="font-size:0.82rem;margin-top:6px;"><strong>Techniques:</strong> ' + m.techniques.map(escapeHtml).join('; ') + '</div>' : '')
        + (Array.isArray(m.source_evidence) && m.source_evidence.length ? '<div style="font-size:0.82rem;margin-top:6px;"><strong>Evidence:</strong>' + m.source_evidence.map(se => '<div class="quote">"' + escapeHtml(se.quote) + '"</div>').join('') + '</div>' : ''),
        ''
      )
    ).join('');
  }

  function renderProgressMarkers() {
    const arr = plan.progress_markers || [];
    if (!arr.length) return '<div class="empty-cta">No progress markers yet.</div>';
    return arr.map(p =>
      renderItem(
        '<div class="item-title">' + escapeHtml(p.marker) + ' <span class="pill" style="background:rgba(26,58,82,0.12);color:var(--navy);">' + escapeHtml(p.type || 'behavioral') + '</span></div>',
        sourceTag(p.source_sessions)
      )
    ).join('');
  }

  function renderRiskWatchouts() {
    const arr = plan.risk_watchouts || [];
    if (!arr.length) return '<div class="empty-cta">No risk watchouts surfaced.</div>';
    return arr.map(r =>
      renderItem(
        '<div class="item-title">' + escapeHtml(r.pattern) + '</div>'
        + (r.detection_signal ? '<div style="font-size:0.82rem;"><strong>Detection:</strong> ' + escapeHtml(r.detection_signal) + '</div>' : '')
        + (r.response_strategy ? '<div style="font-size:0.82rem;"><strong>Response:</strong> ' + escapeHtml(r.response_strategy) + '</div>' : ''),
        'Source: ' + escapeHtml(r.source || 'session')
      )
    ).join('');
  }

  function renderSessionArc() {
    const arr = plan.session_arc || [];
    if (!arr.length) return '<div class="empty-cta">No session arc yet.</div>';
    const isLocked = plan && plan.status === 'locked';
    return arr.map(function(s, i) {
      const isNext = i === 0;
      // Session 1 (next) gets the plan-this-session affordance when the IP is locked.
      // Other arc cards stay non-interactive — coaches plan one session at a time.
      const planBtn = (isLocked && isNext)
        ? '<div style="margin-top:10px;text-align:right;"><button class="btn btn-secondary plan-session-btn" data-session-arc-index="0" style="padding:6px 14px;font-size:0.78rem;">Plan this session →</button></div>'
        : '';
      const inlineSlot = (isLocked && isNext)
        ? '<div class="session-plan-slot" id="session-plan-slot-arc" style="margin-top:14px;"></div>'
        : '';
      const cardHighlight = isNext
        ? 'background:rgba(196,154,60,0.06);border-left:3px solid var(--gold);padding-left:12px;'
        : '';
      return '<div class="item" style="' + cardHighlight + '">'
        + '<div class="item-title">Session ' + escapeHtml(String(s.session_number || '?')) + ' · ' + escapeHtml(s.label || 'tentative') + ' <span class="pill ' + (s.specificity || 'directional') + '">' + escapeHtml(s.specificity || 'directional') + '</span></div>'
        + (s.focus ? '<div style="font-size:0.85rem;">' + escapeHtml(s.focus) + '</div>' : '')
        + (sourceTag(s.source_sessions) ? '<div class="item-meta">' + sourceTag(s.source_sessions) + '</div>' : '')
        + planBtn
        + inlineSlot
        + '</div>';
    }).join('');
  }

  function renderCoachCommitment() {
    const c = plan.coach_commitment || {};
    const isLocked = plan && plan.status === 'locked';
    if (!c.text && !isLocked) return '<div class="empty-cta">No coach commitment yet.</div>';
    const baseStyle = 'font-family:\'Cormorant Garamond\',serif;font-size:1.05rem;font-style:italic;color:var(--navy);';
    let body;
    if (isLocked) {
      // Click-to-edit. Hover hint via dotted underline; cursor:text signals editability.
      const hint = c.text ? escapeHtml(c.text) : '<span style="color:var(--muted);font-style:normal;">Click to add a commitment statement…</span>';
      body = '<div id="cc-editable" data-cc-edit="1" style="' + baseStyle + 'cursor:text;border-bottom:1px dashed transparent;padding:4px 2px;transition:border-color 0.15s ease;" onmouseover="this.style.borderBottomColor=\'var(--gold)\'" onmouseout="this.style.borderBottomColor=\'transparent\'">' + hint + '</div>';
    } else {
      body = '<div style="' + baseStyle + '">' + escapeHtml(c.text || '') + '</div>';
    }
    return renderItem(
      body,
      Array.isArray(c.derived_from) && c.derived_from.length ? 'Derived from: ' + c.derived_from.join(', ') : ''
    );
  }

  function revisionPromptText(round) {
    if (round === 0) {
      return 'Looking at this plan: Are there modalities or techniques from your Approach Lab to feature? Anything from Coach DNA about your patterns with this client that shifts how you\'d approach the next phase? Or does this already capture what you see?';
    }
    return 'One more look: does this capture what you see? Anything else before we lock it in?';
  }

  function render() {
    if (!plan) {
      $('content').innerHTML = '<div class="card" style="text-align:center;padding:40px 24px;">'
        + '<h2 style="margin-bottom:12px;">No plan yet for this client</h2>'
        + '<p style="color:var(--muted);margin-bottom:18px;">Coach Clarity will read all post-session analysis, the pattern map, active goals, approach lab runs, and your coach DNA to draft a longitudinal plan.</p>'
        + '<button class="btn btn-primary" id="generate-btn">Create intervention plan</button>'
        + '</div>';
      $('generate-btn').onclick = generatePlan;
      return;
    }

    const isDraft = plan.status === 'draft';
    const round = plan.generation_round || 0;
    const canRevise = isDraft && round < 2;

    let html = '';
    html += '<div id="status-banner" class="' + (isDraft ? 'status-draft' : 'status-locked') + '">'
      + (isDraft
          ? 'Draft · round ' + round + ' of up to 2 revisions'
          : 'Locked · your commitment statement, prior commitment statuses, and per-section coach notes are editable. For larger changes, click Regenerate from latest sessions to create a new version.')
      + '</div>';

    if (canRevise) {
      html += '<div class="revision-prompt">'
        + '<p>' + escapeHtml(revisionPromptText(round)) + '</p>'
        + '<textarea id="revision-feedback" placeholder="Type your refinement here…"></textarea>'
        + '<div class="revision-actions">'
        + '<button class="btn btn-secondary" id="revise-btn">Revise with feedback</button>'
        + '<button class="btn btn-primary" id="lock-btn">Lock as-is</button>'
        + '</div></div>';
    } else if (isDraft && round === 2) {
      html += '<div class="revision-prompt"><p>This plan is now yours. Lock this version, then edit any section freely or move to session planning.</p>'
        + '<div class="revision-actions"><button class="btn btn-primary" id="lock-btn">Lock plan</button></div></div>';
    }

    html += renderSection('External conditions', renderExternalConditions(), { id: 'sec-external_conditions', sectionKey: 'external_conditions' });
    html += renderSection('Working hypotheses', renderHypotheses(), { id: 'sec-working_hypotheses', sectionKey: 'working_hypotheses' });
    html += renderSection('Strategic frames', renderFrames(), { id: 'sec-strategic_frames', sectionKey: 'strategic_frames' });
    html += renderSection('Behavioral targets', renderBehavioralTargets(), { id: 'sec-behavioral_targets', sectionKey: 'behavioral_targets' });
    html += renderSection('Prior commitments', renderCommitments(), { id: 'sec-prior_commitments', sectionKey: 'prior_commitments' });
    html += renderSection('Modality sequence', renderModalitySequence(), { id: 'sec-modality_sequence', sectionKey: 'modality_sequence' });
    html += renderSection('Progress markers', renderProgressMarkers(), { id: 'sec-progress_markers', sectionKey: 'progress_markers' });
    html += renderSection('Risk watchouts', renderRiskWatchouts(), { id: 'sec-risk_watchouts', sectionKey: 'risk_watchouts' });
    html += renderSection('Session arc', renderSessionArc(), { id: 'sec-session_arc', sectionKey: 'session_arc' });
    html += renderSection('Coach commitment', renderCoachCommitment(), { id: 'sec-coach_commitment', sectionKey: 'coach_commitment' });

    if (!isDraft) {
      html += '<div style="margin-top:24px;text-align:center;">'
        + '<button class="btn btn-tertiary" id="regen-btn">Regenerate from latest sessions</button>'
        + '</div>';
    }

    $('content').innerHTML = html;

    if (canRevise || (isDraft && round === 2)) {
      const lockBtn = $('lock-btn');
      if (lockBtn) lockBtn.onclick = lockPlan;
    }
    if (canRevise) {
      $('revise-btn').onclick = function() {
        const fb = $('revision-feedback').value.trim();
        if (!fb) return alert('Add feedback before revising.');
        revisePlan(fb);
      };
    }
    if (!isDraft) {
      const regenBtn = $('regen-btn');
      if (regenBtn) regenBtn.onclick = regenerateFromScratch;
      wireLockedEditables();
    }
  }

  // Locked-mode wiring: prior_commitments status dropdowns, coach commitment
  // click-to-edit, per-section "+ Add coach note" affordances, and the
  // Session 1 "Plan this session" button. Re-runs on every render()
  // because the DOM is rebuilt wholesale on each save.
  function wireLockedEditables() {
    // 0. Session 1 "Plan this session" button → inline session plan render.
    // Plus the read-only auto-load that surfaces an existing plan from DB
    // (no AI cost on revisits — matches the chunk 6.5 hotfix).
    document.querySelectorAll('.plan-session-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { openSessionPlanForBooking(null); });
    });
    autoLoadExistingSessionPlan();

    // 1. Prior-commitments status dropdowns
    document.querySelectorAll('.commitment-status-select').forEach(function(sel) {
      sel.addEventListener('change', function() {
        const idx = parseInt(this.dataset.commitmentIdx, 10);
        if (Number.isNaN(idx)) return;
        const current = Array.isArray(plan.prior_commitments) ? plan.prior_commitments.slice() : [];
        if (!current[idx]) return;
        current[idx] = Object.assign({}, current[idx], { status: this.value });
        // Optimistic visual feedback
        const orig = this.style.borderColor;
        this.style.borderColor = 'var(--gold)';
        saveSection('prior_commitments', current).finally(function() {
          // render() re-renders, so this element will be replaced; defensive reset
          if (sel.style) sel.style.borderColor = orig;
        });
      });
    });

    // 2. Coach commitment click-to-edit
    const ccEl = document.querySelector('[data-cc-edit="1"]');
    if (ccEl) {
      ccEl.addEventListener('click', function() {
        const current = (plan.coach_commitment && plan.coach_commitment.text) || '';
        const ta = document.createElement('textarea');
        ta.value = current;
        ta.rows = 4;
        ta.style.cssText = 'width:100%;padding:8px 10px;font-family:\'Cormorant Garamond\',serif;font-size:1.05rem;font-style:italic;color:var(--navy);border:1px solid var(--gold);border-radius:6px;resize:vertical;background:#fff;';
        ccEl.replaceWith(ta);
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
        let saved = false;
        ta.addEventListener('blur', async function() {
          if (saved) return;
          saved = true;
          const next = ta.value.trim();
          if (next === current.trim()) {
            // No change — restore display by re-rendering the section
            render();
            return;
          }
          const saving = document.createElement('div');
          saving.textContent = 'Saving…';
          saving.style.cssText = 'font-family:\'DM Sans\',sans-serif;font-size:0.78rem;color:var(--gold);font-style:italic;';
          ta.replaceWith(saving);
          const newCommitment = Object.assign({}, (plan.coach_commitment || {}), { text: next });
          // Preserve derived_from if present, else empty array
          if (!Array.isArray(newCommitment.derived_from)) newCommitment.derived_from = [];
          await saveSection('coach_commitment', newCommitment);
        });
      });
    }

    // 3. + Add coach note per section
    document.querySelectorAll('[data-add-note]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const section = this.dataset.addNote;
        const slot = this.closest('.add-note-slot');
        if (!slot) return;
        const ta = document.createElement('textarea');
        ta.placeholder = 'Add a note for this section…';
        ta.rows = 3;
        ta.style.cssText = 'width:100%;padding:8px 10px;font-family:\'DM Sans\',sans-serif;font-size:0.88rem;border:1px solid var(--gold);border-radius:6px;resize:vertical;background:#fff;';
        slot.innerHTML = '';
        slot.appendChild(ta);
        ta.focus();
        let saved = false;
        ta.addEventListener('blur', async function() {
          if (saved) return;
          saved = true;
          const v = ta.value.trim();
          if (!v) {
            render();
            return;
          }
          const saving = document.createElement('div');
          saving.textContent = 'Saving note…';
          saving.style.cssText = 'font-family:\'DM Sans\',sans-serif;font-size:0.78rem;color:var(--gold);font-style:italic;';
          slot.innerHTML = '';
          slot.appendChild(saving);
          await saveSection('coach_notes', {
            section: section,
            note: v,
            created_at: new Date().toISOString(),
            edited_by: coachId,
          });
        });
      });
    });
  }

  // ── Session plan support ────────────────────────────────────────────
  // Picks the next upcoming booking for this client, generates a session
  // plan against the locked IP, and renders the result inline below the
  // Session 1 arc card. Same flow regardless of entry point (IP panel
  // button or bookings-tab → ?plan_for_booking=...).
  async function loadNextUpcomingBooking(preferredBookingId) {
    try {
      // If a specific booking_id was supplied (bookings-tab entry), prefer it.
      if (preferredBookingId) {
        const res = await fetch(SUPABASE_URL + '/rest/v1/coach_bookings?id=eq.' + encodeURIComponent(preferredBookingId) + '&select=id,scheduled_at,service_id,status&limit=1', { headers: apiHeaders() });
        const rows = await res.json();
        if (Array.isArray(rows) && rows.length) return rows[0];
      }
      // Otherwise auto-pick the soonest future booking for this client + coach.
      const nowIso = new Date().toISOString();
      const res = await fetch(SUPABASE_URL + '/rest/v1/coach_bookings?coach_id=eq.' + coachId + '&client_email=eq.' + encodeURIComponent(clientEmail) + '&scheduled_at=gte.' + encodeURIComponent(nowIso) + '&status=in.(confirmed,manual)&select=id,scheduled_at,service_id,status&order=scheduled_at.asc&limit=1', { headers: apiHeaders() });
      const rows = await res.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    } catch (_) { return null; }
  }

  function fmtSessionDate(iso) {
    if (!iso) return 'upcoming';
    try { return new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
    catch (_) { return 'upcoming'; }
  }

  function renderSessionPlan(sp, clientDisplayName, sessionDateIso) {
    if (!sp) return '<div class="error-box">No session plan returned.</div>';
    const tf = sp.time_flow || {};
    const cttArr = (sp.commitments_to_test || []).filter(Boolean);
    const psArr = (sp.pre_session_signals || []).filter(Boolean);
    const tpArr = (sp.turning_points || []).filter(Boolean);
    const brArr = (sp.branches || []).filter(Boolean);
    const bcArr = (sp.body_cues_to_watch || []).filter(Boolean);
    const kqArr = (sp.key_questions || []).filter(Boolean);
    return '<div class="session-plan-card" style="background:#fff;border:2px solid var(--gold);border-radius:10px;padding:20px 22px;margin-top:14px;box-shadow:0 2px 6px rgba(196,154,60,0.08);">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px;">'
      + '<div>'
      + '<div class="meta" style="margin-bottom:4px;">Session Plan</div>'
      + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.1rem;color:var(--navy);font-weight:600;">' + escapeHtml(clientDisplayName || '') + ' · ' + escapeHtml(fmtSessionDate(sessionDateIso)) + '</div>'
      + '</div>'
      + '<div style="display:flex;gap:8px;">'
      + '<button class="btn btn-secondary edit-session-plan" style="padding:6px 14px;font-size:0.78rem;">Edit</button>'
      + '<button class="btn btn-secondary revise-session-plan" style="padding:6px 14px;font-size:0.78rem;">Revise with new context</button>'
      + '<button class="btn btn-tertiary close-session-plan" style="padding:6px 14px;font-size:0.78rem;">Close</button>'
      + '</div>'
      + '</div>'

      + '<div class="meta" style="color:var(--gold);">Priority</div>'
      + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.25rem;font-weight:600;color:var(--navy);line-height:1.4;margin:4px 0 18px;">' + escapeHtml(sp.today_priority || '') + '</div>'

      + '<div class="meta" style="color:var(--gold);">Opening</div>'
      + '<div style="font-size:0.95rem;line-height:1.5;margin:4px 0 18px;">' + escapeHtml(sp.opening || '') + '</div>'

      + (kqArr.length ? '<div class="meta" style="color:var(--gold);">Key questions (in order of likely use)</div>'
          + '<ol style="margin:6px 0 18px;padding-left:22px;font-size:0.9rem;line-height:1.5;">'
          + kqArr.map(function(q) { return '<li style="margin-bottom:4px;">' + escapeHtml(q) + '</li>'; }).join('')
          + '</ol>' : '')

      + (sp.do_not_miss ? '<div class="meta" style="color:var(--gold);">Do not miss</div>'
          + '<div style="font-family:\'Cormorant Garamond\',serif;font-style:italic;font-size:1.05rem;color:var(--navy);background:#fdf9f1;border-left:3px solid var(--gold);padding:10px 14px;margin:4px 0 18px;">' + escapeHtml(sp.do_not_miss) + '</div>' : '')

      + (tpArr.length || brArr.length || bcArr.length ? '<div class="meta" style="color:var(--gold);">Work</div>' : '')
      + (tpArr.length ? '<div style="font-size:0.85rem;font-weight:600;color:var(--ink);margin-top:6px;">Turning points</div>'
          + '<ul style="margin:4px 0 10px;padding-left:22px;font-size:0.88rem;line-height:1.5;">'
          + tpArr.map(function(tp) { return '<li><strong>If</strong> ' + escapeHtml(tp.trigger || '') + ' → <strong>then</strong> ' + escapeHtml(tp.move || '') + '</li>'; }).join('')
          + '</ul>' : '')
      + (brArr.length ? '<div style="font-size:0.85rem;font-weight:600;color:var(--ink);margin-top:6px;">Branches</div>'
          + '<ul style="margin:4px 0 10px;padding-left:22px;font-size:0.88rem;line-height:1.5;">'
          + brArr.map(function(b) { return '<li><strong>If</strong> ' + escapeHtml(b.if || '') + ' → <strong>then</strong> ' + escapeHtml(b.then || '') + '</li>'; }).join('')
          + '</ul>' : '')
      + (bcArr.length ? '<div style="font-size:0.85rem;font-weight:600;color:var(--ink);margin-top:6px;">Body cues to watch</div>'
          + '<ul style="margin:4px 0 18px;padding-left:22px;font-size:0.88rem;line-height:1.5;">'
          + bcArr.map(function(c) { return '<li>' + escapeHtml(c) + '</li>'; }).join('')
          + '</ul>' : '<div style="margin-bottom:8px;"></div>')

      + (cttArr.length ? '<div class="meta" style="color:var(--gold);">Commitments to check in on</div>'
          + '<ul style="margin:4px 0 18px;padding-left:22px;font-size:0.88rem;line-height:1.5;list-style:none;">'
          + cttArr.map(function(c) {
              return '<li style="padding:8px 10px;background:#fdfcfa;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;">'
                + '<div style="font-style:italic;color:var(--navy);">"' + escapeHtml(c.commitment_text || '') + '"</div>'
                + '<div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">status: <span class="pill ' + (c.current_status || 'untested') + '" style="vertical-align:middle;">' + escapeHtml(c.current_status || 'untested') + '</span>'
                + (c.from_session_date ? ' · ' + escapeHtml(c.from_session_date) : '')
                + '</div>'
                + (c.how_to_check_in ? '<div style="font-size:0.85rem;margin-top:6px;color:var(--ink);"><strong>How to check in:</strong> ' + escapeHtml(c.how_to_check_in) + '</div>' : '')
                + '</li>';
            }).join('')
          + '</ul>' : '')

      + (psArr.length ? '<div class="meta" style="color:var(--gold);">Pre-session signals</div>'
          + '<ul style="margin:4px 0 18px;padding-left:22px;font-size:0.88rem;line-height:1.5;">'
          + psArr.map(function(s) { return '<li><strong>' + escapeHtml(s.type || '') + ':</strong> ' + escapeHtml(s.summary || '') + '</li>'; }).join('')
          + '</ul>' : '')

      + (sp.close_with ? '<div class="meta" style="color:var(--gold);">Close with</div>'
          + '<div style="font-size:0.95rem;line-height:1.5;margin:4px 0 18px;">' + escapeHtml(sp.close_with) + '</div>' : '')

      + '<div class="meta" style="color:var(--gold);">Time flow</div>'
      + '<div style="font-size:0.85rem;line-height:1.6;margin:4px 0 6px;">'
      + '<div><strong>Opening (' + (tf.opening?.minutes || 0) + ' min)</strong> · ' + escapeHtml(tf.opening?.summary || '') + '</div>'
      + '<div><strong>Work (' + (tf.work?.minutes || 0) + ' min)</strong> · ' + escapeHtml(tf.work?.summary || '') + '</div>'
      + '<div><strong>Close (' + (tf.close?.minutes || 0) + ' min)</strong> · ' + escapeHtml(tf.close?.summary || '') + '</div>'
      + '</div>'

      + '</div>';
  }

  let _cachedClientDisplayName = null;

  // Read-only lookup. Hits the partial unique index — at most one active row
  // per booking. Spreads coaching_data so the renderer has flat field access.
  async function loadExistingSessionPlan(bookingId) {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/session_plans?booking_id=eq.' + encodeURIComponent(bookingId) + '&archived_at=is.null&select=*&limit=1', { headers: apiHeaders() });
      if (!res.ok) return null;
      const rows = await res.json();
      if (!Array.isArray(rows) || !rows.length) return null;
      const row = rows[0];
      return Object.assign({}, row, row.coaching_data || {});
    } catch (_) { return null; }
  }

  // Auto-load on page render. If a plan already exists for the next upcoming
  // booking (or the booking specified by ?plan_for_booking=), surface it
  // directly instead of asking the coach to click Generate again. No AI cost
  // on revisits. Generation only fires on explicit button click.
  async function autoLoadExistingSessionPlan() {
    if (!plan || plan.status !== 'locked') return;
    const slot = document.getElementById('session-plan-slot-arc');
    if (!slot) return;
    const planForBooking = params.get('plan_for_booking');
    const booking = await loadNextUpcomingBooking(planForBooking);
    if (!booking) return; // No upcoming booking — leave the button visible; coach action is "Schedule a session"
    const existing = await loadExistingSessionPlan(booking.id);
    if (!existing) return; // No plan yet — leave the "Plan this session →" button visible
    // Hide the generate button; the rendered plan replaces it.
    const planBtn = document.querySelector('.plan-session-btn');
    if (planBtn) planBtn.style.display = 'none';
    slot.innerHTML = renderSessionPlan(existing, _cachedClientDisplayName, booking.scheduled_at);
    wireSessionPlanCard(slot, booking, existing);
    if (planForBooking) slot.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Explicit-click entry: fires generate (or revision when revisionContext set).
  // The hotfix means this is the ONLY path that costs AI tokens.
  async function generateSessionPlan(preferredBookingId, revisionContext) {
    if (!plan || plan.status !== 'locked') return;
    const slot = document.getElementById('session-plan-slot-arc');
    if (!slot) return;
    const loadingMsg = revisionContext ? 'Revising session plan with new context…' : 'Generating session plan…';
    slot.innerHTML = '<div class="loader"><div class="spinner"></div><div>' + escapeHtml(loadingMsg) + ' this may take 30–50 seconds.</div></div>';
    try {
      const booking = await loadNextUpcomingBooking(preferredBookingId);
      if (!booking) {
        slot.innerHTML = '<div class="error-box">No upcoming booking found. Schedule a session first, then return here.</div>';
        return;
      }
      const reqBody = { intervention_plan_id: plan.id, booking_id: booking.id, coach_id: coachId, client_email: clientEmail };
      if (revisionContext) reqBody.revision_context = revisionContext;
      const res = await fetch('/api/generate-session-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reqBody),
      });
      const sp = await parseApiResponse(res, 'Session plan generation failed');
      const planBtn = document.querySelector('.plan-session-btn');
      if (planBtn) planBtn.style.display = 'none';
      slot.innerHTML = renderSessionPlan(sp, _cachedClientDisplayName, booking.scheduled_at);
      slot.scrollIntoView({ behavior: 'smooth', block: 'start' });
      wireSessionPlanCard(slot, booking, sp);
    } catch (e) {
      slot.innerHTML = '<div class="error-box">' + escapeHtml(e.message) + '</div>';
    }
  }

  // Backwards-compat alias retained because wireLockedEditables binds it
  // to the .plan-session-btn click handler. Always an explicit fresh-generate.
  function openSessionPlanForBooking(preferredBookingId) {
    return generateSessionPlan(preferredBookingId, null);
  }

  function wireSessionPlanCard(slot, booking, sp) {
    const editBtn = slot.querySelector('.edit-session-plan');
    if (editBtn) editBtn.onclick = function() { enterSessionPlanEditMode(slot, sp, booking); };
    const reviseBtn = slot.querySelector('.revise-session-plan');
    if (reviseBtn) reviseBtn.onclick = function() { showReviseModal(booking); };
    const closeBtn = slot.querySelector('.close-session-plan');
    if (closeBtn) closeBtn.onclick = function() {
      slot.innerHTML = '';
      const planBtn = document.querySelector('.plan-session-btn');
      if (planBtn) planBtn.style.display = '';
    };
  }

  // ── Edit mode ──────────────────────────────────────────────────────
  // Six fields editable inline: today_priority, opening, do_not_miss,
  // close_with (single-line / textarea), key_questions and body_cues_to_watch
  // (string-array list editor with add/remove). turning_points / branches /
  // time_flow stay read-only for v1 — Revise is the path for restructuring.
  function enterSessionPlanEditMode(slot, sp, booking) {
    function rowText(field, label, value, multiline) {
      if (multiline) {
        return '<div><div class="meta" style="color:var(--gold);margin-bottom:4px;">' + escapeHtml(label) + '</div>'
          + '<textarea data-edit-field="' + field + '" rows="3" style="width:100%;padding:8px 10px;font-family:\'DM Sans\',sans-serif;font-size:0.9rem;border:1px solid var(--gold);border-radius:6px;resize:vertical;background:#fff;">' + escapeHtml(value || '') + '</textarea></div>';
      }
      return '<div><div class="meta" style="color:var(--gold);margin-bottom:4px;">' + escapeHtml(label) + '</div>'
        + '<input type="text" data-edit-field="' + field + '" value="' + escapeHtml(value || '') + '" style="width:100%;padding:8px 10px;font-family:\'DM Sans\',sans-serif;font-size:0.9rem;border:1px solid var(--gold);border-radius:6px;background:#fff;" /></div>';
    }
    function rowList(field, label, values) {
      const items = (values || []).map(function(v, i) {
        return '<div class="edit-list-row" data-list-field="' + field + '" data-list-idx="' + i + '" style="display:flex;gap:6px;margin-bottom:6px;">'
          + '<input type="text" value="' + escapeHtml(v || '') + '" style="flex:1;padding:6px 10px;font-family:\'DM Sans\',sans-serif;font-size:0.88rem;border:1px solid var(--border);border-radius:4px;background:#fff;" />'
          + '<button class="edit-list-remove" type="button" style="padding:4px 10px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:0.8rem;">×</button>'
          + '</div>';
      }).join('');
      return '<div data-edit-list="' + field + '"><div class="meta" style="color:var(--gold);margin-bottom:4px;">' + escapeHtml(label) + '</div>'
        + '<div class="edit-list-items">' + items + '</div>'
        + '<button class="edit-list-add" type="button" data-list-add="' + field + '" style="margin-top:4px;padding:5px 12px;background:transparent;color:var(--muted);border:1px dashed var(--border);border-radius:4px;cursor:pointer;font-size:0.78rem;">+ Add item</button>'
        + '</div>';
    }
    const html = '<div class="session-plan-card" style="background:#fff;border:2px solid var(--gold);border-radius:10px;padding:20px 22px;margin-top:14px;box-shadow:0 2px 6px rgba(196,154,60,0.08);">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px;">'
      + '<div><div class="meta">Editing session plan</div><div style="font-family:\'Cormorant Garamond\',serif;font-size:1.1rem;color:var(--navy);font-weight:600;">' + escapeHtml(_cachedClientDisplayName || '') + ' · ' + escapeHtml(fmtSessionDate(booking.scheduled_at)) + '</div></div>'
      + '<div style="display:flex;gap:8px;">'
      + '<button class="btn btn-primary" id="sp-save-btn" style="padding:6px 14px;font-size:0.78rem;">Save</button>'
      + '<button class="btn btn-tertiary" id="sp-cancel-btn" style="padding:6px 14px;font-size:0.78rem;">Cancel</button>'
      + '</div></div>'
      + '<div style="display:flex;flex-direction:column;gap:14px;">'
      + rowText('today_priority', 'Priority (one sentence)', sp.today_priority, true)
      + rowText('opening', 'Opening', sp.opening, true)
      + rowList('key_questions', 'Key questions', sp.key_questions)
      + rowText('do_not_miss', 'Do not miss', sp.do_not_miss, true)
      + rowList('body_cues_to_watch', 'Body cues to watch', sp.body_cues_to_watch)
      + rowText('close_with', 'Close with', sp.close_with, true)
      + '<div style="font-size:0.74rem;color:var(--muted);font-style:italic;">Turning points, branches, and time flow stay read-only for direct edit. Use Revise with new context to restructure those.</div>'
      + '</div></div>';
    slot.innerHTML = html;

    // Wire add/remove on lists
    slot.querySelectorAll('.edit-list-add').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const field = btn.dataset.listAdd;
        const list = slot.querySelector('[data-edit-list="' + field + '"] .edit-list-items');
        const idx = list.querySelectorAll('.edit-list-row').length;
        const row = document.createElement('div');
        row.className = 'edit-list-row';
        row.dataset.listField = field;
        row.dataset.listIdx = String(idx);
        row.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;';
        row.innerHTML = '<input type="text" value="" style="flex:1;padding:6px 10px;font-family:\'DM Sans\',sans-serif;font-size:0.88rem;border:1px solid var(--border);border-radius:4px;background:#fff;" />'
          + '<button class="edit-list-remove" type="button" style="padding:4px 10px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:0.8rem;">×</button>';
        list.appendChild(row);
        row.querySelector('input').focus();
        row.querySelector('.edit-list-remove').addEventListener('click', function() { row.remove(); });
      });
    });
    slot.querySelectorAll('.edit-list-remove').forEach(function(btn) {
      btn.addEventListener('click', function() { btn.closest('.edit-list-row').remove(); });
    });

    slot.querySelector('#sp-cancel-btn').onclick = function() {
      slot.innerHTML = renderSessionPlan(sp, _cachedClientDisplayName, booking.scheduled_at);
      wireSessionPlanCard(slot, booking, sp);
    };

    slot.querySelector('#sp-save-btn').onclick = async function() {
      const updates = {};
      slot.querySelectorAll('[data-edit-field]').forEach(function(el) {
        updates[el.dataset.editField] = el.value;
      });
      ['key_questions','body_cues_to_watch'].forEach(function(field) {
        const rows = slot.querySelectorAll('[data-edit-list="' + field + '"] .edit-list-row input');
        const arr = Array.prototype.slice.call(rows).map(function(i) { return i.value.trim(); }).filter(Boolean);
        updates[field] = arr;
      });
      const saveBtn = slot.querySelector('#sp-save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/update-session-plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan_id: sp.id, updates: updates, edited_by: coachId }),
        });
        const newSp = await parseApiResponse(res, 'Save failed');
        slot.innerHTML = renderSessionPlan(newSp, _cachedClientDisplayName, booking.scheduled_at);
        wireSessionPlanCard(slot, booking, newSp);
      } catch (e) {
        alert(e.message);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
      }
    };
  }

  // ── Revise modal ───────────────────────────────────────────────────
  function showReviseModal(booking) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.42);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
    overlay.innerHTML = '<div style="background:#fff;border-radius:10px;padding:24px;max-width:560px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.2);">'
      + '<h2 style="font-family:\'Cormorant Garamond\',serif;color:var(--navy);font-size:1.4rem;margin:0 0 6px;font-weight:600;">Revise with new context</h2>'
      + '<p style="font-size:0.88rem;color:var(--muted);margin:0 0 14px;line-height:1.5;">What has changed since this plan was generated? Coach Clarity uses this context to revise — preserving what you have not flagged, updating what you have.</p>'
      + '<textarea id="revise-context-input" rows="5" placeholder="e.g. Client mentioned a job change in their check-in, and journal entries show a new pattern of avoidance with their partner…" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-family:\'DM Sans\',sans-serif;font-size:0.92rem;resize:vertical;box-sizing:border-box;"></textarea>'
      + '<div style="font-size:0.74rem;color:var(--muted);margin-top:6px;" id="revise-context-counter">0 / 20 minimum (context required for revision)</div>'
      + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">'
      + '<button class="btn btn-tertiary" id="revise-cancel-btn" style="padding:8px 16px;font-size:0.85rem;">Cancel</button>'
      + '<button class="btn btn-primary" id="revise-submit-btn" style="padding:8px 16px;font-size:0.85rem;" disabled>Revise plan</button>'
      + '</div></div>';
    document.body.appendChild(overlay);

    const ta = overlay.querySelector('#revise-context-input');
    const counter = overlay.querySelector('#revise-context-counter');
    const submitBtn = overlay.querySelector('#revise-submit-btn');
    ta.addEventListener('input', function() {
      const len = ta.value.trim().length;
      counter.textContent = len + ' / 20 minimum (context required for revision)';
      submitBtn.disabled = len < 20;
    });
    overlay.querySelector('#revise-cancel-btn').onclick = function() {
      document.body.removeChild(overlay);
    };
    submitBtn.onclick = async function() {
      const ctx = ta.value.trim();
      if (ctx.length < 20) return;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Revising…';
      document.body.removeChild(overlay);
      generateSessionPlan(booking.id, ctx);
    };
    ta.focus();
  }

  // Pull most recent client_name from coach_checkin_responses — same source
  // the bookings tab and review cards already use. Falls back to email if
  // the client has no check-ins yet so the panel never renders blank.
  async function loadClientName() {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/coach_checkin_responses?client_email=eq.' + encodeURIComponent(clientEmail) + '&select=client_name&order=created_at.desc&limit=1', { headers: apiHeaders() });
      if (!res.ok) return null;
      const rows = await res.json();
      const name = Array.isArray(rows) && rows.length ? (rows[0].client_name || '').trim() : '';
      return name || null;
    } catch (_) { return null; }
  }

  (async function init() {
    if (!clientEmail) { showError('Missing client_email in URL.'); return; }
    const profile = await loadCoachProfile();
    if (!profile) return;
    coachId = profile.id;
    // Run name + sessions + active-plan loads in parallel — none depend on each other.
    const [clientName, sessions, loadedPlan] = await Promise.all([
      loadClientName(),
      loadClientSessions(),
      loadActivePlan(),
    ]);
    sessionInfo = sessions || {};
    plan = loadedPlan;
    const displayName = clientName || clientEmail || 'Client';
    _cachedClientDisplayName = displayName;
    $('client-heading').textContent = displayName;
    $('header-meta').textContent = clientEmail + ' · coach: ' + (profile.display_name || '');
    document.title = 'Intervention Plan · ' + displayName;
    render();
    // Note: ?plan_for_booking=<uuid> from the bookings tab is handled inside
    // autoLoadExistingSessionPlan (called from wireLockedEditables). The
    // chunk 6.5 hotfix removed auto-generate; the panel now reads existing
    // plans from DB and only fires generate on explicit button click.
  })();
  </script>
</body>
</html>
