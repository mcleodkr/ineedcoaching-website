<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Coaching Commons | ineedcoaching.org</title>
<meta name="description" content="Post what you need. Let coaches find you. The shared request board for coaching.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1a3a52; --gold: #c49a3c; --cream: #f7f4ee; --white: #ffffff; --muted: #8a8a9a;
  --border: #e0ddd5; --r: 14px; --r-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Cabinet Grotesk', sans-serif; background: var(--cream); color: var(--navy); }

.page-wrap { max-width: 720px; margin: 0 auto; padding: 100px 24px 80px; }

.page-header { text-align: center; margin-bottom: 40px; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.6rem); color: var(--navy); margin-bottom: 10px; }
.page-header h1 em { color: var(--gold); font-style: italic; }
.page-header p { font-size: 0.92rem; color: var(--muted); max-width: 500px; margin: 0 auto; line-height: 1.7; }

/* TABS */
.tabs { display: flex; justify-content: center; gap: 0; margin-bottom: 36px; border-bottom: 2px solid var(--border); }
.tab-btn { padding: 14px 32px; font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.88rem; font-weight: 700; color: var(--muted); background: none; border: none; border-bottom: 2.5px solid transparent; cursor: pointer; transition: all 0.2s; margin-bottom: -2px; }
.tab-btn:hover { color: var(--navy); }
.tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* FORM */
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-sm); font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.92rem; color: var(--navy); background: var(--white); transition: border-color 0.2s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--gold); }
.form-group textarea { min-height: 120px; resize: vertical; line-height: 1.6; }

.checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
.checkbox-group label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500; color: var(--navy); text-transform: none; letter-spacing: 0; cursor: pointer; padding: 8px 14px; border: 1px solid var(--border); border-radius: 50px; transition: all 0.2s; }
.checkbox-group label:hover { border-color: var(--gold); }
.checkbox-group input[type="checkbox"] { accent-color: var(--gold); }
.checkbox-group input[type="checkbox"]:checked + span { color: var(--gold); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.submit-btn { width: 100%; padding: 16px 24px; background: var(--gold); color: var(--white); border: none; border-radius: 50px; font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
.submit-btn:hover { background: #d4a94c; }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.form-msg { text-align: center; font-size: 0.85rem; color: var(--gold); margin-top: 16px; min-height: 24px; }

footer { background: var(--navy); padding: 40px 52px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }
.f-logo { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--cream); margin-bottom: 8px; }
.f-note { font-size: 0.72rem; color: var(--muted); }

@media (max-width: 768px) {
  .page-wrap { padding: 90px 16px 60px; }
  .form-row { grid-template-columns: 1fr; }
  .tab-btn { padding: 12px 20px; font-size: 0.82rem; }
}
</style>
</head>
<body>

<nav style="position:fixed;top:0;left:0;right:0;z-index:300;display:flex;align-items:center;justify-content:space-between;padding:14px 52px;background:rgba(26,58,82,0.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.1);">
  <a href="/" style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:#f7f4ee;text-decoration:none;"><span style="color:#c49a3c;font-style:italic;">i</span>need<span style="color:#c49a3c;font-style:italic;">coaching</span>.org</a>
  <div style="display:flex;align-items:center;gap:22px;">
    <a href="/coaches.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Coaches</a>
    <a href="/sessions.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Sessions</a>
    <a href="/coach-courses.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Courses</a>
    <a href="/#articles" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Articles</a>
    <a href="/coaching-commons.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Commons</a>
    <a href="/coach-dashboard.html" style="font-size:0.78rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#8a8a9a;text-decoration:none;">Dashboard</a>
    <a href="/coach-signup.html" style="font-size:0.78rem;font-weight:700;background:#c49a3c;color:#1a3a52;padding:8px 18px;border-radius:50px;text-decoration:none;">List Your Practice</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>The Coaching <em>Commons</em></h1>
    <p>Tell us what you need. Coaches will find you. No middleman, no algorithms.</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('individual')">Individual</button>
    <button class="tab-btn" onclick="switchTab('business')">Business / Organization</button>
  </div>

  <!-- INDIVIDUAL FORM -->
  <div class="tab-panel active" id="panel-individual">
    <form id="individual-form" onsubmit="submitIndividual(event)">
      <div class="form-group">
        <label>What are you looking for?</label>
        <textarea name="description" placeholder="Describe what you need from a coach. Be as specific or open as you'd like." required></textarea>
      </div>
      <div class="form-group">
        <label>Budget Range</label>
        <select name="budget_range">
          <option value="">Select a range</option>
          <option value="Under $100/session">Under $100/session</option>
          <option value="$100-$200/session">$100-$200/session</option>
          <option value="$200-$350/session">$200-$350/session</option>
          <option value="$350+/session">$350+/session</option>
          <option value="Flexible">Flexible</option>
        </select>
      </div>
      <div class="form-group">
        <label>Availability</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="availability" value="Mornings"><span>Mornings</span></label>
          <label><input type="checkbox" name="availability" value="Afternoons"><span>Afternoons</span></label>
          <label><input type="checkbox" name="availability" value="Evenings"><span>Evenings</span></label>
          <label><input type="checkbox" name="availability" value="Weekends"><span>Weekends</span></label>
        </div>
      </div>
      <div class="form-group">
        <label>Coaching Specialty Preference</label>
        <select name="specialty_preference">
          <option value="">Any specialty</option>
          <option value="Life Coaching">Life Coaching</option>
          <option value="Executive Coaching">Executive Coaching</option>
          <option value="Career Coaching">Career Coaching</option>
          <option value="Leadership Coaching">Leadership Coaching</option>
          <option value="Health & Wellness">Health & Wellness</option>
          <option value="Relationship Coaching">Relationship Coaching</option>
          <option value="Business Coaching">Business Coaching</option>
          <option value="Performance Coaching">Performance Coaching</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" name="name" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label>Your Email</label>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="individual-submit">Post My Request</button>
      <div class="form-msg" id="individual-msg"></div>
    </form>
  </div>

  <!-- BUSINESS FORM -->
  <div class="tab-panel" id="panel-business">
    <form id="business-form" onsubmit="submitBusiness(event)">
      <div class="form-group">
        <label>Organization Name</label>
        <input type="text" name="org_name" placeholder="Your company or organization" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Contact Name</label>
          <input type="text" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Contact Email</label>
          <input type="email" name="email" placeholder="you@company.com" required>
        </div>
      </div>
      <div class="form-group">
        <label>Type of Engagement</label>
        <select name="business_type" required>
          <option value="">Select type</option>
          <option value="Executive coaching">Executive coaching</option>
          <option value="Team coaching">Team coaching</option>
          <option value="Workshop / Training">Workshop / Training</option>
          <option value="Leadership retreat">Leadership retreat</option>
          <option value="Keynote / Speaking">Keynote / Speaking</option>
          <option value="Custom / Other">Custom / Other</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Number of Participants</label>
          <select name="participants">
            <option value="">Select</option>
            <option value="1">1 (individual executive)</option>
            <option value="2-5">2-5</option>
            <option value="6-20">6-20</option>
            <option value="21-50">21-50</option>
            <option value="50+">50+</option>
          </select>
        </div>
        <div class="form-group">
          <label>Budget Range</label>
          <select name="budget_range">
            <option value="">Select</option>
            <option value="Under $5,000">Under $5,000</option>
            <option value="$5,000-$15,000">$5,000-$15,000</option>
            <option value="$15,000-$50,000">$15,000-$50,000</option>
            <option value="$50,000+">$50,000+</option>
            <option value="Flexible / TBD">Flexible / TBD</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Timeline</label>
          <select name="timeline">
            <option value="">Select</option>
            <option value="Immediately">Immediately</option>
            <option value="Within 1 month">Within 1 month</option>
            <option value="1-3 months">1-3 months</option>
            <option value="3-6 months">3-6 months</option>
            <option value="Just exploring">Just exploring</option>
          </select>
        </div>
        <div class="form-group">
          <label>Format Preference</label>
          <select name="format">
            <option value="">Select</option>
            <option value="Virtual">Virtual</option>
            <option value="In-person">In-person</option>
            <option value="Hybrid">Hybrid</option>
            <option value="No preference">No preference</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Location (if in-person)</label>
        <input type="text" name="location" placeholder="City, state or region">
      </div>
      <div class="form-group">
        <label>Details</label>
        <textarea name="description" placeholder="Describe what your organization needs, goals, context, or anything else that would help coaches respond thoughtfully." required></textarea>
      </div>
      <div class="form-group">
        <label>Upload RFP (optional, PDF)</label>
        <input type="file" name="rfp" accept=".pdf,.doc,.docx" id="rfp-file" style="padding:10px;">
      </div>
      <button type="submit" class="submit-btn" id="business-submit">Post Business Request</button>
      <div class="form-msg" id="business-msg"></div>
    </form>
  </div>
</div>

<footer>
  <div class="f-logo"><span style="color:#c49a3c;font-style:italic;">i</span>need<span style="color:#c49a3c;font-style:italic;">coaching</span>.org</div>
  <p class="f-note">A project from ineedtherapy.org</p>
</footer>

<script>
var SUPABASE_URL = 'https://qroizygknxdjsstkezsf.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4';

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  if (tab === 'individual') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('panel-individual').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('panel-business').classList.add('active');
  }
}

async function submitIndividual(e) {
  e.preventDefault();
  var form = e.target;
  var btn = document.getElementById('individual-submit');
  var msg = document.getElementById('individual-msg');
  btn.disabled = true;
  btn.textContent = 'Posting...';
  msg.textContent = '';

  var avail = [];
  form.querySelectorAll('input[name="availability"]:checked').forEach(function(cb) { avail.push(cb.value); });

  var payload = {
    poster_type: 'individual',
    email: form.email.value.trim(),
    name: form.name.value.trim(),
    description: form.description.value.trim(),
    budget_range: form.budget_range.value,
    availability: avail.join(', '),
    specialty_preference: form.specialty_preference.value
  };

  try {
    var res = await fetch(SUPABASE_URL + '/rest/v1/coaching_commons_posts', {
      method: 'POST',
      headers: {
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      msg.textContent = 'Your request has been posted! Coaches will reach out to you.';
      msg.style.color = '#4a7c59';
      form.reset();
    } else {
      throw new Error('Failed');
    }
  } catch(err) {
    msg.textContent = 'Something went wrong. Please try again.';
    msg.style.color = '#c44';
  }
  btn.disabled = false;
  btn.textContent = 'Post My Request';
}

async function submitBusiness(e) {
  e.preventDefault();
  var form = e.target;
  var btn = document.getElementById('business-submit');
  var msg = document.getElementById('business-msg');
  btn.disabled = true;
  btn.textContent = 'Posting...';
  msg.textContent = '';

  var rfpUrl = '';
  var rfpFile = document.getElementById('rfp-file').files[0];
  if (rfpFile) {
    try {
      var fileName = Date.now() + '_' + rfpFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      var uploadRes = await fetch(SUPABASE_URL + '/storage/v1/object/coaching-rfps/' + fileName, {
        method: 'POST',
        headers: {
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY,
          'Content-Type': rfpFile.type
        },
        body: rfpFile
      });
      if (uploadRes.ok) {
        rfpUrl = SUPABASE_URL + '/storage/v1/object/public/coaching-rfps/' + fileName;
      }
    } catch(err) {
      // Upload failed, continue without RFP
    }
  }

  var payload = {
    poster_type: 'business',
    email: form.email.value.trim(),
    name: form.name.value.trim(),
    org_name: form.org_name.value.trim(),
    description: form.description.value.trim(),
    budget_range: form.budget_range.value,
    business_type: form.business_type.value,
    participants: form.participants.value,
    timeline: form.timeline.value,
    format: form.format.value,
    location: form.location.value.trim(),
    rfp_url: rfpUrl || null
  };

  try {
    var res = await fetch(SUPABASE_URL + '/rest/v1/coaching_commons_posts', {
      method: 'POST',
      headers: {
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      msg.textContent = 'Your business request has been posted! Coaches will respond soon.';
      msg.style.color = '#4a7c59';
      form.reset();
    } else {
      throw new Error('Failed');
    }
  } catch(err) {
    msg.textContent = 'Something went wrong. Please try again.';
    msg.style.color = '#c44';
  }
  btn.disabled = false;
  btn.textContent = 'Post Business Request';
}
</script>
</body>
</html>
