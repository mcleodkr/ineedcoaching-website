name: Weekly Coach Article Generation

on:
  schedule:
    - cron: '0 8 * * 3'  # Every Wednesday at 8AM UTC
  workflow_dispatch: {}    # Allow manual trigger

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate coach articles
        env:
          ARTICLES_URL: ${{ secrets.VERCEL_DEPLOYMENT_URL || 'https://www.ineedcoaching.org' }}
        run: |
          echo "Generating weekly coach articles..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${ARTICLES_URL}/api/coach-articles" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 300)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Coach articles API returned $http_code"
            exit 1
          fi

          echo "Article generation complete"
