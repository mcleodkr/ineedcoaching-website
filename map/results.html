<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Your Effectiveness Map · ineedcoaching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a3a52;
      --gold: #c49a3c;
      --gold-tint: rgba(196, 154, 60, 0.10);
      --cream: #f7f5f1;
      --card: #ffffff;
      --border: #e8e4dc;
      --text: #1a3a52;
      --muted: #6b6256;

      --text-body: 1.0625rem;
      --text-h1: clamp(1.9rem, 1.3rem + 2.4vw, 2.6rem);
      --text-lead: clamp(1.15rem, 0.95rem + 1vw, 1.4rem);
      --text-question: clamp(1.5rem, 1rem + 2.4vw, 2.2rem);

      --space-page: clamp(1.25rem, 0.5rem + 3vw, 3rem);
      --radius: 12px;
      --shadow: 0 1px 2px rgba(26, 58, 82, 0.05), 0 8px 28px rgba(26, 58, 82, 0.06);
      --duration: 180ms;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--cream);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: var(--text-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .site-header {
      padding: var(--space-page);
      max-width: 720px;
      margin: 0 auto;
    }
    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: 0.01em;
      color: var(--navy);
    }
    .wordmark span { color: var(--gold); }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 var(--space-page) clamp(3rem, 6vw, 6rem);
    }

    .surface {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(1.75rem, 1rem + 4vw, 3.5rem);
    }

    /* Opening line + goal */
    .opening {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: var(--text-lead);
      line-height: 1.3;
      color: var(--navy);
      margin: 0 0 1.1rem;
    }
    .goal {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: var(--text-h1);
      line-height: 1.15;
      color: var(--navy);
      margin: 0;
      padding: 0 0 0 1.1rem;
      border-left: 3px solid var(--gold);
    }

    /* Domain Snapshot — five paragraphs, no headers, continuous with spacing */
    .snapshot { margin: clamp(2.5rem, 5vw, 3.5rem) 0 0; }
    .snapshot-para { margin: 0 0 1.5rem; }
    .snapshot-para:last-child { margin-bottom: 0; }

    /* System Picture — extra whitespace above, no label */
    .system-picture {
      margin: clamp(3rem, 6vw, 4.5rem) 0 0;
      font-size: 1.12rem;
      line-height: 1.7;
      color: var(--text);
    }
    .system-picture p { margin: 0 0 1.25rem; }
    .system-picture p:last-child { margin-bottom: 0; }

    /* How this shows up for you (v1.6) — labeled like Cross-Domain Tax */
    .shows-up { margin: clamp(2.75rem, 5vw, 4rem) 0 0; }
    .shows-up p { margin: 0 0 1.25rem; }
    .shows-up p:last-child { margin-bottom: 0; }
    .shows-up .section-label { margin-bottom: 0.75rem; }

    /* Opener (v1.7) — "Why this is different", shown before everything else */
    .opener {
      margin: 0 0 clamp(2.5rem, 5vw, 3.5rem);
      padding-bottom: clamp(1.75rem, 3vw, 2.5rem);
      border-bottom: 1px solid var(--border, #e8e4dc);
    }
    .opener h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.6rem;
      color: var(--navy, #1a3a52);
      margin: 0 0 1rem;
    }
    .opener p { margin: 0 0 0.85rem; font-size: 1.02rem; line-height: 1.65; }
    .opener p:last-child { margin-bottom: 0; }

    /* Closing summary (v1.7) — for/against across the five areas */
    .closing { margin: clamp(2.75rem, 5vw, 4rem) 0 0; }
    .closing-row { display: flex; gap: 0.75rem; align-items: baseline; margin: 0 0 0.85rem; }
    .closing-domain {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600; font-size: 1.05rem; color: var(--navy, #1a3a52);
      flex: 0 0 7.5rem;
    }
    .closing-dir {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--gold, #c49a3c);
      flex: 0 0 auto; white-space: nowrap;
    }
    .closing-plain { font-size: 0.95rem; line-height: 1.5; }

    /* Status legend (v1.7) — plain meaning for each status chip */
    .legend { margin: 1.5rem 0 0; }
    .legend p { margin: 0 0 0.5rem; font-size: 0.85rem; line-height: 1.5; color: var(--muted, #6b6b6b); }
    .legend p:last-child { margin-bottom: 0; }
    .legend strong { color: var(--navy, #1a3a52); font-weight: 600; }

    /* Section label (Cross-Domain Tax) */
    .section-label {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.25rem;
      color: var(--gold);
      margin: 0 0 0.75rem;
    }
    .cross-tax { margin: clamp(2.75rem, 5vw, 4rem) 0 0; }
    .cross-tax p { margin: 0; }

    /* Release Question — the hero. Large, centered, set apart. */
    .release {
      margin: clamp(3rem, 6vw, 4.5rem) 0 0;
      padding: clamp(2rem, 4vw, 3rem) clamp(1rem, 3vw, 2rem);
      text-align: center;
      background: var(--gold-tint);
      border-radius: var(--radius);
    }
    .release-eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 1.25rem;
    }
    .release-question {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: var(--text-question);
      line-height: 1.25;
      color: var(--navy);
      margin: 0 auto;
      max-width: 22ch;
    }

    /* Domain Status Row */
    .status-row {
      margin: clamp(2.75rem, 5vw, 4rem) 0 0;
      padding-top: clamp(2rem, 4vw, 2.5rem);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem 0.5rem;
      text-align: center;
    }
    .status-cell { display: flex; flex-direction: column; gap: 0.4rem; }
    .status-domain {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1rem;
      color: var(--navy);
      line-height: 1.2;
    }
    .status-value {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .status-value.is-empty { color: var(--muted); }
    @media (max-width: 540px) {
      .status-row { grid-template-columns: repeat(2, 1fr); gap: 1.5rem 1rem; }
    }

    /* Account creation prompt */
    .keep {
      margin: clamp(2.5rem, 5vw, 3.5rem) 0 0;
      padding-top: clamp(2rem, 4vw, 2.5rem);
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .keep h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--navy);
      margin: 0 0 0.5rem;
    }
    .keep p { color: var(--muted); margin: 0 0 1.5rem; max-width: 46ch; margin-inline: auto; }
    .btn {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.7rem 1.6rem;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background-color var(--duration) var(--ease), transform var(--duration) var(--ease);
    }
    .btn-primary { background: var(--gold); color: #fff; }
    .btn-primary:hover { background: #b2862f; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--gold-tint); }

    /* Loading + error + crisis states (shared with intake) */
    .state { text-align: center; padding: clamp(2.5rem, 6vw, 5rem) 1.5rem; color: var(--muted); }
    .state h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      color: var(--navy);
      font-size: 1.6rem;
      margin: 0 0 0.5rem;
    }
    .spinner {
      width: 28px; height: 28px;
      margin: 0 auto 1rem;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .screen { animation: rise var(--duration) var(--ease); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, .screen { animation: none !important; transition: none !important; }
      .btn-primary:hover, .btn-secondary:hover { transform: none; }
    }

    /* Force-portrait visual (TC3) — always at the top of the results surface. */
    .map-portrait { margin: 0 0 clamp(2.5rem, 5vw, 3.5rem); }

    /* Cross-domain tension lines (TC3) — "How these areas are working together". */
    .cross-domain { margin: clamp(2.75rem, 5vw, 4rem) 0 0; }
    .cd-card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
      margin: 0 0 0.85rem;
    }
    .cd-card:last-child { margin-bottom: 0; }
    .cd-rel {
      margin: 0 0 0.4rem;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600; font-size: 1.02rem; color: var(--navy);
    }
    .cd-arrow { color: var(--gold); padding: 0 0.2rem; }
    .cd-reading { margin: 0; font-size: 0.98rem; line-height: 1.6; color: var(--text); }

    /* A first move (TC3) — explorer-facing action step. */
    .first-move { margin: clamp(2.75rem, 5vw, 4rem) 0 0; }
    .first-move p { margin: 0 0 1rem; font-size: 1.05rem; line-height: 1.65; }
    .first-move p:last-child { margin-bottom: 0; }

    /* Share with your provider (TC3) — calm outlined button, no urgency. */
    .share-provider {
      margin: clamp(2.5rem, 5vw, 3.5rem) 0 0;
      padding-top: clamp(2rem, 4vw, 2.5rem);
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .btn-secondary { background: transparent; color: var(--navy); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--gold); transform: translateY(-1px); }
    .btn-secondary:active { transform: translateY(0); }
    .share-desc { margin: 0.85rem auto 0; max-width: 42ch; font-size: 0.9rem; color: var(--muted); }
    .share-msg { margin: 0.85rem auto 0; max-width: 42ch; font-size: 0.9rem; color: #9a3b2f; }
    .share-msg[hidden] { display: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wordmark">ineed<span>coaching</span></div>
  </header>
  <main id="app" aria-live="polite">
    <!-- result renders here -->
  </main>

  <script>
    const INACTIVE_MSG = 'This link is no longer active. Ask your coach to send a new one.';
    const TOKEN = new URLSearchParams(location.search).get('token') || '';
    const LOGGED_IN = !!localStorage.getItem('sb_access_token'); // house convention (client-dashboard.html)

    // Domains in canonical P.I.P.E.S. display order.
    const DOMAINS = [
      { key: 'physical',      label: 'Physical' },
      { key: 'intellectual',  label: 'Intellectual' },
      { key: 'psychological', label: 'Psychological' },
      { key: 'environmental', label: 'Environmental' },
      { key: 'social',        label: 'Social' },
    ];

    const app = document.getElementById('app');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // v1.6 narrative fields are plain strings that may hold 2-3 paragraphs
    // separated by blank lines — render each as its own <p>.
    const paras = (s, cls) => String(s == null ? '' : s).split(/\n\s*\n/)
      .map((p) => p.trim()).filter(Boolean)
      .map((p) => '<p' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(p) + '</p>')
      .join('');

    function renderLoading() {
      app.innerHTML = '<section class="surface state"><div class="spinner" role="status" aria-label="Loading"></div><p>Opening your Map…</p></section>';
    }
    function renderError(msg) {
      app.innerHTML = '<section class="surface state"><h2>Map unavailable</h2><p>' + esc(msg || INACTIVE_MSG) + '</p></section>';
    }

    // Crisis copy mirrors map/intake.html verbatim — same safety language.
    function renderCrisis() {
      app.innerHTML =
        '<section class="surface state">' +
          '<h2>Thank you for sharing</h2>' +
          '<p>Some of what you wrote suggests you may be carrying something heavy right now. ' +
          'If you’re in crisis or thinking about harming yourself, you deserve immediate support — ' +
          'in the U.S. you can call or text <strong>988</strong> (the Suicide &amp; Crisis Lifeline), any time. ' +
          'If you are outside the US, please contact your local emergency services or a trusted person in your life.</p>' +
          '<p>Your coach will also reach out.</p>' +
        '</section>';
    }

    // ---- Force-portrait visual (TC3) ----
    // Ported from ineedtherapy effectiveness-map.html. Five life-area nodes around a
    // center goal node. Node SIZE comes from influence_level (coaching prompt v1.7.4,
    // surfaced per-domain by /api/map-results-read); Maps without scores fall back to
    // sizing by primary_status. Arrow direction comes from status. Coaching tokens only.
    // Returns an HTML string, or '' when the Map has no domain data.
    function wrapGoalText(text, maxChars, maxLines) {
      const words = String(text == null ? '' : text).trim().split(/\s+/).filter(Boolean);
      if (!words.length) return ['Your goal'];
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (test.length <= maxChars || !cur) { cur = test; }
        else { lines.push(cur); cur = w; if (lines.length === maxLines) { cur = ''; break; } }
      }
      if (cur && lines.length < maxLines) lines.push(cur);
      const rendered = lines.join(' ').split(/\s+/).filter(Boolean).length;
      if (rendered < words.length && lines.length) {
        let last = lines[lines.length - 1];
        while (last.length + 1 > maxChars && last.indexOf(' ') > -1) last = last.slice(0, last.lastIndexOf(' '));
        lines[lines.length - 1] = last + '…';
      }
      return lines;
    }

    function effmapForcePortrait(data) {
      const efo = (data.explorer_facing_output && typeof data.explorer_facing_output === 'object') ? data.explorer_facing_output : {};
      const ds = (efo.domain_statuses && typeof efo.domain_statuses === 'object') ? efo.domain_statuses : {};
      const hasData = DOMAINS.some((d) => ds[d.key] && ds[d.key].primary_status && String(ds[d.key].primary_status).trim());
      if (!hasData) return '';

      const CX = 320, CY = 300;
      const RADIUS = { 'Minimal': 26, 'Low': 29, 'Moderate': 33, 'High': 39, 'Very High': 46 };
      const STATUS_LEVEL = { 'Dominating': 'Very High', 'Resourcing': 'Moderate', 'Draining': 'Moderate', 'Unreleased': 'Low' };
      const LAYOUT = {
        physical:      { pos: [320, 150], side: 'top' },
        social:        { pos: [150, 196], side: 'top' },
        intellectual:  { pos: [490, 182], side: 'top' },
        psychological: { pos: [486, 438], side: 'bottom' },
        environmental: { pos: [154, 452], side: 'bottom' },
      };
      const STATUS = {
        'Resourcing': { dir: 'toward', fill: 'var(--gold)', stroke: 'var(--gold)', ring: null,          marker: 'fpToward', sFill: 'var(--gold)' },
        'Dominating': { dir: 'toward', fill: 'var(--gold)', stroke: 'var(--gold)', ring: 'var(--navy)',  marker: 'fpToward', sFill: 'var(--gold)' },
        'Draining':   { dir: 'away',   fill: 'var(--navy)', stroke: 'var(--navy)', ring: null,           marker: 'fpAway',   sFill: 'var(--navy)' },
        'Unreleased': { dir: 'broken', fill: 'none',        stroke: 'var(--gold)', ring: null,           marker: null,       sFill: 'var(--muted)' },
      };
      const radiusFor = (lvl) => RADIUS[lvl] || RADIUS.Moderate;
      const levelFor = (rec, status) => {
        const lvl = rec && rec.influence_level && String(rec.influence_level).trim();
        return (lvl && RADIUS[lvl]) ? lvl : (STATUS_LEVEL[status] || 'Moderate');
      };

      let threads = '', nodes = '';
      DOMAINS.forEach((d) => {
        const lay = LAYOUT[d.key]; if (!lay) return;
        const rec = ds[d.key] || {};
        const status = rec.primary_status && String(rec.primary_status).trim();
        if (!status) return;
        const st = STATUS[status] || STATUS.Resourcing;
        const r = radiusFor(levelFor(rec, status));
        const px = lay.pos[0], py = lay.pos[1];
        const mx = ((px + CX) / 2).toFixed(1), my = ((py + CY) / 2).toFixed(1);
        if (st.dir === 'broken') {
          const ex = (CX + (px - CX) * 0.62).toFixed(1), ey = (CY + (py - CY) * 0.62).toFixed(1);
          threads += '<line x1="' + CX + '" y1="' + CY + '" x2="' + ex + '" y2="' + ey + '" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="2 7" opacity="0.75"/>';
        } else {
          const pts = (st.dir === 'toward')
            ? (px + ',' + py + ' ' + mx + ',' + my + ' ' + CX + ',' + CY)
            : (CX + ',' + CY + ' ' + mx + ',' + my + ' ' + px + ',' + py);
          threads += '<polyline points="' + pts + '" fill="none" stroke="' + st.stroke + '" stroke-width="2.4" marker-mid="url(#' + st.marker + ')" opacity="0.85"/>';
        }
        if (st.dir === 'broken') {
          nodes += '<circle cx="' + px + '" cy="' + py + '" r="' + r + '" fill="none" stroke="' + st.stroke + '" stroke-width="1.8" stroke-dasharray="3 4" opacity="0.9"/>';
        } else {
          nodes += '<circle cx="' + px + '" cy="' + py + '" r="' + r + '" fill="' + st.fill + '"'
            + (st.ring ? ' stroke="' + st.ring + '" stroke-width="2"' : '')
            + (status === 'Draining' ? ' opacity="0.9"' : '') + ' filter="url(#fpSoft)"/>';
        }
        const nameY = lay.side === 'top' ? py - r - 18 : py + r + 26;
        const statusY = lay.side === 'top' ? py - r - 33 : py + r + 41;
        nodes += '<text x="' + px + '" y="' + nameY + '" text-anchor="middle" font-family="\'Cormorant Garamond\',serif" font-size="15" font-weight="600" fill="var(--navy)">' + esc(d.label) + '</text>';
        nodes += '<text x="' + px + '" y="' + statusY + '" text-anchor="middle" font-family="\'DM Sans\',sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="' + st.sFill + '">' + esc(status.toUpperCase()) + '</text>';
      });

      const goalLines = wrapGoalText(data.goal || '', 15, 3);
      const startY = CY - (goalLines.length - 1) * 8;
      let goalText = '';
      goalLines.forEach((ln, i) => {
        goalText += '<text x="' + CX + '" y="' + (startY + i * 16) + '" text-anchor="middle" font-family="\'Cormorant Garamond\',serif" font-size="13" font-weight="600" fill="#ffffff">' + esc(ln) + '</text>';
      });
      const phase = data.phase ? String(data.phase) : '';
      const phaseText = phase
        ? '<text x="' + CX + '" y="' + (CY + 90) + '" text-anchor="middle" font-family="\'DM Sans\',sans-serif" font-size="10" font-weight="700" letter-spacing="0.14em" fill="var(--gold)">' + esc(phase.toUpperCase()) + '</text>' : '';
      const center = '<circle cx="' + CX + '" cy="' + CY + '" r="62" fill="var(--navy)" stroke="var(--gold)" stroke-width="2" filter="url(#fpSoft)"/>';
      const defs = '<defs>'
        + '<marker id="fpToward" markerWidth="11" markerHeight="11" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--gold)"/></marker>'
        + '<marker id="fpAway" markerWidth="11" markerHeight="11" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--navy)"/></marker>'
        + '<filter id="fpSoft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1a3a52" flood-opacity="0.16"/></filter>'
        + '<radialGradient id="fpGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="var(--gold)" stop-opacity="0.12"/><stop offset="70%" stop-color="var(--gold)" stop-opacity="0.03"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/></radialGradient>'
        + '</defs>';
      const glow = '<circle cx="' + CX + '" cy="' + CY + '" r="150" fill="url(#fpGlow)"/>';
      const svg = '<svg viewBox="0 0 640 600" width="100%" style="max-width:520px;display:block;margin:0 auto;height:auto;" role="img" aria-label="A picture of your five life areas around your goal. Each circle\'s size shows how much that area is influencing the goal; arrows point toward the goal for areas feeding it and away for areas draining it.">'
        + defs + glow + threads + center + goalText + phaseText + nodes + '</svg>';
      return '<div class="map-portrait">' + svg + '</div>';
    }

    // ---- Share with your provider (TC3) ----
    // Mirrors ineedtherapy T8: the provider summary is never shown inline; on click we
    // fetch it and hand it off as a downloaded .txt file. Rendered only when the row
    // carries a provider_summary (has_provider_summary from the endpoint).
    function showShareMsg(text) { const m = document.getElementById('shareProviderMsg'); if (!m) return; m.textContent = text || ''; m.hidden = !text; }
    function downloadText(filename, text) {
      try {
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        return true;
      } catch (e) { return false; }
    }
    async function fetchProviderSummary(btn, sessionId) {
      showShareMsg('');
      if (!sessionId) { showShareMsg('We could not find this Map. Please reopen your link and try again.'); return; }
      if (btn) { btn.disabled = true; btn.textContent = 'Preparing summary…'; }
      const reset = () => { if (btn) { btn.disabled = false; btn.textContent = 'Share with your provider'; } };
      const headers = {};
      const tok = localStorage.getItem('sb_access_token'); // repo convention; sent only if present
      if (tok) headers['Authorization'] = 'Bearer ' + tok;
      let res;
      try {
        res = await fetch('/api/get-provider-summary?session_id=' + encodeURIComponent(sessionId), { method: 'GET', headers });
      } catch (e) { reset(); showShareMsg('We could not reach the server. Please check your connection and try again.'); return; }
      let payload = null; try { payload = await res.json(); } catch (e) {}
      if (res.ok && payload && typeof payload.provider_summary === 'string' && payload.provider_summary.trim()) {
        const ok = downloadText('effectiveness-map-provider-summary.txt', payload.provider_summary);
        reset();
        showShareMsg(ok ? '' : 'We prepared your summary but could not download it. Please try again.');
        return;
      }
      reset();
      showShareMsg('We could not prepare your provider summary just now. Please try again.');
    }

    function renderResults(data) {
      const goal = data.goal || '';
      const efo = (data.explorer_facing_output && typeof data.explorer_facing_output === 'object') ? data.explorer_facing_output : {};
      const ds = (efo.domain_statuses && typeof efo.domain_statuses === 'object') ? efo.domain_statuses : {};

      // (0) Force-portrait visual (TC3) — always at the very top of the surface.
      const portrait = effmapForcePortrait(data);

      // (0b) Cross-domain tension lines (TC3) — after the portrait, before the
      // snapshots. Only when explorer_facing_output.cross_domain is a non-empty
      // array; older Maps (and coaching Maps, which emit none) render nothing.
      let crossDomain = '';
      if (Array.isArray(efo.cross_domain) && efo.cross_domain.length) {
        const cards = efo.cross_domain.map((e) => {
          if (!e || typeof e !== 'object') return '';
          const reading = e.reading && String(e.reading).trim();
          if (!reading) return '';
          const from = e.from && String(e.from).trim();
          const to = e.to && String(e.to).trim();
          const rel = (from && to)
            ? '<p class="cd-rel">' + esc(from) + ' <span class="cd-arrow">→</span> ' + esc(to) + '</p>' : '';
          return '<div class="cd-card">' + rel + '<p class="cd-reading">' + esc(reading) + '</p></div>';
        }).filter(Boolean).join('');
        if (cards) crossDomain = '<div class="cross-domain"><p class="section-label">How these areas are working together</p>' + cards + '</div>';
      }

      // (1) Domain Snapshot — five paragraphs, no headers, in domain order.
      const snapshots = DOMAINS
        .map((d) => ds[d.key] && ds[d.key].snapshot_paragraph)
        .filter((p) => p && String(p).trim())
        .map((p) => '<p class="snapshot-para">' + esc(p) + '</p>')
        .join('');

      // (1b) Opener — v1.7 fixed copy ("Why this is different"). First line is
      // the heading, the rest are paragraphs. Absent on pre-v1.7 Maps.
      let opener = '';
      if (efo.opener && String(efo.opener).trim()) {
        const lines = String(efo.opener).split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
        const head = lines.length > 1 && lines[0].length < 60 ? lines.shift() : 'Why this is different';
        opener = '<div class="opener"><h2>' + esc(head) + '</h2>' +
          lines.map((p) => '<p>' + esc(p) + '</p>').join('') + '</div>';
      }

      // (2) The Whole Picture (stored key stays system_picture for v1.5-v1.7 compat).
      const sp = efo.system_picture && efo.system_picture.narrative;
      const systemPicture = sp && String(sp).trim()
        ? '<div class="system-picture"><p class="section-label">The Whole Picture</p>' + paras(sp) + '</div>' : '';

      // (2b) How this shows up for you — v1.6 translation layer. Absent on
      // pre-v1.6 Maps; renders nothing in that case.
      const hts = efo.how_this_shows_up;
      const showsUp = hts && String(hts).trim()
        ? '<div class="shows-up"><p class="section-label">How this shows up for you</p>' + paras(hts) + '</div>' : '';

      // (3) Cross-Domain Tax — only when present (explorer-facing through v1.5;
      // coach-only from v1.6, so new Maps render nothing here).
      const tax = efo.cross_domain_tax;
      const taxText = tax && tax.narrative && String(tax.narrative).trim() ? tax.narrative : '';
      const crossTax = taxText
        ? '<div class="cross-tax"><p class="section-label">Where the load is moving</p><p>' + esc(taxText) + '</p></div>' : '';

      // (3b) Closing summary — v1.7: what is working for / against the goal,
      // per area. Absent on pre-v1.7 Maps. Neutral areas render an em-dash.
      const DIR_LABELS = { for: 'Working for you', against: 'Working against you', both: 'Cuts both ways', neutral: '—' };
      let closing = '';
      if (efo.closing_summary && typeof efo.closing_summary === 'object') {
        const rows = DOMAINS.map((d) => {
          const c = efo.closing_summary[d.key];
          if (!c || typeof c !== 'object') return '';
          const dir = DIR_LABELS[c.direction] || '—';
          const plain = c.plain && String(c.plain).trim() ? esc(c.plain) : '';
          return '<div class="closing-row">' +
            '<span class="closing-domain">' + esc(d.label) + '</span>' +
            '<span class="closing-dir">' + esc(dir) + '</span>' +
            (plain ? '<span class="closing-plain">' + plain + '</span>' : '') +
          '</div>';
        }).join('');
        if (rows) closing = '<div class="closing"><p class="section-label">In short</p>' + rows + '</div>';
      }

      // (4) Release Question — the hero element.
      const rq = efo.release_question && efo.release_question.question;
      const release = rq && String(rq).trim()
        ? '<div class="release">' +
            '<p class="release-eyebrow">A question to sit with</p>' +
            '<p class="release-question">' + esc(rq) + '</p>' +
          '</div>' : '';

      // (4b) A first move (TC3) — explorer-facing action step, after the release
      // question and before the status row. Absent on older Maps.
      const fm = efo.first_move;
      const firstMove = fm && String(fm).trim()
        ? '<div class="first-move"><p class="section-label">A first move</p>' + paras(fm) + '</div>' : '';

      // (4c) Share with your provider (TC3) — only when the row carries a
      // provider_summary. The summary is fetched on click, never shown inline.
      const share = data.has_provider_summary
        ? '<div class="share-provider">' +
            '<button class="btn btn-secondary share-btn" id="shareProviderBtn" type="button">Share with your provider</button>' +
            '<p class="share-desc">Generates a clinical summary your coach or therapist can read before your session.</p>' +
            '<p class="share-msg" id="shareProviderMsg" role="status" hidden></p>' +
          '</div>' : '';

      // (5) Domain Status Row — primary status under each domain name.
      const statusCells = DOMAINS.map((d) => {
        const v = ds[d.key] && ds[d.key].primary_status;
        const has = v && String(v).trim();
        return '<div class="status-cell">' +
          '<span class="status-domain">' + esc(d.label) + '</span>' +
          '<span class="status-value' + (has ? '' : ' is-empty') + '">' + esc(has ? v : '—') + '</span>' +
        '</div>';
      }).join('');
      const statusRow = '<div class="status-row">' + statusCells + '</div>';

      // (5b) Status legend — v1.7 fixed copy, shown under the chips. The model
      // returns markdown-ish bullet lines; strip list/bold markers and render
      // "Word — meaning" with the word emphasized.
      let legend = '';
      if (efo.status_legend && String(efo.status_legend).trim()) {
        const items = String(efo.status_legend).split(/\n+/)
          .map((l) => l.replace(/^[-*\s]+/, '').replace(/\*\*/g, '').trim())
          .filter(Boolean)
          .map((l) => {
            const m = l.match(/^(\w+)\s*[—–-]\s*(.+)$/);
            return m ? '<p><strong>' + esc(m[1]) + '</strong> — ' + esc(m[2]) + '</p>' : '<p>' + esc(l) + '</p>';
          }).join('');
        if (items) legend = '<div class="legend">' + items + '</div>';
      }

      // Account prompt — skipped entirely when the explorer is already logged in.
      const keep = LOGGED_IN ? '' :
        '<div class="keep">' +
          '<h2>Keep your Map.</h2>' +
          '<p>Create a free account to save this and track how your Map changes over time.</p>' +
          '<a class="btn btn-primary" href="/signup.html">Create a free account</a>' +
        '</div>';

      // v1.7 Maps lead with the opener; older Maps keep a one-line opening
      // ("system" is banned from the explorer surface — see prompt v1.7).
      const opening = opener ? '' :
        '<p class="opening">Here is what your Map is showing right now, in service of your goal.</p>';

      app.innerHTML =
        '<section class="surface screen">' +
          portrait +
          opener +
          opening +
          (goal ? '<p class="goal">' + esc(goal) + '</p>' : '') +
          crossDomain +
          '<div class="snapshot">' + snapshots + '</div>' +
          systemPicture +
          showsUp +
          crossTax +
          closing +
          release +
          firstMove +
          share +
          statusRow +
          legend +
          keep +
        '</section>';

      // Wire the provider-share button (present only when has_provider_summary).
      const shareBtn = document.getElementById('shareProviderBtn');
      if (shareBtn) shareBtn.addEventListener('click', () => fetchProviderSummary(shareBtn, data.session_id));
    }

    async function init() {
      if (!TOKEN) { renderError(INACTIVE_MSG); return; }
      renderLoading();
      try {
        const r = await fetch('/api/map-results-read', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: TOKEN }),
        });
        const data = await r.json().catch(() => ({}));
        if (!data || !data.ok) { renderError(data && data.error); return; }
        if (data.status === 'crisis') { renderCrisis(); return; }
        renderResults(data);
      } catch (e) {
        renderError(INACTIVE_MSG);
      }
    }
    init();
  </script>
</body>
</html>
