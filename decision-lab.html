<style>
:root {

  --border: #d4cdb8; --protects: #2f6b3e; --neutral: #c89d3c; --risks: #9b2c2c;
  --serif: "Cormorant Garamond", Georgia, serif; --sans: "DM Sans", -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); color: var(--ink); background: var(--cream); line-height: 1.5; -webkit-font-smoothing: antialiased; }
.nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(26, 58, 82, 0.95); backdrop-filter: blur(10px); z-index: 100; padding: 14px 0; border-bottom: 1px solid rgba(196, 154, 60, 0.2); }
.nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
.nav-brand { color: var(--cream); font-family: var(--serif); font-size: 20px; font-weight: 600; text-decoration: none; }
.nav-links { display: flex; gap: 28px; align-items: center; }
.nav-links a { color: var(--cream); text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity .2s; }
.nav-links a:hover { opacity: 1; }
.nav-cta { background: var(--gold); color: var(--navy) !important; padding: 8px 16px; border-radius: 2px; font-weight: 600; opacity: 1 !important; }
.main { padding-top: 80px; }
.landing-hero { max-width: 1100px; margin: 0 auto; padding: 60px 24px 40px; display: grid; grid-template-columns: 1fr 420px; gap: 60px; align-items: start; }
@media (max-width: 900px) { .landing-hero { grid-template-columns: 1fr; gap: 40px; padding: 40px 20px; } }
.eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--gold); margin-bottom: 20px; font-weight: 500; }
.hero-title { font-family: var(--serif); font-size: 56px; line-height: 1.05; font-weight: 500; color: var(--navy); margin-bottom: 20px; letter-spacing: -0.5px; }
.hero-title em { color: var(--gold); font-style: italic; }
@media (max-width: 900px) { .hero-title { font-size: 40px; } }
.hero-lead { font-family: var(--serif); font-size: 20px; line-height: 1.55; color: var(--ink); opacity: 0.85; margin-bottom: 32px; }
.feature-list { list-style: none; }
.feature-list li { display: flex; gap: 14px; margin-bottom: 18px; }
.feature-check { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 12px; margin-top: 2px; }
.feature-h { font-weight: 600; color: var(--navy); font-size: 15px; margin-bottom: 2px; }
.feature-p { font-size: 14px; color: var(--muted); line-height: 1.5; }
.why-card { background: #fff; border: 1px solid var(--border); padding: 20px; border-radius: 3px; margin-top: 30px; }
.why-card-label { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; color: var(--muted); margin-bottom: 8px; }
.why-card p { font-size: 14px; color: var(--ink); line-height: 1.6; }
.why-card em { color: var(--navy); font-family: var(--serif); font-style: italic; }
.entry-card { background: var(--cream-warm); border-top: 4px solid var(--gold); padding: 32px; border-radius: 3px; box-shadow: 0 30px 60px -30px rgba(15, 27, 45, 0.25); position: sticky; top: 100px; }
.entry-label { text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.entry-title { font-family: var(--serif); font-size: 28px; color: var(--navy); font-weight: 500; margin-bottom: 24px; }
label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); background: #fff; border-radius: 2px; font-family: var(--sans); font-size: 15px; color: var(--ink); transition: border-color .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy); }
.field { margin-bottom: 16px; }
.btn { cursor: pointer; border: none; font-family: var(--sans); font-size: 14px; transition: all .15s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--navy); color: var(--cream); padding: 14px 24px; border-radius: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; }
.btn-primary:hover { background: var(--navy-deep); }
.btn-primary-full { width: 100%; }

.btn-secondary { background: #fff; color: var(--navy); padding: 12px 22px; border: 1px solid var(--border); border-radius: 2px; font-weight: 500; }
.btn-secondary:hover { border-color: var(--navy); }
.btn-gold { background: var(--gold); color: #fff; padding: 14px 24px; border-radius: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; cursor: pointer; border: none; font-family: var(--sans); }

.privacy-note span { font-size: 11px; color: var(--muted); line-height: 1.5; }
.err { color: var(--risks); font-size: 13px; margin-bottom: 10px; }
.step-container { max-width: 720px; margin: 0 auto; padding: 40px 24px; }
.back-btn { background: none; color: var(--muted); font-size: 13px; margin-bottom: 24px; padding: 6px 0; opacity: 0.7; border: none; cursor: pointer; }
.back-btn:hover { opacity: 1; }
.step-eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--gold); margin-bottom: 12px; font-weight: 500; }

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }

.options-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

@media (max-width: 500px) { .options-grid, .options-3, .options-4 { grid-template-columns: 1fr; } }
.opt { background: #fff; border: 1px solid var(--border); padding: 16px 18px; border-radius: 2px; font-size: 15px; color: var(--ink); font-family: var(--sans); cursor: pointer; text-align: left; transition: all .15s; display: flex; align-items: center; gap: 12px; }
.opt:hover { border-color: var(--navy); }
.opt.active { background: var(--navy); color: var(--cream); border-color: var(--navy); font-weight: 500; }
.opt.active-gold { background: var(--gold); color: #fff; border-color: var(--gold); font-weight: 500; }

.opt.active .opt-box, .opt.active-gold .opt-box { background: #fff; border-color: #fff; }
textarea { resize: vertical; min-height: 80px; font-family: var(--sans); }
.section-label { text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }
.mirror-card { background: var(--cream-warm); border-left: 4px solid var(--gold); padding: 28px; margin-bottom: 24px; border-radius: 3px; }
.mirror-label { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }
.mirror-text { font-family: var(--serif); font-size: 20px; line-height: 1.5; color: var(--navy); font-weight: 500; }
.feedback-card { background: var(--cream-warm); border-left: 4px solid var(--gold); padding: 22px; margin-top: 24px; border-radius: 3px; animation: fadeIn .4s ease-out; }
.feedback-text { font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--navy); font-weight: 500; }
.confidence-box { background: var(--cream-warm); border: 1px dashed var(--border); padding: 20px; margin-bottom: 20px; border-radius: 3px; }
.confidence-q { font-family: var(--serif); font-size: 17px; color: var(--navy); margin-bottom: 14px; font-weight: 500; }
.heat-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
@media (max-width: 700px) { .heat-bars { grid-template-columns: 1fr; } }
.heat-bar { background: #fff; border: 1px solid var(--border); padding: 20px; border-radius: 3px; }
.heat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.heat-label { font-family: var(--serif); font-size: 17px; color: var(--navy); font-weight: 500; }
.heat-tier { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 100px; color: #fff; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
.heat-score { font-size: 13px; color: var(--muted); font-weight: 600; }
.heat-progress { height: 7px; background: var(--border); border-radius: 4px; margin-bottom: 12px; overflow: hidden; }
.heat-fill { height: 100%; border-radius: 4px; transition: width .4s; }
.heat-note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.legend-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px; color: #fff; font-size: 11px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.risks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 700px) { .risks-grid { grid-template-columns: 1fr; } }
.risk { padding: 14px 16px; border-radius: 3px; border: 1px solid var(--border); background: var(--cream-warm); opacity: 0.5; }
.risk.active { opacity: 1; border-color: var(--risks); background: rgba(155, 44, 44, 0.05); }
.risk-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.risk-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--border); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.risk.active .risk-dot { background: var(--risks); }
.risk-name { font-size: 13px; font-weight: 600; color: var(--navy); }
.risk-desc { font-size: 12px; color: var(--muted); }
.gaps-box { background: rgba(200, 157, 60, 0.08); border-left: 4px solid var(--neutral); padding: 24px; border-radius: 3px; margin-bottom: 32px; }
.gaps-label { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--neutral); margin-bottom: 10px; font-weight: 600; }
.gaps-intro { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.gaps-list { list-style: none; }
.gaps-list li { display: flex; gap: 12px; margin-bottom: 10px; font-family: var(--serif); font-size: 16px; color: var(--navy); }
.reflection-box { background: var(--cream-warm); padding: 32px; border-radius: 3px; margin-bottom: 32px; }
.reflection-label { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--gold); margin-bottom: 14px; font-weight: 600; }
.reflection-box p { font-family: var(--serif); font-size: 17px; line-height: 1.65; color: var(--navy); margin-bottom: 18px; }
.reflection-box p:last-child { margin-bottom: 0; }
.summary-card { background: var(--navy); color: var(--cream); padding: 26px 28px; border-radius: 3px; margin-bottom: 36px; }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 600px) { .summary-grid { grid-template-columns: 1fr; gap: 16px; } }
.summary-label { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; opacity: 0.6; margin-bottom: 6px; }
.summary-val { font-family: var(--serif); font-size: 18px; line-height: 1.4; }
.whats-next { background: var(--navy); color: var(--cream); padding: 32px; border-radius: 3px; margin-top: 32px; }
.wn-eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: var(--gold); margin-bottom: 12px; font-weight: 600; }
.wn-title { font-family: var(--serif); font-size: 26px; font-weight: 500; margin-bottom: 16px; }
.wn-lead { font-family: var(--serif); font-size: 16px; line-height: 1.6; margin-bottom: 24px; opacity: 0.9; }
.wn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
@media (max-width: 800px) { .wn-grid { grid-template-columns: 1fr; } }
.wn-card { background: rgba(247, 245, 241, 0.08); padding: 18px; border-radius: 3px; }
.wn-card-label { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; color: var(--gold); margin-bottom: 8px; }
.wn-card-desc { font-size: 13px; opacity: 0.9; margin-bottom: 14px; line-height: 1.5; }
.wn-card a { color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; text-decoration: none; cursor: pointer; }
.spinner { width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.loading-row { display: flex; align-items: center; gap: 12px; padding: 24px; background: var(--cream-warm); border-radius: 3px; color: var(--muted); font-size: 14px; }
.progress { display: flex; gap: 5px; align-items: center; margin-bottom: 32px; }
.progress-step { height: 3px; width: 14px; background: var(--border); transition: all .2s; }
.progress-step.current { width: 28px; background: var(--gold); }
.progress-step.done { background: var(--gold); }
.demo-btn { position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: var(--cream); padding: 10px 16px; border-radius: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; opacity: 0.55; border: none; transition: opacity .2s; z-index: 50; font-family: var(--sans); }
.demo-btn:hover { opacity: 1; }
.footer { border-top: 1px solid var(--border); margin-top: 60px; padding: 20px 24px; max-width: 1100px; margin-left: auto; margin-right: auto; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.cc-card { background: #fff; border: 1px solid var(--border); padding: 20px; border-radius: 3px; margin-bottom: 14px; }
.cc-num { display: inline-block; font-family: var(--serif); font-size: 15px; color: var(--gold); font-weight: 600; margin-right: 8px; }
.cc-q { font-family: var(--serif); font-size: 16px; color: var(--navy); font-weight: 500; margin-bottom: 14px; line-height: 1.4; }
.cc-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.cc-btn { padding: 10px; border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--ink); font-size: 13px; cursor: pointer; transition: all .15s; font-family: var(--sans); }
.cc-btn.active-yes { background: var(--protects); color: #fff; border-color: var(--protects); }
.cc-btn.active-partial { background: var(--neutral); color: #fff; border-color: var(--neutral); }
.cc-btn.active-no { background: var(--risks); color: #fff; border-color: var(--risks); }
.per-group-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
.per-group-row:last-child { border-bottom: none; }
.pg-name { font-weight: 500; color: var(--navy); }
.pg-btns { display: flex; gap: 6px; }
.pg-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 2px; background: #fff; color: var(--ink); font-size: 12px; cursor: pointer; font-family: var(--sans); }
.pg-btn.active { background: var(--gold); color: #fff; border-color: var(--gold); }
</style>

const DL = (function() {
  let data = {};
  let phase = "landing";

  async function callClaude(prompt, maxTokens, expectJson) {
    maxTokens = maxTokens || 1000; expectJson = !!expectJson;
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/decision-lab-claude", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
        body: JSON.stringify({ prompt: prompt, maxTokens: maxTokens, expectJson: expectJson })
      });
      if (!res.ok) { console.error("Edge function returned", res.status); return null; }
      const j = await res.json();
      return expectJson ? j.json : j.text;
    } catch (e) { console.error("callClaude error:", e); return null; }
  }

  async function callApi(action, payload) {
    payload = payload || {};
    try {
      const res = await fetch(SUPABASE_URL + "/functions/v1/decision-lab-api", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
        body: JSON.stringify({ action: action, payload: payload })
      });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }

  const KEY = "decision_lab_session_v1";
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify({ data: data, phase: phase, ts: Date.now() })); } catch(e) {} }
  function loadLocal() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
  function clearLocal() { try { localStorage.removeItem(KEY); } catch(e) {} }

  function getRoleLens(role) {
    const m = {
      "Board Member": { lens: "governance and policy" },
      "Board President": { lens: "board leadership" },
      "Superintendent": { lens: "district execution" },
      "Cabinet / Central Office": { lens: "functional execution" },
      "Principal / Campus Leader": { lens: "campus execution" }
    };
    return m[role] || { lens: "your leadership role" };
  }

  const DEMO = {
    name: "Demo Leader", email: "demo@example.org", role: "Board Member",
    districtContext: "Suburban", timeline: "This week",
    scenario: "Budget shortfall", decisions: ["Reduce staffing", "Reallocate resources"],

    filter: { studentsFeel: "Larger class sizes, less one-on-one support", teachersAbsorb: "More students per class, emotional weight", differentialGaps: "Title I campuses may lose intervention staff first", protecting: "Mixed", knowItWorks: "Intervention attendance, teacher retention at 30/60/90" },
    confidenceCheck: { evidenceExamined: "Partially", nonNegotiablesDiscussed: "Partially", capacityAssessed: "Not yet", communicationDrafted: "Partially", differentialAnalyzed: "Not yet", stakeholderVoice: "Partially" },
    finalAnalysis: {
      scores: { instructionalProtection: 5, systemCapacity: 3, differentialImpact: 3, decisionQuality: 5, communicationClarity: 5 },
      notes: {
        instructionalProtection: "Intent is clear but 'partially protected' means the guardrails aren't tested yet.",
        systemCapacity: "Students rated 'No' on equipped — and no one has directly assessed teacher/principal load.",
        differentialImpact: "You flagged the concern but haven't analyzed by student group yet.",
        decisionQuality: "Triangulated evidence exists but hasn't been interrogated against the urgency claim.",
        communicationClarity: "Partial draft with three audiences. Silence erodes trust faster than hard news."
      },
      riskFlags: { shortTermism: true, initiativeOverload: false, differentialBlindSpots: true, opticsOverExecution: false },
      namedGaps: [
        "Direct capacity assessment never conducted with teachers, principals, or students",
        "Differential impact analysis not done by student group (ELL, SPED, Title I)",
        "Non-negotiables remain partially discussed — not named explicitly with the board",
        "Stakeholder voice only partially included before the decision is finalized"
      ],
      paragraph1: "As a board member facing this decision within a week, you've done the harder work most boards skip — you've named what must be protected and flagged where your confidence is thin. The tension in your profile isn't between what you want and what the budget allows; it's between what you intend and what your process has actually verified. Your Suburban context means families will notice class size changes quickly, and 'partially discussed' non-negotiables tend to collapse under pressure when principals begin absorbing decisions they weren't part of shaping.",
      paragraph2: "Before the vote, push for three things: a direct capacity conversation with principals (not a survey — a conversation), a differential analysis by student group showing which campuses absorb what, and communication language drafted by Thursday — not Monday. Research on district decision quality is consistent: the difference between decisions that hold and decisions that erode trust is not the action itself, but whether non-negotiables were named before tradeoffs were forced. You're close. Don't let the timeline cost you that margin."

  function el(tag, className, text) {
    const e = document.createElement(tag);

    if (text != null) e.textContent = text;

  }

  function mount(node) {

  const ORDER = ["scenario","decision","concerns","clarity","pass1","pass2","pass3","pass4","pass5","filter","confidence","final"];
  function progressBar() {
    const idx = ORDER.indexOf(phase);
    if (idx < 0) return null;
    const wrap = el("div", "progress");
    for (let i = 0; i < 9; i++) {
      const capped = Math.min(idx, 8);
      wrap.appendChild(el("div", "progress-step" + (i < capped ? " done" : i === capped ? " current" : "")));
    }
    return wrap;
  }

  function backBtn(toPhase) {

  }

  function shell(eyebrow, title, subtitle, bodyNode, backPhase) {
    const root = el("div", "step-container");
    const pb = progressBar();
    if (pb) root.appendChild(pb);
    if (backPhase) root.appendChild(backBtn(backPhase));
    root.appendChild(el("div", "step-eyebrow", eyebrow));
    root.appendChild(el("h2", "step-title", title));

  function singleSelectGrid(options, currentValue, onSelect, variant) {
    const gridClass = "options-grid" + (options.length === 3 ? " options-3" : options.length === 4 ? " options-4" : "");

    options.forEach(function(o) {
      const activeClass = variant === "gold" ? "active-gold" : "active";
      const btn = el("button", "opt" + (currentValue === o ? " " + activeClass : ""));
      btn.textContent = o;
      btn.onclick = function() { onSelect(o); };
      grid.appendChild(btn);
    });
    return grid;
  }

  function multiSelectGrid(options, currentValues, onToggle, variant) {
    const grid = el("div", "options-grid");
    options.forEach(function(o) {
      const active = currentValues.indexOf(o) >= 0;
      const activeClass = variant === "gold" ? "active-gold" : "active";
      const btn = el("button", "opt" + (active ? " " + activeClass : ""));
      btn.appendChild(el("div", "opt-box", active ? "✓" : ""));
      btn.appendChild(el("span", null, o));
      btn.onclick = function() { onToggle(o); };
      grid.appendChild(btn);
    });
    return grid;
  }

  function renderClarity() {
    const body = el("div");
    const state = { summary: data.claritySummary || "", refining: false, refineText: "", refineCount: data.refineCount || 0, loading: !data.claritySummary, regenerating: false, history: (data.refinementHistory || []).slice() };
    const scenarioText = data.scenario === "Other" ? data.scenarioOther : data.scenario;
    const decisionText = data.decisions.filter(function(x) { return x !== "Other"; }).concat(data.decisionOther ? [data.decisionOther] : []).join(" + ");
    const concernsText = data.concerns.filter(function(x) { return x !== "Other"; }).concat(data.concernsOther ? [data.concernsOther] : []).join(", ");

    async function generate(refinement) {
      const prompt = 'You are an executive leadership coach producing a brief "coach clarity" mirror.\n\nRole: ' + data.role + '\nDistrict: ' + data.districtContext + '\nScenario: ' + scenarioText + '\nAction(s): ' + decisionText + '\nConfidence: ' + data.confidence + '\nConcerns: ' + concernsText + '\n' + (refinement ? 'Additional context: ' + refinement : '') + '\n\nWrite 3-4 sentences. Start with "Here\'s what I\'m hearing:" Return ONLY the mirror.';
      const text = await callClaude(prompt, 400);
      return text || ("Here's what I'm hearing: You are facing " + scenarioText + ". You are considering " + decisionText + ". As a " + data.role + " in a " + data.districtContext + " context, this decision sits at the intersection of instruction, staff capacity, and community trust.");
    }

    async function initialGen() {
      const text = await generate(null);
      state.summary = text; state.loading = false; data.claritySummary = text;
      repaint();
    }

    async function submitRefinement() {
      if (!state.refineText.trim()) return;
      state.regenerating = true;
      const thisRefinement = state.refineText;
      state.history.push(thisRefinement);
      repaint();
      const newText = await generate(thisRefinement);
      state.summary = newText; state.refineCount++;
      data.claritySummary = newText; data.refinementHistory = state.history; data.refineCount = state.refineCount;
      // Combine all refinements into raw_expression so the user's actual typed context is preserved
      data.rawExpression = state.history.join("\n\n---\n\n");
      // Persist the refinement immediately so it never gets lost
      try {
        const upsertPayload = {
          name: data.name, email: data.email, role: data.role, district_context: data.districtContext,
          scenario: data.scenario, timeline: data.timeline, decisions: data.decisions, confidence: data.confidence,
          concerns: data.concerns,
          clarity_summary: data.claritySummary,
          raw_expression: data.rawExpression,
          refinement_history: data.refinementHistory,
          refine_count: data.refineCount
        };
        if (data.sessionId) upsertPayload.id = data.sessionId;
        const result = await callApi("session_upsert", upsertPayload);
        if (result && result.session && result.session.id) data.sessionId = result.session.id;
      } catch (e) { console.error("Refinement save failed:", e); }
      state.refining = false; state.refineText = ""; state.regenerating = false;
      repaint();
    }

    function repaint() {
      body.innerHTML = "";
      if (state.loading) {
        const row = el("div", "loading-row");
        row.appendChild(el("div", "spinner"));
        row.appendChild(el("span", null, "Listening carefully..."));
        body.appendChild(row);
        return;
      }
      const card = el("div", "mirror-card");
      card.appendChild(el("div", "mirror-label", "MIRROR" + (state.refineCount > 0 ? " (REFINED " + state.refineCount + "×)" : "")));
      if (state.regenerating) {
        const row = el("div", "loading-row");
        row.style.cssText = "background: transparent; padding: 0;";
        row.appendChild(el("div", "spinner"));
        row.appendChild(el("span", null, "Integrating..."));
        card.appendChild(row);
      } else {
        card.appendChild(el("p", "mirror-text", state.summary));
      }
      body.appendChild(card);
      if (state.regenerating) return;
      const canRefine = state.refineCount < 2;
      if (!state.refining) {
        body.appendChild(el("div", "section-label", state.refineCount === 0 ? "DID I CAPTURE THIS ACCURATELY?" : "CLOSER THIS TIME?"));
        const row = el("div"); row.style.cssText = "display: flex; gap: 12px; flex-wrap: wrap;";
        const primary = el("button", "btn btn-primary", state.refineCount >= 2 ? "Close enough — let's begin" : "Yes, enter the Decision Lab");
        primary.onclick = function() { go("pass1"); };
        row.appendChild(primary);
        if (canRefine) {
          const sec = el("button", "btn btn-secondary", state.refineCount === 0 ? "Let me refine" : "One more refinement");
          sec.onclick = function() { state.refining = true; repaint(); };
          row.appendChild(sec);
        }
        body.appendChild(row);
      } else {
        const help = el("p", null, "Add context, correct anything, or clarify.");
        help.style.cssText = "font-size: 13px; color: var(--muted); margin-bottom: 10px;";
        body.appendChild(help);
        const ta = document.createElement("textarea");
        ta.placeholder = "What did I miss?"; ta.rows = 3; ta.value = state.refineText;
        ta.oninput = function(e) { state.refineText = e.target.value; };
        ta.onblur = function(e) {
          if (e.relatedTarget && e.relatedTarget.tagName === "BUTTON") return;
          repaint();
        };
        body.appendChild(ta);
        const row = el("div"); row.style.cssText = "display: flex; gap: 10px; margin-top: 12px;";
        const go1 = el("button", "btn btn-primary", "Revise →");
        go1.onclick = submitRefinement;
        row.appendChild(go1);
        const cancel = el("button", "btn btn-secondary", "Cancel");
        cancel.onclick = function() { state.refining = false; state.refineText = ""; repaint(); };
        row.appendChild(cancel);
        body.appendChild(row);
      }
    }
    repaint();
    if (state.loading) initialGen();
    return shell("STEP 4 OF 9 · COACH CLARITY", "Before we analyze, let's make sure we've understood you.", null, body, "concerns");
  }

  function renderPass(config) {
    const body = el("div");
    const existing = data[config.key] || {};
    const state = {
      primary: existing.primary || existing.driver || existing.plan || "",
      secondary: existing.mostImportant || existing.mustRemain || existing.sources || existing.absorbers || existing.audiences || (config.secondaryMulti ? [] : ""),
      perGroup: existing.equippedPerGroup || {},
      confidence: existing.confidence || "",
      feedback: existing.feedback || "",
      loading: false
    };

    async function genMicro() {
      state.loading = true; repaint();
      const decisionText = data.decisions.filter(function(x) { return x !== "Other"; }).concat(data.decisionOther ? [data.decisionOther] : []).join(" + ");
      const roleInfo = getRoleLens(data.role);
      const secondaryDesc = config.perGroupMode
        ? Object.keys(state.perGroup).map(function(g) { return g + ": " + state.perGroup[g]; }).join("; ")
        : (Array.isArray(state.secondary) ? state.secondary.join(", ") : state.secondary);
      const prompt = 'You are an executive leadership coach giving deep micro-feedback.\n\nLEADER: ' + data.role + ' (' + roleInfo.lens + ')\nDISTRICT: ' + data.districtContext + '\nDECISION: ' + decisionText + '\nPASS ' + config.num + ': ' + config.title + '\nPRIMARY: ' + state.primary + '\nSECONDARY: ' + secondaryDesc + '\nCONFIDENCE: ' + state.confidence + '\n\nWrite 2-3 sentences in 3 MOVES: 1) ACKNOWLEDGE, 2) SHARP INSIGHT, 3) FORWARD CONNECTION. Return only the feedback.';
      const text = await callClaude(prompt, 300);
      state.feedback = text || "Your inputs reveal a tension that will shape your decision profile.";
      state.loading = false;
      const payload = { confidence: state.confidence, feedback: state.feedback };
      if (config.perGroupMode) { payload.absorbers = state.secondary; payload.equippedPerGroup = state.perGroup; payload.primary = state.primary; }
      else if (config.num === 3) { payload.driver = state.primary; payload.sources = state.secondary; }
      else if (config.num === 5) { payload.plan = state.primary; payload.audiences = state.secondary; }
      else if (config.num === 2) { payload.mustRemain = state.secondary; }
      else { payload.primary = state.primary; payload.mostImportant = state.secondary; }
      data[config.key] = payload;
      repaint();
    }

    function repaint() {
      body.innerHTML = "";
      const hasPrimaryStep = config.num !== 2 && config.primaryOpts && config.primaryOpts.length > 0;
      if (hasPrimaryStep) {
        const w = el("div"); w.style.marginBottom = "24px";
        w.appendChild(el("div", "section-label", config.primaryLabel));
        w.appendChild(singleSelectGrid(config.primaryOpts, state.primary, function(o) { state.primary = o; state.feedback = ""; repaint(); }));
        body.appendChild(w);
      } else if (config.num === 2) {
        const p = el("p", null, "Select everything that must be preserved. These are your anchors against drift.");
        p.style.cssText = "font-size: 15px; color: var(--muted); margin-bottom: 20px;";
        body.appendChild(p);
      } else if (config.perGroupMode) {
        const p = el("p", null, "Select the groups that will absorb this decision. For each, note whether they are equipped to carry it.");
        p.style.cssText = "font-size: 15px; color: var(--muted); margin-bottom: 20px;";
        body.appendChild(p);
      }

      const showSecondary = config.num === 2 || !hasPrimaryStep || state.primary;

      if (showSecondary && !config.perGroupMode) {
        const w = el("div"); w.style.marginBottom = "24px";
        if (config.secondaryLabel) w.appendChild(el("div", "section-label", config.secondaryLabel));
        if (config.secondaryMulti) {
          w.appendChild(multiSelectGrid(config.secondaryOpts, state.secondary, function(o) {
            const i = state.secondary.indexOf(o);
            if (i >= 0) state.secondary.splice(i, 1); else state.secondary.push(o);
            state.feedback = ""; repaint();
          }, "gold"));
        } else {
          w.appendChild(singleSelectGrid(config.secondaryOpts, state.secondary, function(o) { state.secondary = o; state.feedback = ""; repaint(); }, "gold"));
        }
        body.appendChild(w);
      }

      if (showSecondary && config.perGroupMode) {
        const sel = el("div"); sel.style.marginBottom = "20px";
        sel.appendChild(el("div", "section-label", "WHO ABSORBS THIS? (SELECT ALL)"));
        sel.appendChild(multiSelectGrid(config.secondaryOpts, state.secondary, function(o) {
          const i = state.secondary.indexOf(o);
          if (i >= 0) { state.secondary.splice(i, 1); delete state.perGroup[o]; }
          else state.secondary.push(o);
          state.feedback = ""; repaint();
        }));
        body.appendChild(sel);
        if (state.secondary.length > 0) {
          const eq = el("div"); eq.style.marginBottom = "20px";
          eq.appendChild(el("div", "section-label", "IS EACH GROUP EQUIPPED?"));
          const box = el("div", "cc-card");
          state.secondary.forEach(function(g) {
            const row = el("div", "per-group-row");
            row.appendChild(el("div", "pg-name", g));
            const btns = el("div", "pg-btns");
            ["Yes", "Somewhat", "No"].forEach(function(o) {
              const b = el("button", "pg-btn" + (state.perGroup[g] === o ? " active" : ""), o);

  function downloadPDF(analysis, scenarioText, decisionText) {
    // Load jsPDF dynamically if not already loaded
    function actuallyGenerate() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "letter" });
      const margin = 54; // 0.75 inch
      const pageW = 612;
      const pageH = 792;
      const maxW = pageW - margin * 2;
      let y = margin;

      function tierColor(s) { return s >= 7 ? [47,107,62] : s >= 4 ? [200,157,60] : [155,44,44]; }
      function tierLabel(s) { return s >= 7 ? "Protects" : s >= 4 ? "Neutral" : "Risks"; }

      // Cream background header band
      doc.setFillColor(250, 246, 237);
      doc.rect(0, 0, pageW, 130, "F");

      // Title
      doc.setFont("times", "normal");
      doc.setFontSize(28);
      doc.setTextColor(26, 58, 82);
      doc.text("The Boardroom Decision Lab", margin, margin + 10);

      // Meta line
      doc.setFontSize(10);
      doc.setTextColor(107, 114, 128);
      doc.setFont("helvetica", "normal");
      doc.text((data.name || "—") + "  ·  " + (data.role || "—") + "  ·  " + new Date().toLocaleDateString(), margin, margin + 32);

      y = margin + 70;

      // Scenario/Decision navy box
      doc.setFillColor(26, 58, 82);
      doc.rect(margin, y, maxW, 58, "F");
      doc.setTextColor(247, 245, 241);
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text("SCENARIO", margin + 14, y + 18);
      doc.setFont("helvetica", "normal");
      doc.text(doc.splitTextToSize(scenarioText || "—", maxW - 28), margin + 14, y + 32);
      doc.setFont("helvetica", "bold");
      doc.text("PROPOSED DECISION", margin + 14, y + 46);
      doc.setFont("helvetica", "normal");
      const decLines = doc.splitTextToSize(decisionText || "—", maxW - 160);
      doc.text(decLines, margin + 130, y + 46);

      y += 78;

      // Decision Profile header
      doc.setFont("times", "normal");
      doc.setFontSize(18);
      doc.setTextColor(26, 58, 82);
      doc.text("Decision Profile", margin, y);
      y += 20;

      // Scoring legend
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      let lx = margin;
      const legendY = y;
      const legend = [
        { label: "PROTECTS (7-10)", color: [47, 107, 62] },
        { label: "NEUTRAL (4-6)", color: [200, 157, 60] },
        { label: "RISKS (0-3)", color: [155, 44, 44] }
      ];
      legend.forEach(function(item) {
        doc.setFillColor(item.color[0], item.color[1], item.color[2]);
        doc.circle(lx + 4, legendY + 4, 3, "F");
        doc.setTextColor(75, 85, 99);
        doc.text(item.label, lx + 12, legendY + 6);
        lx += doc.getTextWidth(item.label) + 30;
      });
      y += 18;

      // Scores table
      doc.setFontSize(10);
      const dims = [
        ["Instructional Protection", "instructionalProtection"],
        ["System Capacity", "systemCapacity"],
        ["Differential Impact", "differentialImpact"],
        ["Decision Quality", "decisionQuality"],
        ["Communication Clarity", "communicationClarity"]
      ];
      dims.forEach(function(pair) {
        const label = pair[0], key = pair[1];
        const score = (analysis.scores && analysis.scores[key] != null) ? analysis.scores[key] : 0;
        const note = (analysis.notes && analysis.notes[key]) || "";
        const noteLines = doc.splitTextToSize(note, maxW - 220);
        const rowH = Math.max(28, 14 + noteLines.length * 12);
        // label
        doc.setFont("helvetica", "bold");
        doc.setTextColor(26, 58, 82);
        doc.text(label, margin, y + 10);
        // score + tier
        const c = tierColor(score);
        doc.setTextColor(c[0], c[1], c[2]);
        doc.text(score + "/10", margin + 165, y + 10);
        doc.setFont("helvetica", "normal");
        doc.text(tierLabel(score).toUpperCase(), margin + 200, y + 10);
        // note
        doc.setTextColor(75, 85, 99);
        doc.text(noteLines, margin + 260, y + 10);
        // separator
        doc.setDrawColor(229, 224, 210);
        doc.line(margin, y + rowH, margin + maxW, y + rowH);
        y += rowH;
        if (y > pageH - 80) { doc.addPage(); y = margin; }
      });

      // Named gaps
      if (analysis.namedGaps && analysis.namedGaps.length) {
        y += 12;
        if (y > pageH - 120) { doc.addPage(); y = margin; }
        doc.setFont("times", "normal");
        doc.setFontSize(14);
        doc.setTextColor(26, 58, 82);
        doc.text("Named Process Gaps", margin, y);
        y += 16;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.setTextColor(26, 58, 82);
        analysis.namedGaps.forEach(function(g) {
          const lines = doc.splitTextToSize("• " + g, maxW - 20);
          doc.text(lines, margin + 10, y);
          y += lines.length * 12 + 6;
          if (y > pageH - 80) { doc.addPage(); y = margin; }
        });
      }

      // Reflection Brief
      y += 16;
      if (y > pageH - 200) { doc.addPage(); y = margin; }
      doc.setFont("times", "normal");
      doc.setFontSize(14);
      doc.setTextColor(196, 154, 60);
      doc.text("REFLECTION BRIEF", margin, y);
      y += 18;

      // Clean blanks in paragraphs
      function cleanBlanks(t) {
        if (!t) return "";
        return t.replace(/_{5,}/g, "__________ (a blank you haven't filled in yet)").replace(/___ /g, "__________ (a blank you haven't filled in yet) ");
      }

      doc.setFont("times", "normal");
      doc.setFontSize(11);
      doc.setTextColor(26, 58, 82);
      [analysis.paragraph1, analysis.paragraph2].forEach(function(para) {
        if (!para) return;
        const lines = doc.splitTextToSize(cleanBlanks(para), maxW);
        lines.forEach(function(line) {
          if (y > pageH - 60) { doc.addPage(); y = margin; }
          doc.text(line, margin, y);
          y += 15;
        });
        y += 10;
      });

      // Footer
      const totalPages = doc.internal.getNumberOfPages();
      for (let p = 1; p <= totalPages; p++) {
        doc.setPage(p);
        doc.setFontSize(8);
        doc.setTextColor(107, 114, 128);
        doc.text("ineedcoaching.org  ·  The Boardroom Decision Lab", margin, pageH - 30);
        doc.text("Page " + p + " of " + totalPages, pageW - margin - 60, pageH - 30);
      }

      const filename = "decision-brief-" + (data.name || "session").replace(/\s+/g, "-").toLowerCase() + "-" + new Date().toISOString().slice(0, 10) + ".pdf";
      doc.save(filename);
    }

    if (window.jspdf && window.jspdf.jsPDF) {
      actuallyGenerate();
    } else {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.onload = actuallyGenerate;
      s.onerror = function() { alert("Could not load PDF library. Please try again."); };
      document.head.appendChild(s);
    }
  }

  function render() {
    const renderers = { landing: renderLanding, scenario: renderScenario, decision: renderDecision, concerns: renderConcerns, clarity: renderClarity, pass1: renderPass1, pass2: renderPass2, pass3: renderPass3, pass4: renderPass4, pass5: renderPass5, filter: renderFilter, confidence: renderConfidence, final: renderFinal };
    mount((renderers[phase] || renderLanding)());
    document.getElementById("demoBtn").style.display = phase === "landing" ? "block" : "none";
  }

  function startDemoMode() { data = Object.assign({}, DEMO); phase = "final"; render(); }

  function init() {
    const saved = loadLocal();
    if (saved && saved.data && saved.data.name && saved.phase !== "landing") {
      const hoursOld = (Date.now() - saved.ts) / 3600000;
      if (hoursOld < 24 && confirm("Resume unfinished session?")) { data = saved.data; phase = saved.phase; }
      else { clearLocal(); }
    }
    render();
  }

  return { init: init, startDemoMode: startDemoMode };
})();

document.addEventListener("DOMContentLoaded", DL.init);
</script>
<script src="/bug-report-widget.js" defer></script>
</body>
</html>
