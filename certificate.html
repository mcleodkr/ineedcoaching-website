<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of Completion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cabinet Grotesk', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #e8e8e8; padding: 40px 20px; }
.cert { width: 800px; min-height: 560px; position: relative; }
.print-bar { text-align: center; margin-bottom: 20px; }
.print-btn { background: #1a2e1a; color: white; border: none; padding: 10px 28px; border-radius: 50px; font-family: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
@media print { .print-bar { display: none !important; } body { background: white; padding: 0; } .cert { width: 100%; } }

/* ═══ PRESTIGE ═══ */
.prestige { background: #0e1a0e; padding: 48px; text-align: center; border: 3px solid rgba(196,154,60,0.3); }
.prestige .inner { border: 1.5px solid rgba(196,154,60,0.2); padding: 40px 36px; }
.prestige .star { width: 48px; height: 48px; border: 2px solid #c49a3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.4rem; color: #c49a3c; }
.prestige .brand { font-size: 0.55rem; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: #c49a3c; margin-bottom: 16px; }
.prestige .rule { height: 1px; background: linear-gradient(90deg, transparent, rgba(196,154,60,0.4), transparent); margin: 18px 0; }
.prestige .pre { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(196,154,60,0.5); margin-bottom: 8px; }
.prestige .name { font-family: Georgia, serif; font-size: 26px; color: #f7f4ee; margin-bottom: 8px; }
.prestige .course { font-size: 13px; color: #c49a3c; margin-bottom: 4px; }
.prestige .coach { font-size: 0.65rem; color: rgba(247,244,238,0.4); margin-bottom: 4px; }
.prestige .footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 24px; padding-top: 12px; }
.prestige .sig { border-top: 1px solid rgba(196,154,60,0.3); width: 160px; padding-top: 6px; font-size: 0.6rem; color: rgba(247,244,238,0.35); }
.prestige .meta { text-align: right; font-size: 0.55rem; color: rgba(247,244,238,0.3); line-height: 1.6; }

/* ═══ EDITORIAL ═══ */
.editorial { background: white; overflow: hidden; }
.editorial .top { background: #1a2e1a; padding: 48px 48px 36px; text-align: center; }
.editorial .tag { font-size: 0.55rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #c49a3c; margin-bottom: 16px; }
.editorial .name { font-family: Georgia, serif; font-size: 26px; color: #f7f4ee; line-height: 1.3; }
.editorial .bottom { padding: 36px 48px 40px; }
.editorial .label { font-size: 0.55rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #999; margin-bottom: 8px; }
.editorial .course { font-size: 16px; font-weight: 700; color: #1a2e1a; margin-bottom: 4px; }
.editorial .coach { font-size: 0.78rem; color: #999; margin-bottom: 16px; }
.editorial .gold-rule { width: 40px; height: 2px; background: #c49a3c; margin-bottom: 24px; }
.editorial .footer { display: flex; justify-content: space-between; align-items: flex-end; }
.editorial .sig { border-top: 1px solid #ddd; width: 160px; padding-top: 6px; font-size: 0.6rem; color: #999; }
.editorial .meta { text-align: right; font-size: 0.55rem; color: #bbb; line-height: 1.6; }

/* ═══ GEOMETRIC ═══ */
.geometric { background: #f7f4ee; position: relative; padding: 0; }
.geometric .bar { height: 8px; background: #1a2e1a; }
.geometric .body { padding: 48px; position: relative; }
.geometric .watermark { position: absolute; top: 60px; left: 48px; font-size: 36px; font-weight: 900; color: rgba(26,46,26,0.06); letter-spacing: 0.1em; text-transform: uppercase; pointer-events: none; }
.geometric .dot { position: absolute; top: 28px; right: 48px; width: 12px; height: 12px; border-radius: 50%; background: #c49a3c; }
.geometric .name { font-size: 22px; font-weight: 800; color: #1a2e1a; margin-bottom: 12px; margin-top: 40px; }
.geometric .text { font-size: 0.78rem; color: #888; line-height: 1.6; margin-bottom: 16px; }
.geometric .badge { display: inline-block; background: #1a2e1a; color: #c49a3c; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 14px; border-radius: 50px; margin-bottom: 20px; }
.geometric .course { font-size: 14px; font-weight: 700; color: #1a2e1a; margin-bottom: 4px; }
.geometric .coach { font-size: 0.75rem; color: #888; margin-bottom: 24px; }
.geometric .footer { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid #ddd; padding-top: 16px; }
.geometric .sig { border-top: 1px solid #1a2e1a; width: 160px; padding-top: 6px; font-size: 0.6rem; color: #888; }
.geometric .meta { text-align: right; font-size: 0.55rem; color: #aaa; line-height: 1.6; }

/* ═══ WARMTH ═══ */
.warmth { background: white; display: flex; overflow: hidden; }
.warmth .left-bar { width: 8px; background: #4a7c59; flex-shrink: 0; }
.warmth .content { padding: 48px; flex: 1; }
.warmth .brand { font-size: 0.55rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #4a7c59; margin-bottom: 20px; }
.warmth .pre { font-size: 0.72rem; color: #888; margin-bottom: 8px; }
.warmth .name { font-family: Georgia, serif; font-size: 22px; color: #4a7c59; margin-bottom: 16px; }
.warmth .label { font-size: 0.55rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #888; margin-bottom: 6px; }
.warmth .course { font-size: 15px; font-weight: 700; color: #1a2e1a; margin-bottom: 4px; }
.warmth .cohort { font-size: 0.78rem; color: #4a7c59; margin-bottom: 20px; }
.warmth .rule { height: 1px; background: #e0ddd5; margin-bottom: 24px; }
.warmth .footer { display: flex; justify-content: space-between; align-items: flex-end; }
.warmth .sig { border-top: 2px solid #4a7c59; width: 180px; padding-top: 8px; }
.warmth .sig-name { font-size: 0.78rem; font-weight: 700; color: #1a2e1a; }
.warmth .sig-title { font-size: 0.6rem; color: #888; }
.warmth .meta { text-align: right; font-size: 0.6rem; color: #aaa; line-height: 1.6; }
</style>
</head>
<body>

<div class="print-bar"><button class="print-btn" onclick="window.print()">Print Certificate</button></div>
<div class="cert" id="cert"></div>

<script>
var params = new URLSearchParams(window.location.search);
var template = params.get('template') || 'prestige';
var student = params.get('student') || 'Student';
var course = params.get('course') || 'Course';
var coach = params.get('coach') || 'Coach';
var date = params.get('date') || new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
var certId = params.get('id') || 'CERT-' + Math.random().toString(36).substring(2, 10).toUpperCase();

// Also try fetching from Supabase if id param is a UUID
(async function() {
  if (params.get('id') && params.get('id').includes('-')) {
    try {
      var SUPA = 'https://qroizygknxdjsstkezsf.supabase.co';
      var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4';
      var res = await fetch(SUPA + '/rest/v1/coach_course_enrollments?certificate_id=eq.' + params.get('id') + '&select=*,coach_courses(title,certificate_template,coach_profiles(display_name))&limit=1', {
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }
      });
      var rows = await res.json();
      if (rows && rows.length) {
        var e = rows[0];
        student = e.student_email ? e.student_email.split('@')[0] : student;
        course = e.coach_courses ? e.coach_courses.title : course;
        coach = e.coach_courses && e.coach_courses.coach_profiles ? e.coach_courses.coach_profiles.display_name : coach;
        date = e.completed_at ? new Date(e.completed_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : date;
        certId = e.certificate_id || certId;
        template = e.coach_courses ? (e.coach_courses.certificate_template || template) : template;
      }
    } catch(err) {}
  }
  render();
})();

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render() {
  var el = document.getElementById('cert');

  if (template === 'prestige') {
    el.innerHTML =
      '<div class="prestige"><div class="inner">' +
        '<div class="star">&#9733;</div>' +
        '<div class="brand">ineedcoaching.org</div>' +
        '<div class="rule"></div>' +
        '<div class="pre">This certificate is presented to</div>' +
        '<div class="name">' + esc(student) + '</div>' +
        '<div class="pre">in recognition of completing</div>' +
        '<div class="course">' + esc(course) + '</div>' +
        '<div class="coach">with ' + esc(coach) + '</div>' +
        '<div class="rule"></div>' +
        '<div class="footer"><div class="sig">Signature</div><div class="meta">' + esc(date) + '<br>' + esc(certId) + '</div></div>' +
      '</div></div>';
  } else if (template === 'editorial') {
    el.innerHTML =
      '<div class="editorial">' +
        '<div class="top">' +
          '<div class="tag">Certificate of Completion</div>' +
          '<div class="name">' + esc(student) + '</div>' +
        '</div>' +
        '<div class="bottom">' +
          '<div class="label">Successfully completed</div>' +
          '<div class="course">' + esc(course) + '</div>' +
          '<div class="coach">with ' + esc(coach) + '</div>' +
          '<div class="gold-rule"></div>' +
          '<div class="footer"><div class="sig">Signature</div><div class="meta">' + esc(date) + '<br>' + esc(certId) + '</div></div>' +
        '</div>' +
      '</div>';
  } else if (template === 'geometric') {
    el.innerHTML =
      '<div class="geometric">' +
        '<div class="bar"></div>' +
        '<div class="body">' +
          '<div class="watermark">CERTIFICATE</div>' +
          '<div class="dot"></div>' +
          '<div class="name">' + esc(student) + '</div>' +
          '<div class="text">Has successfully completed the following program and demonstrated commitment to personal and professional growth.</div>' +
          '<div class="badge">ineedcoaching.org</div><br>' +
          '<div class="course">' + esc(course) + '</div>' +
          '<div class="coach">with ' + esc(coach) + '</div>' +
          '<div class="footer"><div class="sig">Signature</div><div class="meta">Certificate ID: ' + esc(certId) + '<br>' + esc(date) + '</div></div>' +
        '</div>' +
      '</div>';
  } else if (template === 'warmth') {
    el.innerHTML =
      '<div class="warmth">' +
        '<div class="left-bar"></div>' +
        '<div class="content">' +
          '<div class="brand">ineedtherapy.org</div>' +
          '<div class="pre">This certificate recognizes that</div>' +
          '<div class="name">' + esc(student) + '</div>' +
          '<div class="label">Completed</div>' +
          '<div class="course">' + esc(course) + '</div>' +
          '<div class="cohort">May 2026 Cohort</div>' +
          '<div class="rule"></div>' +
          '<div class="footer">' +
            '<div class="sig"><div class="sig-name">Dr. Kimberly McLeod EdD LPC-A</div><div class="sig-title">Facilitator</div></div>' +
            '<div class="meta">' + esc(date) + '<br>' + esc(certId) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }
}
</script>
</body>
</html>
