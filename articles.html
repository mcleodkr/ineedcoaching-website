<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles | ineedcoaching.org</title>
<meta name="description" content="Articles on leadership, burnout recovery, career transitions, and building a coaching practice.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --navy: #1a3a52; --gold: #c49a3c; --gold-lt: #faf3e0; --cream: #f7f4ee; --white: #ffffff; --muted: #8a8a9a; --border: #e0ddd5; --r: 14px; --r-sm: 8px; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cabinet Grotesk', sans-serif; background: var(--cream); color: var(--navy); }

nav { position: fixed; top: 0; left: 0; right: 0; z-index: 300; display: flex; align-items: center; justify-content: space-between; padding: 14px 52px; background: rgba(26,58,82,0.95); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.1); }
nav a.logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: #f7f4ee; text-decoration: none; }
.logo-i, .logo-c { color: var(--gold); font-style: italic; }
.nav-links { display: flex; align-items: center; gap: 22px; }
.nav-links a { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.nav-links a:hover { color: var(--gold); }
.nav-pill { background: var(--gold); color: var(--navy) !important; padding: 8px 18px; border-radius: 50px; }

.page-wrap { max-width: 1100px; margin: 0 auto; padding: 120px 24px 80px; }
.page-header { text-align: center; margin-bottom: 32px; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.6rem); color: var(--navy); margin-bottom: 10px; }
.page-header h1 em { color: var(--gold); font-style: italic; }
.page-header p { font-size: 0.92rem; color: var(--muted); max-width: 500px; margin: 0 auto; line-height: 1.7; }

.tabs { display: flex; justify-content: center; gap: 0; margin-bottom: 32px; border-bottom: 2px solid var(--border); }
.tab { padding: 12px 28px; font-family: 'Cabinet Grotesk', sans-serif; font-size: 0.88rem; font-weight: 700; color: var(--muted); background: none; border: none; cursor: pointer; position: relative; transition: color 0.2s; }
.tab:hover { color: var(--navy); }
.tab.active { color: var(--navy); }
.tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background: var(--gold); border-radius: 2px 2px 0 0; }

.search-row { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
.search-row input { flex: 1; min-width: 200px; padding: 10px 18px; border: 1.5px solid var(--border); border-radius: 50px; font-family: inherit; font-size: 0.85rem; outline: none; }
.search-row input:focus { border-color: var(--gold); }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.card { display: block; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--r); padding: 24px; text-decoration: none; transition: all 0.25s; }
.card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(196,154,60,0.08); }
.card-cat { font-size: 0.63rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.card-title { font-size: 0.95rem; font-weight: 700; color: var(--navy); line-height: 1.4; margin-bottom: 8px; }
.card-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.55; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-link { font-size: 0.75rem; font-weight: 700; color: var(--gold); }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); grid-column: 1/-1; }

footer { background: var(--navy); padding: 40px 52px; text-align: center; }
.f-logo { font-family: 'Playfair Display', serif; font-size: 1rem; color: #f7f4ee; margin-bottom: 8px; }
.f-note { font-size: 0.72rem; color: var(--muted); }
.f-note a { color: var(--gold); text-decoration: none; }

@media (max-width: 900px) { nav { padding: 12px 20px; } .grid { grid-template-columns: 1fr 1fr; } .page-wrap { padding: 100px 18px 60px; } }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .nav-links a:not(.nav-pill) { display: none; } footer { padding: 32px 20px; } }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo"><span class="logo-i">i</span>need<span class="logo-c">coaching</span>.org</a>
  <div class="nav-links">
    <a href="/coaches.html">Coaches</a>
    <a href="/sessions.html">Sessions</a>
    <a href="/coach-courses.html">Courses</a>
    <a href="/articles.html">Articles</a>
    <a href="/coaching-commons.html">Commons</a>
    <a href="/coach-dashboard.html">Dashboard</a>
    <a href="/coach-signup.html" class="nav-pill">List Your Practice</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Articles for your <em>journey.</em></h1>
    <p>Whether you are seeking coaching or building a coaching practice, there is something here for you.</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('individual')">For Individuals</button>
    <button class="tab" onclick="switchTab('coach')">For Coaches</button>
  </div>

  <div class="search-row">
    <input type="text" id="article-search" placeholder="Search articles..." oninput="filterArticles()">
  </div>

  <div class="grid" id="articles-grid">
    <div class="empty">Loading articles...</div>
  </div>
</div>

<footer>
  <div class="f-logo"><span class="logo-i">i</span>need<span class="logo-c">coaching</span>.org</div>
  <p class="f-note">A project from <a href="https://www.ineedtherapy.org">ineedtherapy.org</a></p>
</footer>

<script>
var SUPABASE_URL = 'https://qroizygknxdjsstkezsf.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyb2l6eWdrbnhkanNzdGtlenNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTQ3MTEsImV4cCI6MjA5MDI5MDcxMX0.ZnSxf8LIDe_HPedgMPTwRpVE_VJmYSSFecwqrlNvjQ4';

var _allArticles = [];
var _currentTab = 'individual';

var COACH_CATEGORIES = ['Coaching and Growth', 'Coaching & Growth', 'Getting Clients', 'Niche and Positioning', 'Business of Coaching', 'For Providers', 'Coaching Tools', 'Client Retention', 'Credibility and Trust', 'Practice Growth', 'AI and Documentation'];

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

async function loadArticles() {
  try {
    var res = await fetch(SUPABASE_URL + '/rest/v1/articles?or=(audience.eq.coach,audience.eq.coaching-consumer)&select=title,slug,meta_description,category&order=created_at.desc&limit=200', {
      headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY }
    });
    _allArticles = await res.json();
    if (!_allArticles || _allArticles.error) _allArticles = [];
    filterArticles();
  } catch(e) {
    document.getElementById('articles-grid').innerHTML = '<div class="empty">Could not load articles.</div>';
  }
}

function switchTab(tab) {
  _currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
  filterArticles();
}

function filterArticles() {
  var search = (document.getElementById('article-search').value || '').toLowerCase();
  var filtered = _allArticles.filter(function(a) {
    var isCoachCat = COACH_CATEGORIES.some(function(c) { return (a.category || '').toLowerCase() === c.toLowerCase(); });
    if (_currentTab === 'individual' && isCoachCat) return false;
    if (_currentTab === 'coach' && !isCoachCat) return false;
    if (search && (a.title || '').toLowerCase().indexOf(search) === -1 && (a.meta_description || '').toLowerCase().indexOf(search) === -1) return false;
    return true;
  });
  renderArticles(filtered);
}

function renderArticles(articles) {
  var grid = document.getElementById('articles-grid');
  if (!articles.length) { grid.innerHTML = '<div class="empty">No articles found.</div>'; return; }
  grid.innerHTML = articles.map(function(a) {
    return '<a href="/article.html?slug=' + encodeURIComponent(a.slug) + '" class="card">' +
      '<div class="card-cat">' + esc(a.category || 'Article') + '</div>' +
      '<div class="card-title">' + esc(a.title) + '</div>' +
      '<div class="card-desc">' + esc(a.meta_description || '') + '</div>' +
      '<span class="card-link">Read article →</span></a>';
  }).join('');
}

loadArticles();
</script>
</body>
</html>
